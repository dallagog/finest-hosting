<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src  'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        style-src   'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        font-src    'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src     'self' data: https: blob:;
        connect-src 'self' https://feweb-tunnel.fe-web.eu wss://feweb-tunnel.fe-web.eu ws://feweb-tunnel.fe-web.eu wss: ws:;
        worker-src  blob:;
    ">
    <title>Remote Terminal – Finest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="images/icon-finest.png">

    <!-- xterm.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap');

        :root {
            --bg-color: #f5f5f0;
            --neon-cyan: #000000;
            --neon-blue: #333333;
            --glass-bg: #ffffff;
            --text-color: #333333;
            --border-color: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--bg-color);
            padding: 20px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            flex-shrink: 0;
        }

        .header-bar h1 {
            flex: 1;
            text-align: center;
            margin: 0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #000;
            font-size: 1.6em;
        }

        .user-info-left {
            flex: 1;
            font-size: 14px;
            color: var(--neon-cyan);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .user-info-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse-dot 2s infinite;
        }

        .status-dot.off {
            background: #ef4444;
            animation: none;
        }

        .status-dot.connecting {
            background: #f59e0b;
            animation: pulse-dot 0.8s infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        .logout-container {
            flex: 1;
            text-align: right;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .close-btn {
            padding: 8px 16px;
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff3333;
            color: #ff3333;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            font-weight: bold;
        }

        .close-btn:hover {
            background: rgba(255, 0, 0, 0.4);
            box-shadow: 0 0 10px #ff3333;
        }

        .reconnect-btn {
            padding: 8px 16px;
            background: #000;
            border: 1px solid #000;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            font-weight: bold;
        }

        .reconnect-btn:hover {
            background: #333;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .terminal-panel {
            background: var(--glass-bg);
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .terminal-titlebar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid #eee;
            background: #fafafa;
            flex-shrink: 0;
        }

        .terminal-title {
            font-size: 16px;
            font-weight: 600;
            color: #000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .connection-badge {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .badge-connected {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }

        .badge-connecting {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
        }

        .badge-disconnected {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        #terminal-container {
            flex: 1;
            min-height: 0;
            background: #1e1e1e;
            padding: 6px;
            overflow: hidden;
        }

        .statusbar {
            display: flex;
            gap: 20px;
            padding: 6px 20px;
            border-top: 1px solid #eee;
            font-size: 11px;
            color: #999;
            background: #fafafa;
            flex-shrink: 0;
        }

        .statusbar span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .statusbar i {
            font-size: 10px;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(245, 245, 240, 0.88);
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 100;
            transition: opacity 0.25s;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #ddd;
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #overlay-msg {
            color: #000;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        #overlay-sub {
            color: #666;
            font-size: 11px;
        }

        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #fff0f0;
            border: 1px solid #ff3333;
            color: #cc0000;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 13px;
            max-width: 380px;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 200;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="header-bar">
        <div class="user-info-left">
            <div class="user-info-row">
                <strong>Utente:</strong>
                <span id="usernameDisplay">—</span>
                <span style="opacity:.4">|</span>
                <span class="status-dot off" id="statusDot"></span>
                <span id="connectionStatus">Disconnesso</span>
            </div>
            <div class="user-info-row" style="font-size:12px; color:#666;">
                <i class="fa fa-server" style="font-size:10px"></i>
                <span id="serverLabel">feweb-tunnel.fe-web.eu</span>
                <span style="opacity:.4">|</span>
                <span id="dimLabel">—</span>
            </div>
        </div>

        <h1><i class="fa fa-terminal"></i> Remote Terminal</h1>

        <div class="logout-container">
            <button class="reconnect-btn" id="btnReconnect" onclick="reconnect()">
                <i class="fa fa-rotate-right"></i> Riconnetti
            </button>
            <button class="close-btn" onclick="closePage()">
                <i class="fa fa-times"></i> Chiudi
            </button>
        </div>
    </div>

    <div class="terminal-panel">
        <div class="terminal-titlebar">
            <div class="terminal-title">
                <i class="fa fa-terminal"></i>
                <span id="termTitle">bash – non connesso</span>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
                <span class="connection-badge badge-disconnected" id="connBadge">OFFLINE</span>
            </div>
        </div>

        <div id="terminal-container"></div>

        <div class="statusbar">
            <span><i class="fa fa-microchip"></i> xterm.js 5.3</span>
            <span id="sbDim"><i class="fa fa-expand"></i> —</span>
            <span id="sbLatency"><i class="fa fa-clock"></i> —</span>
            <span><i class="fa fa-globe"></i> <span id="sbServerLabel">—</span></span>
        </div>
    </div>

    <div id="overlay">
        <div class="spinner"></div>
        <div id="overlay-msg">Connessione in corso…</div>
        <div id="overlay-sub">Autenticazione al server remoto</div>
    </div>

    <div id="toast"></div>

    <script>
        const API_URL = "https://feweb-tunnel.fe-web.eu";
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const WS_URL = `${wsProtocol}//feweb-tunnel.fe-web.eu`;
        const PING_INTERVAL_MS = 25_000;

        let credentials = { username: '', token: '', language: '' };
        let ws = null;
        let term = null;
        let fitAddon = null;
        let pingTimer = null;
        let resizeObserver = null;
        let termRows = 24, termCols = 80;

        function getCredentials() {
            const p = new URLSearchParams(window.location.search);
            const urlUsername = p.get('username');
            const urlToken = p.get('token');
            const urlLanguage = p.get('language');

            console.log('[AUTH] URL params ->', { urlUsername, urlToken: urlToken ? urlToken.substring(0, 8) + '…' : null, urlLanguage });
            console.log('[AUTH] localStorage ->', {
                username: localStorage.getItem('username'),
                token: localStorage.getItem('token') ? localStorage.getItem('token').substring(0, 8) + '…' : null,
                language: localStorage.getItem('language'),
            });

            credentials = {
                username: urlUsername || localStorage.getItem('username') || 'admin',
                token: urlToken || localStorage.getItem('token') || '',
                language: urlLanguage || localStorage.getItem('language') || 'it_IT',
            };

            // Persist to localStorage so future reloads (without URL params) still work
            if (urlUsername) localStorage.setItem('username', urlUsername);
            if (urlToken) localStorage.setItem('token', urlToken);
            if (urlLanguage) localStorage.setItem('language', urlLanguage);

            console.log('[AUTH] credentials resolved ->', {
                username: credentials.username,
                token: credentials.token ? credentials.token.substring(0, 8) + '…' : '(empty)',
                language: credentials.language,
            });
        }

        function initTerminal() {
            if (term) { term.dispose(); }

            term = new Terminal({
                cursorBlink: true,
                cursorStyle: 'block',
                fontFamily: "'Cascadia Code', 'Consolas', 'Courier New', monospace",
                fontSize: 14,
                lineHeight: 1.35,
                theme: {
                    background: '#1e1e1e',
                    foreground: '#d4d4d4',
                    cursor: '#ffffff',
                    cursorAccent: '#1e1e1e',
                    black: '#1e1e1e',
                    red: '#f44747',
                    green: '#6a9955',
                    yellow: '#dcdcaa',
                    blue: '#569cd6',
                    magenta: '#c586c0',
                    cyan: '#4ec9b0',
                    white: '#d4d4d4',
                    brightBlack: '#808080',
                    brightRed: '#f44747',
                    brightGreen: '#b5cea8',
                    brightYellow: '#dcdcaa',
                    brightBlue: '#9cdcfe',
                    brightMagenta: '#c586c0',
                    brightCyan: '#4ec9b0',
                    brightWhite: '#ffffff',
                    selectionBackground: 'rgba(255,255,255,0.2)',
                },
                allowProposedApi: true,
                scrollback: 5000,
                convertEol: false,
            });

            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.loadAddon(new WebLinksAddon.WebLinksAddon());

            const container = document.getElementById('terminal-container');
            term.open(container);
            fitAddon.fit();

            termRows = term.rows;
            termCols = term.cols;
            updateDimLabel();

            term.onData(data => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'input', data }));
                }
            });

            if (resizeObserver) resizeObserver.disconnect();
            resizeObserver = new ResizeObserver(() => { fitTerm(); });
            resizeObserver.observe(container);
        }

        function fitTerm() {
            if (!fitAddon || !term) return;
            try {
                fitAddon.fit();
                const r = term.rows, c = term.cols;
                if (r !== termRows || c !== termCols) {
                    termRows = r; termCols = c;
                    updateDimLabel();
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'resize', rows: r, cols: c }));
                    }
                }
            } catch (e) { }
        }

        function updateDimLabel() {
            const txt = `${termCols}×${termRows}`;
            document.getElementById('dimLabel').textContent = txt;
            document.getElementById('sbDim').innerHTML = `<i class="fa fa-expand"></i> ${txt}`;
        }

        function connect() {
            console.log('[WS] connect() called');
            if (ws) { try { ws.close(); } catch (e) { } ws = null; }

            setStatus('connecting');
            showOverlay('Connessione in corso…', 'Apertura WebSocket verso il server remoto');

            const url = `${WS_URL}/ws/terminal/${encodeURIComponent(credentials.username)}`;
            console.log('[WS] connecting to:', url);
            document.getElementById('sbServerLabel').textContent = new URL(API_URL).hostname;

            try {
                ws = new WebSocket(url);
                ws.binaryType = 'arraybuffer';
                console.log('[WS] WebSocket object created, readyState:', ws.readyState);
            } catch (e) {
                console.error('[WS] WebSocket creation failed:', e);
                showToast('Errore durante la creazione del WebSocket: ' + e.message);
                setStatus('disconnected');
                hideOverlay();
                return;
            }

            ws.onopen = () => {
                console.log('[WS] onopen – sending auth, token:', credentials.token ? credentials.token.substring(0, 8) + '…' : '(empty)', 'rows:', termRows, 'cols:', termCols);
                ws.send(JSON.stringify({
                    type: 'auth',
                    token: credentials.token,
                    rows: termRows,
                    cols: termCols,
                }));
                setStatus('connecting');
                showOverlay('Autenticazione…', 'Verifica credenziali sul server');
                startPing();
            };

            ws.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    console.log('[WS] binary frame received, bytes:', event.data.byteLength);
                    if (term) {
                        term.write(new Uint8Array(event.data));
                        if (!document.getElementById('overlay').classList.contains('hidden')) {
                            console.log('[WS] first data received → setting connected');
                            setStatus('connected');
                            hideOverlay();
                        }
                    }
                } else {
                    console.log('[WS] text frame received:', event.data);
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === 'error') {
                            console.error('[WS] server error:', msg.msg);
                            showToast('Errore server: ' + msg.msg);
                            setStatus('disconnected');
                            hideOverlay();
                            if (term) term.writeln('\r\n\x1b[31m[ERRORE] ' + msg.msg + '\x1b[0m\r\n');
                        } else {
                            console.log('[WS] JSON message type:', msg.type, msg);
                        }
                    } catch (e) {
                        console.warn('[WS] non-JSON text frame, writing to terminal:', event.data.substring(0, 120));
                        if (term) term.write(event.data);
                    }
                }
            };

            ws.onerror = (err) => {
                console.error('[WS] onerror event:', err);
                showToast('Impossibile stabilire una connessione WebSocket con il server');
                setStatus('disconnected');
                hideOverlay();
            };

            ws.onclose = (event) => {
                console.log('[WS] onclose – code:', event.code, 'reason:', event.reason, 'wasClean:', event.wasClean);
                stopPing();
                setStatus('disconnected');
                hideOverlay();
                if (term) term.writeln('\r\n\x1b[33m[Connessione chiusa dall\'host o dal gateway]\x1b[0m');
            };
        }

        function reconnect() {
            if (term) term.writeln('\r\n\x1b[34m[Riconnessione…]\x1b[0m');
            setTimeout(connect, 300);
        }

        function startPing() {
            stopPing();
            pingTimer = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'ping' }));
                }
            }, PING_INTERVAL_MS);
        }

        function stopPing() {
            if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
        }

        function setStatus(state) {
            const dot = document.getElementById('statusDot');
            const label = document.getElementById('connectionStatus');
            const badge = document.getElementById('connBadge');
            const title = document.getElementById('termTitle');

            dot.className = 'status-dot';
            badge.className = 'connection-badge';

            if (state === 'connected') {
                label.textContent = 'Connesso';
                badge.classList.add('badge-connected');
                badge.textContent = 'ONLINE';
                title.textContent = `bash – ${credentials.username}@${new URL(API_URL).hostname}`;
                document.getElementById('btnReconnect').style.display = 'none';
            } else if (state === 'connecting') {
                dot.classList.add('connecting');
                label.textContent = 'Connessione…';
                badge.classList.add('badge-connecting');
                badge.textContent = 'CONNECTING';
                title.textContent = 'Connessione in corso…';
                document.getElementById('btnReconnect').style.display = 'none';
            } else {
                dot.classList.add('off');
                label.textContent = 'Disconnesso';
                badge.classList.add('badge-disconnected');
                badge.textContent = 'OFFLINE';
                title.textContent = 'bash – non connesso';
                document.getElementById('btnReconnect').style.display = 'inline-block';
            }
        }

        function showOverlay(msg, sub) {
            const ov = document.getElementById('overlay');
            document.getElementById('overlay-msg').textContent = msg || '';
            document.getElementById('overlay-sub').textContent = sub || '';
            ov.classList.remove('hidden');
        }

        function hideOverlay() {
            document.getElementById('overlay').classList.add('hidden');
        }

        let toastTimer = null;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 5000);
        }

        function closePage() {
            if (ws) { try { ws.close(); } catch (e) { } }
            window.close();
            setTimeout(() => window.history.back(), 100);
        }

        window.addEventListener('resize', () => { fitTerm(); });

        document.addEventListener('DOMContentLoaded', () => {
            console.log('[INIT] DOMContentLoaded');
            getCredentials();
            document.getElementById('usernameDisplay').textContent = credentials.username;

            initTerminal();

            if (!credentials.token) {
                console.error('[INIT] token missing! URL params:', window.location.search, '| localStorage.token:', localStorage.getItem('token'));
                setStatus('disconnected');
                hideOverlay();
                if (term) {
                    term.writeln('\x1b[31mErrore: token di autenticazione mancante.\x1b[0m');
                    term.writeln('\x1b[33mRicarica la pagina passando il parametro token corretto.\x1b[0m');
                    term.writeln('\x1b[90mURL corrente: ' + window.location.href + '\x1b[0m');
                }
                return;
            }

            console.log('[INIT] token present, calling connect()');
            connect();
        });
    </script>
</body>

</html>
