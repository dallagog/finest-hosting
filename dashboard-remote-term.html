<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src  'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        style-src   'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        font-src    'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src     'self' data: https: blob:;
        connect-src 'self' https://feweb-tunnel.fe-web.eu wss://feweb-tunnel.fe-web.eu;
        worker-src  blob:;
    ">
    <title>Remote Terminal – Finest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="images/icon-finest.png">

    <!-- xterm.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;500;700;900&display=swap');

        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --blue: #58a6ff;
            --green: #3fb950;
            --red: #f85149;
            --yellow: #d29922;
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, var(--bg) 0%, var(--surface) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 16px;
            overflow: hidden;
        }

        /* ── Header ── */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(22, 27, 34, 0.9);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(12px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .header-bar h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--blue);
            flex: 1;
            text-align: center;
        }

        .user-info-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
        }

        .user-info-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }

        .status-dot.off {
            background: var(--red);
            animation: none;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .header-right {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-danger {
            background: rgba(248, 81, 73, .1);
            border-color: var(--red);
            color: var(--red);
        }

        .btn-danger:hover {
            background: rgba(248, 81, 73, .25);
            box-shadow: 0 0 10px rgba(248, 81, 73, .4);
        }

        .btn-blue {
            background: rgba(88, 166, 255, .1);
            border-color: var(--blue);
            color: var(--blue);
        }

        .btn-blue:hover {
            background: rgba(88, 166, 255, .25);
        }

        /* ── Terminal window ── */
        .terminal-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .6), inset 0 0 30px rgba(88, 166, 255, .04);
            overflow: hidden;
            min-height: 0;
        }

        .terminal-titlebar {
            background: rgba(22, 27, 34, .9);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            flex-shrink: 0;
        }

        .terminal-title {
            color: var(--blue);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .traffic-lights {
            display: flex;
            gap: 6px;
        }

        .tl {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: opacity .2s, transform .2s;
        }

        .tl:hover {
            opacity: .75;
            transform: scale(1.15);
        }

        .tl-red {
            background: var(--red);
        }

        .tl-yellow {
            background: var(--yellow);
        }

        .tl-green {
            background: var(--green);
        }

        .connection-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: .5px;
        }

        .badge-connected {
            background: rgba(63, 185, 80, .15);
            color: var(--green);
            border: 1px solid rgba(63, 185, 80, .3);
        }

        .badge-connecting {
            background: rgba(210, 153, 34, .15);
            color: var(--yellow);
            border: 1px solid rgba(210, 153, 34, .3);
        }

        .badge-disconnected {
            background: rgba(248, 81, 73, .15);
            color: var(--red);
            border: 1px solid rgba(248, 81, 73, .3);
        }

        /* ── xterm container ── */
        #terminal-container {
            flex: 1;
            padding: 8px;
            overflow: hidden;
            min-height: 0;
        }

        /* ── Status bar ── */
        .statusbar {
            background: rgba(22, 27, 34, .6);
            border-top: 1px solid var(--border);
            padding: 5px 16px;
            font-size: 11px;
            color: rgba(201, 209, 217, .5);
            display: flex;
            gap: 20px;
            flex-shrink: 0;
        }

        .statusbar span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .statusbar i {
            font-size: 10px;
        }

        /* ── Overlay loading ── */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(13, 17, 23, .85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 100;
            transition: opacity .3s;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(88, 166, 255, .2);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #overlay-msg {
            color: var(--text);
            font-size: 14px;
            letter-spacing: .5px;
        }

        #overlay-sub {
            color: rgba(201, 209, 217, .4);
            font-size: 12px;
        }

        /* ── Error toast ── */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(248, 81, 73, .15);
            border: 1px solid var(--red);
            color: var(--red);
            padding: 12px 18px;
            border-radius: var(--radius);
            font-size: 13px;
            max-width: 360px;
            transform: translateY(80px);
            opacity: 0;
            transition: all .3s;
            z-index: 200;
        }

        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="header-bar">
        <div class="user-info-left">
            <div class="user-info-row">
                <strong id="userLabel">Utente:</strong>
                <span id="usernameDisplay">—</span>
                <span style="opacity:.4">|</span>
                <span class="status-dot off" id="statusDot"></span>
                <span id="connectionStatus">Disconnesso</span>
            </div>
            <div class="user-info-row" style="font-size:11px; opacity:.6">
                <i class="fa fa-server" style="font-size:10px"></i>
                <span id="serverLabel">feweb-tunnel.fe-web.eu</span>
                <span style="opacity:.4">|</span>
                <span id="dimLabel">—</span>
            </div>
        </div>

        <h1><i class="fa fa-terminal"></i> Remote Terminal</h1>

        <div class="header-right">
            <button class="btn btn-blue" id="btnReconnect" onclick="reconnect()" title="Riconnetti">
                <i class="fa fa-rotate-right"></i> Riconnetti
            </button>
            <button class="btn btn-danger" onclick="closePage()">
                <i class="fa fa-times"></i> Chiudi
            </button>
        </div>
    </div>

    <!-- Terminal window -->
    <div class="terminal-window">
        <div class="terminal-titlebar">
            <div class="traffic-lights">
                <div class="tl tl-red" title="Chiudi" onclick="closePage()"></div>
                <div class="tl tl-yellow" title="Riconnetti" onclick="reconnect()"></div>
                <div class="tl tl-green" title="Clear" onclick="clearTerm()"></div>
            </div>
            <div class="terminal-title">
                <i class="fa fa-terminal"></i>
                <span id="termTitle">bash – non connesso</span>
            </div>
            <span class="connection-badge badge-disconnected" id="connBadge">OFFLINE</span>
        </div>

        <div id="terminal-container"></div>

        <div class="statusbar">
            <span><i class="fa fa-microchip"></i> xterm.js 5.3</span>
            <span id="sbDim"><i class="fa fa-expand"></i> —</span>
            <span id="sbLatency"><i class="fa fa-clock"></i> —</span>
            <span id="sbServer"><i class="fa fa-globe"></i> <span id="sbServerLabel">—</span></span>
        </div>
    </div>

    <!-- Loading overlay -->
    <div id="overlay">
        <div class="spinner"></div>
        <div id="overlay-msg">Connessione in corso…</div>
        <div id="overlay-sub">Autenticazione al server remoto</div>
    </div>

    <!-- Error toast -->
    <div id="toast"></div>

    <script>
        // ─────────────────────────────────────────────────────────────────────
        // Config
        // ─────────────────────────────────────────────────────────────────────
        const API_URL = "https://feweb-tunnel.fe-web.eu";
        const WS_URL = API_URL.replace(/^https?/, ws => ws === 'https' ? 'wss' : 'ws');
        const PING_INTERVAL_MS = 25_000;
        const RECONNECT_DELAY_MS = 3_000;

        let credentials = { username: '', token: '', language: '' };
        let ws = null;
        let term = null;
        let fitAddon = null;
        let pingTimer = null;
        let resizeObserver = null;
        let connectTime = null;
        let termRows = 24, termCols = 80;

        // ─────────────────────────────────────────────────────────────────────
        // Init credentials
        // ─────────────────────────────────────────────────────────────────────
        function getCredentials() {
            const p = new URLSearchParams(window.location.search);
            credentials = {
                username: p.get('username') || localStorage.getItem('username') || 'admin',
                token: p.get('token') || localStorage.getItem('token') || '',
                language: p.get('language') || localStorage.getItem('language') || 'it_IT',
            };
        }

        // ─────────────────────────────────────────────────────────────────────
        // xterm.js setup
        // ─────────────────────────────────────────────────────────────────────
        function initTerminal() {
            if (term) { term.dispose(); }

            term = new Terminal({
                cursorBlink: true,
                cursorStyle: 'block',
                fontFamily: "'JetBrains Mono', 'Cascadia Code', monospace",
                fontSize: 14,
                lineHeight: 1.3,
                theme: {
                    background: '#0d1117',
                    foreground: '#c9d1d9',
                    cursor: '#58a6ff',
                    cursorAccent: '#0d1117',
                    black: '#21262d',
                    red: '#f85149',
                    green: '#3fb950',
                    yellow: '#d29922',
                    blue: '#58a6ff',
                    magenta: '#bc8cff',
                    cyan: '#39c5cf',
                    white: '#b1bac4',
                    brightBlack: '#6e7681',
                    brightRed: '#ff7b72',
                    brightGreen: '#56d364',
                    brightYellow: '#e3b341',
                    brightBlue: '#79c0ff',
                    brightMagenta: '#d2a8ff',
                    brightCyan: '#56d4dd',
                    brightWhite: '#f0f6fc',
                    selectionBackground: 'rgba(88,166,255,0.25)',
                },
                allowProposedApi: true,
                scrollback: 5000,
                convertEol: false,
            });

            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.loadAddon(new WebLinksAddon.WebLinksAddon());

            const container = document.getElementById('terminal-container');
            term.open(container);
            fitAddon.fit();

            termRows = term.rows;
            termCols = term.cols;
            updateDimLabel();

            // Input: invia dati al server via WebSocket
            term.onData(data => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'input', data }));
                }
            });

            // Resize observer per adattare il terminale al contenitore
            if (resizeObserver) resizeObserver.disconnect();
            resizeObserver = new ResizeObserver(() => { fitTerm(); });
            resizeObserver.observe(container);
        }

        function fitTerm() {
            if (!fitAddon || !term) return;
            try {
                fitAddon.fit();
                const r = term.rows, c = term.cols;
                if (r !== termRows || c !== termCols) {
                    termRows = r; termCols = c;
                    updateDimLabel();
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'resize', rows: r, cols: c }));
                    }
                }
            } catch (e) { }
        }

        function updateDimLabel() {
            const txt = `${termCols}×${termRows}`;
            document.getElementById('dimLabel').textContent = txt;
            document.getElementById('sbDim').innerHTML = `<i class="fa fa-expand"></i> ${txt}`;
        }

        function clearTerm() {
            if (term) term.clear();
        }

        // ─────────────────────────────────────────────────────────────────────
        // WebSocket connection
        // ─────────────────────────────────────────────────────────────────────
        function connect() {
            if (ws) { try { ws.close(); } catch (e) { } ws = null; }

            setStatus('connecting');
            showOverlay('Connessione in corso…', 'Apertura WebSocket verso il server remoto');

            const url = `${WS_URL}/ws/terminal/${encodeURIComponent(credentials.username)}`;
            document.getElementById('sbServerLabel').textContent = new URL(API_URL).hostname;

            try {
                ws = new WebSocket(url);
                ws.binaryType = 'arraybuffer';
            } catch (e) {
                showToast('Errore WebSocket: ' + e.message);
                setStatus('disconnected');
                hideOverlay();
                return;
            }

            ws.onopen = () => {
                connectTime = Date.now();
                // Invia messaggio di autenticazione con dimensioni terminale
                ws.send(JSON.stringify({
                    type: 'auth',
                    token: credentials.token,
                    rows: termRows,
                    cols: termCols,
                }));
                setStatus('connecting'); // ancora in attesa conferma auth
                showOverlay('Autenticazione…', 'Verifica credenziali sul server');
                startPing();
            };

            ws.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    // Output PTY – dati binari → xterm
                    if (term) {
                        term.write(new Uint8Array(event.data));
                        // Primo dato ricevuto = sessione avviata con successo
                        if (document.getElementById('overlay') &&
                            !document.getElementById('overlay').classList.contains('hidden')) {
                            setStatus('connected');
                            hideOverlay();
                        }
                    }
                } else {
                    // Messaggio JSON di controllo
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === 'error') {
                            showToast('Errore server: ' + msg.msg);
                            setStatus('disconnected');
                            hideOverlay();
                            if (term) term.writeln('\r\n\x1b[31m[ERRORE] ' + msg.msg + '\x1b[0m\r\n');
                        }
                    } catch (e) {
                        // potrebbe essere testo raw
                        if (term) term.write(event.data);
                    }
                }
            };

            ws.onerror = (e) => {
                showToast('Errore connessione WebSocket');
                setStatus('disconnected');
                hideOverlay();
            };

            ws.onclose = (e) => {
                stopPing();
                setStatus('disconnected');
                hideOverlay();
                if (term) {
                    term.writeln('\r\n\x1b[33m[Connessione chiusa]\x1b[0m');
                }
                updateLatency('—');
            };
        }

        function reconnect() {
            if (term) term.writeln('\r\n\x1b[34m[Riconnessione…]\x1b[0m');
            setTimeout(connect, 300);
        }

        // ─────────────────────────────────────────────────────────────────────
        // Ping keepalive
        // ─────────────────────────────────────────────────────────────────────
        let _pingSent = 0;

        function startPing() {
            stopPing();
            pingTimer = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    _pingSent = Date.now();
                    ws.send(JSON.stringify({ type: 'ping' }));
                }
            }, PING_INTERVAL_MS);
        }

        function stopPing() {
            if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
        }

        function updateLatency(ms) {
            const txt = ms === '—' ? '—' : ms + ' ms';
            document.getElementById('sbLatency').innerHTML = `<i class="fa fa-clock"></i> ${txt}`;
        }

        // ─────────────────────────────────────────────────────────────────────
        // UI helpers
        // ─────────────────────────────────────────────────────────────────────
        function setStatus(state) {
            const dot = document.getElementById('statusDot');
            const label = document.getElementById('connectionStatus');
            const badge = document.getElementById('connBadge');
            const title = document.getElementById('termTitle');

            dot.className = 'status-dot';
            badge.className = 'connection-badge';

            if (state === 'connected') {
                dot.classList.add('');
                dot.style.background = 'var(--green)';
                dot.style.animation = 'pulse 2s infinite';
                label.textContent = 'Connesso';
                badge.classList.add('badge-connected');
                badge.textContent = 'ONLINE';
                title.textContent = `bash – ${credentials.username}@${new URL(API_URL).hostname}`;
                document.getElementById('btnReconnect').style.display = 'none';
            } else if (state === 'connecting') {
                dot.style.background = 'var(--yellow)';
                dot.style.animation = 'pulse .8s infinite';
                label.textContent = 'Connessione…';
                badge.classList.add('badge-connecting');
                badge.textContent = 'CONNECTING';
                title.textContent = 'Connessione in corso…';
                document.getElementById('btnReconnect').style.display = 'none';
            } else {
                dot.classList.add('off');
                dot.style.background = 'var(--red)';
                dot.style.animation = 'none';
                label.textContent = 'Disconnesso';
                badge.classList.add('badge-disconnected');
                badge.textContent = 'OFFLINE';
                title.textContent = 'bash – non connesso';
                document.getElementById('btnReconnect').style.display = 'flex';
            }
        }

        function showOverlay(msg, sub) {
            const ov = document.getElementById('overlay');
            document.getElementById('overlay-msg').textContent = msg || '';
            document.getElementById('overlay-sub').textContent = sub || '';
            ov.classList.remove('hidden');
        }

        function hideOverlay() {
            document.getElementById('overlay').classList.add('hidden');
        }

        let toastTimer = null;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 5000);
        }

        function closePage() {
            if (ws) { try { ws.close(); } catch (e) { } }
            window.close();
            setTimeout(() => window.history.back(), 100);
        }

        // ─────────────────────────────────────────────────────────────────────
        // Window resize
        // ─────────────────────────────────────────────────────────────────────
        window.addEventListener('resize', () => { fitTerm(); });

        // ─────────────────────────────────────────────────────────────────────
        // Init
        // ─────────────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            getCredentials();
            document.getElementById('usernameDisplay').textContent = credentials.username;

            initTerminal();

            if (!credentials.token) {
                setStatus('disconnected');
                hideOverlay();
                if (term) {
                    term.writeln('\x1b[31mErrore: token di autenticazione mancante.\x1b[0m');
                    term.writeln('\x1b[33mRicarica la pagina con i parametri corretti.\x1b[0m');
                }
                return;
            }

            connect();
        });
    </script>
</body>

</html>
