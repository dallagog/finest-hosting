<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Import 0.2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="images/icon-finest.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap');

        :root {
            --bg-color: #f5f5f0;
            --glass-bg: #ffffff;
            --text-color: #333333;
            --active-color: #0066cc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--bg-color);
            padding: 20px;
            color: var(--text-color);
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--glass-bg);
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .user-info-left {
            flex: 1;
            text-align: left;
            font-size: 14px;
            color: #666;
        }

        h1 {
            flex: 1;
            text-align: center;
            margin: 0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #000;
            font-size: 2em;
        }

        .close-container {
            flex: 1;
            text-align: right;
        }

        button {
            padding: 10px 20px;
            background: #000;
            border: 1px solid #000;
            color: #fff;
            font-family: inherit;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover:not(:disabled) {
            background: #333;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .close-btn {
            background: rgba(255, 0, 0, 0.2);
            border-color: #ff3333;
            color: #ff3333;
        }

        .close-btn:hover:not(:disabled) {
            background: rgba(255, 0, 0, 0.4);
            box-shadow: 0 0 10px #ff3333;
        }

        .content-section {
            background: var(--glass-bg);
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .content-section.active-section {
            border-color: var(--active-color);
            box-shadow: 0 0 0 1px var(--active-color);
        }

        .content-section.active-section .section-head h2::after {
            content: ' ●';
            color: var(--active-color);
            font-size: 0.7em;
            vertical-align: middle;
            margin-left: 6px;
        }

        @keyframes flash-section {

            0%,
            100% {
                background: var(--glass-bg);
            }

            50% {
                background: #eef6ff;
            }
        }

        .content-section.flash {
            animation: flash-section 0.8s ease;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .section-head h2 {
            font-size: 18px;
            font-weight: 600;
            color: #000;
            margin: 0;
        }

        .section-head h2 i {
            margin-right: 6px;
            color: var(--active-color);
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .update-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
        }

        .drop-zone {
            border: 2px dashed #999;
            border-radius: 8px;
            padding: 18px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.2s;
            color: #666;
            margin-bottom: 12px;
        }

        .drop-zone i {
            font-size: 22px;
            color: #000;
            margin-right: 6px;
            vertical-align: middle;
        }

        .drop-zone.dragover {
            background: #eee;
            border-color: #000;
            color: #000;
        }

        .drop-zone small {
            display: block;
            margin-top: 6px;
            font-size: 11px;
            color: #999;
        }

        body.dragging .content-section.active-section .drop-zone {
            background: #eef6ff;
            border-color: var(--active-color);
        }

        .table-container {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        .data-table th,
        .data-table td {
            padding: 4px 8px;
            text-align: left;
            color: #333;
            min-height: 28px;
            font-size: 12px;
        }

        .data-table td.num,
        .data-table th.num {
            text-align: right;
        }

        .data-table td.center,
        .data-table th.center {
            text-align: center;
        }

        .data-table th {
            background: #f0f0f0;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            position: relative;
            line-height: 1.1;
            vertical-align: bottom;
            padding: 6px 8px;
        }

        .data-table th:hover {
            background: #e0e0e0;
        }

        .data-table th.sort-asc::after {
            content: ' ▲';
            font-size: 0.8em;
        }

        .data-table th.sort-desc::after {
            content: ' ▼';
            font-size: 0.8em;
        }

        .data-table tbody tr {
            transition: background 0.2s;
        }

        .data-table tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .data-table tbody tr:nth-child(odd) {
            background-color: #ffffff;
        }

        .data-table tbody tr:hover {
            background: #f0f0f0 !important;
        }

        .data-table tfoot td {
            font-weight: bold;
            background: #f0f0f0;
            border-top: 2px solid #000;
        }

        .row-btn {
            padding: 1px 8px;
            font-size: 10px;
            min-height: 18px;
            line-height: 15px;
            margin-left: 4px;
        }

        .row-btn.view {
            background: #fff;
            color: #000;
            border-color: #000;
        }

        .row-btn.view:hover:not(:disabled) {
            background: #eee;
        }

        .row-btn.proc {
            background: #fff;
            color: #000;
            border-color: #000;
        }

        .row-btn.proc:hover:not(:disabled) {
            background: #eee;
        }

        .file-link {
            cursor: pointer;
            text-decoration: underline;
            color: #000;
        }

        .empty-row td {
            text-align: center !important;
            color: #999;
            padding: 20px !important;
        }

        .badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 10px;
            border: 1px solid #999;
            color: #666;
            background: #fff;
            white-space: nowrap;
        }

        .badge.imported {
            border-color: #1a7a1a;
            color: #1a7a1a;
            background: #f0fff0;
        }

        .badge.error {
            border-color: #d32f2f;
            color: #d32f2f;
            background: #fff0f0;
        }

        .badge.working {
            border-color: var(--active-color);
            color: var(--active-color);
            background: #eef6ff;
        }

        .proc-table {
            width: 100%;
            border-collapse: collapse;
        }

        .proc-table th,
        .proc-table td {
            padding: 4px 8px;
            font-size: 12px;
            text-align: left;
        }

        .proc-table th {
            background: #f0f0f0;
            color: #000;
            font-weight: 600;
        }

        .proc-table tbody tr:nth-child(even) {
            background: #f9f9f9;
        }

        .proc-table tbody tr:nth-child(odd) {
            background: #fff;
        }

        .proc-title {
            padding: 10px 15px 0;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .message {
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
            display: none;
        }

        .message.loading {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ccc;
            display: block;
        }

        .message.success {
            background: #f0fff0;
            color: #1a7a1a;
            border: 1px solid #1a7a1a;
            display: block;
        }

        .message.error {
            background: #fff0f0;
            border: 1px solid #d32f2f;
            color: #d32f2f;
            display: block;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #fff;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 20px;
            width: 90%;
            max-width: 1000px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .modal-content.small {
            max-width: 450px;
            height: auto;
            text-align: center;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .modal-header h2 {
            color: #000;
            font-size: 1.1em;
            text-transform: uppercase;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-body {
            flex: 1;
            overflow: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fafafa;
        }

        .modal-body iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .modal-body img {
            max-width: 100%;
            display: block;
            margin: 0 auto;
        }

        .modal-body pre {
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .modal-body .no-preview {
            padding: 40px;
            text-align: center;
            color: #666;
            font-size: 13px;
        }

        .modal-footer {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .modal-content.small p {
            margin: 15px 0;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="header-bar">
            <div class="user-info-left">
                <div style="margin-bottom: 5px;">
                    <strong id="userLabel">Utente:</strong>
                    <span id="usernameDisplay">-</span>
                </div>
                <div style="font-size: 12px;">
                    <span id="languageFlag"></span>
                    <span id="languageDisplay">-</span>
                </div>
            </div>
            <h1 id="pageTitle">Import</h1>
            <div class="close-container">
                <button class="close-btn" onclick="window.close()">
                    <i class="fa fa-times"></i> <span id="closeText">Chiudi</span>
                </button>
            </div>
        </div>

        <div id="message" class="message"></div>

        <!-- Contenitore dinamico: qui vengono create le 4 sezioni (trade, instrument, price, exchange) -->
        <div id="sections-container"></div>
    </div>

    <!-- Preview modal -->
    <div id="preview-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="previewTitle"></h2>
                <button class="close-btn" onclick="closePreview()">
                    <i class="fa fa-times"></i> <span id="previewCloseText">Chiudi</span>
                </button>
            </div>
            <div id="previewBody" class="modal-body"></div>
        </div>
    </div>

    <!-- Confirm modal -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-content small">
            <div class="modal-header" style="justify-content:center">
                <h2 id="confirmTitle">Conferma</h2>
            </div>
            <p id="confirmText"></p>
            <div class="modal-footer">
                <button id="confirmYes"><i class="fa fa-check"></i> <span id="confirmYesText">Conferma</span></button>
                <button class="close-btn" onclick="closeConfirm()"><i class="fa fa-times"></i> <span
                        id="confirmNoText">Annulla</span></button>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        // API
        //
        //  IMPORT   (uno ZIP per file, sequenziale):
        //    POST /importall       multipart/form-data:
        //         username, token, language,
        //         file     = ZIP contenente il file originale
        //         recreate = 'false'
        //         ticker   = <sezione>   (trade | instrument | price | exchange)
        //         filename = '<sezione>:<basename>' (senza estensione)
        //         -> {status:'ok', msg, document?:{id,name,size,uploaded_at,imported}}
        //
        //  DELETE:   POST /bucket/delete   {username, token, language, id}  -> {status:'ok'}
        //  VIEW:     POST /bucket/get      {username, token, language, id}  -> file binario
        //  PROCESS:  POST /bucket/processed {username, token, language, id}
        //         -> {status:'ok', rows:[...], sql:'...'}
        // =====================================================================
        const API_URL = "https://feweb-tunnel.fe-web.eu";
        const API = {
            importAll: `${API_URL}/importall`,
            remove: `${API_URL}/bucket/delete`,
            get: `${API_URL}/bucket/get`,
            processed: `${API_URL}/bucket/processed`
        };

        // Configurazione delle sezioni. Aggiungere/togliere voci qui per
        // cambiare dinamicamente le sezioni mostrate.
        const SECTIONS = [
            { key: 'trade', labelKey: 'int.import.section.trade', fallbackLabel: 'Trade', icon: 'fa-chart-line' },
            { key: 'instrument', labelKey: 'int.import.section.instrument', fallbackLabel: 'Instrument', icon: 'fa-chart-pie' },
            { key: 'price', labelKey: 'int.import.section.price', fallbackLabel: 'Price', icon: 'fa-tag' },
            { key: 'exchange', labelKey: 'int.import.section.exchange', fallbackLabel: 'Exchange', icon: 'fa-exchange-alt' }
        ];
        const SECTION_KEYS = SECTIONS.map(s => s.key);

        const MAX_FILE_SIZE = 20 * 1024 * 1024;
        const ALLOWED_EXT = ['pdf', 'txt', 'csv', 'tsv', 'xls', 'xlsx', 'json', 'xml', 'doc', 'docx', 'png', 'jpg', 'jpeg'];

        let localCounter = 0;
        let credentials = { username: '', token: '', language: '' };
        let translations = {};
        let availableLanguages = [];

        // documents[i] = { id, name, size, uploaded_at, imported, local, copied, file, section, importing }
        let documents = [];
        let selectedIds = new Set(); // Set di ID globali (unique)
        let sectionSort = {};
        SECTIONS.forEach(s => { sectionSort[s.key] = { column: 'uploaded_at', asc: false }; });

        let activeSection = 'trade'; // sezione target di Ctrl+V
        let importing = false;
        let previewUrl = null;

        // ========== UTILITY ==========
        function t(key, fallback) {
            const v = translations[key];
            return v ? v : (fallback !== undefined ? fallback : key);
        }

        function showMessage(text, type = 'loading') {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
            el.style.display = 'block';
            if (type === 'success' || type === 'error') {
                setTimeout(() => { el.style.display = 'none'; }, 5000);
            }
        }

        function formatSize(bytes) {
            const n = Number(bytes);
            if (isNaN(n)) return '';
            if (n < 1024) return n + ' B';
            if (n < 1024 * 1024) return (n / 1024).toLocaleString(undefined, { maximumFractionDigits: 1 }) + ' KB';
            return (n / 1024 / 1024).toLocaleString(undefined, { maximumFractionDigits: 2 }) + ' MB';
        }

        function formatDate(v) {
            if (!v) return '';
            const d = new Date(v);
            return isNaN(d.getTime()) ? String(v) : d.toLocaleString();
        }

        function extOf(name) {
            const i = (name || '').lastIndexOf('.');
            return i >= 0 ? name.slice(i + 1).toLowerCase() : '';
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function authBody(extra) {
            return Object.assign({
                username: credentials.username,
                token: credentials.token,
                language: credentials.language
            }, extra || {});
        }

        // ========== AUTH / TRANSLATIONS ==========
        function getCredentialsFromURL() {
            const p = new URLSearchParams(window.location.search);
            credentials.username = p.get('username') || '';
            credentials.token = p.get('token') || '';
            credentials.language = p.get('language') || 'it_IT';
            if (!credentials.username || !credentials.token) {
                showMessage('Credenziali mancanti', 'error');
                return false;
            }
            document.getElementById('usernameDisplay').textContent = credentials.username;
            return true;
        }

        async function loadTranslations(lang) {
            try {
                const r = await fetch(`lang/${lang}.json`);
                if (!r.ok) throw new Error('Translation file not found');
                translations = await r.json();
            } catch (e) {
                console.error('Error loading translations:', e);
            }
        }

        async function initializeLanguages() {
            try {
                const r = await fetch('lang/manifest.json');
                if (!r.ok) return;
                const manifest = await r.json();
                for (const code of (manifest.languages || [])) {
                    try {
                        const lr = await fetch(`lang/${code}.json`);
                        if (!lr.ok) continue;
                        const d = await lr.json();
                        if (d['int.language.code'] && d['int.language.description'] && d['img.language.flag']) {
                            availableLanguages.push({ code: d['int.language.code'], description: d['int.language.description'], flag: d['img.language.flag'] });
                        }
                    } catch (e) { /* ignora */ }
                }
            } catch (e) { /* ignora */ }
        }

        function updateUserInfo() {
            const langData = availableLanguages.find(l => l.code === credentials.language);
            if (langData) {
                document.getElementById('languageFlag').textContent = langData.flag;
                const d = t('int.language.description', '');
                document.getElementById('languageDisplay').textContent = d || credentials.language;
            } else {
                document.getElementById('languageDisplay').textContent = credentials.language;
            }
        }

        function updatePageTranslations() {
            document.getElementById('userLabel').textContent = t('int.user.label', 'Utente:');
            document.getElementById('pageTitle').textContent = t('int.import', 'Import');
            document.getElementById('closeText').textContent = t('int.close', 'Chiudi');
            document.getElementById('previewCloseText').textContent = t('int.close', 'Chiudi');
            document.title = t('int.import', 'Import');
        }

        // ========== BUILD SECTIONS ==========
        function buildSections() {
            const container = document.getElementById('sections-container');
            container.innerHTML = '';

            SECTIONS.forEach(section => {
                const block = document.createElement('div');
                block.className = 'content-section';
                block.dataset.section = section.key;

                block.innerHTML = `
                    <div class="section-head">
                        <h2><i class="fa ${section.icon}"></i>${escapeHtml(t(section.labelKey, section.fallbackLabel))}</h2>
                        <div class="toolbar">
                            <button class="update-btn import-btn" disabled>
                                <i class="fa fa-check"></i> ${escapeHtml(t('int.confirm', 'Conferma'))}
                            </button>
                            <button class="update-btn delete-btn" disabled>
                                <i class="fa fa-trash"></i> ${escapeHtml(t('int.import.delete_selected', 'Elimina selezionati'))}
                            </button>
                        </div>
                    </div>
                    <div class="drop-zone">
                        <i class="fa fa-cloud-upload-alt"></i>
                        <span>${escapeHtml(t('int.import.drop', 'Trascina qui i file (o incolla con Ctrl+V) oppure clicca per selezionarli'))}</span>
                        <small>${escapeHtml(t('int.import.hint', 'Formati ammessi: PDF, TXT, CSV, XLS, XLSX, JSON, XML, immagini — max 20 MB per file'))}</small>
                    </div>
                    <input type="file" class="file-input" multiple style="display:none"
                        accept=".pdf,.txt,.csv,.tsv,.xls,.xlsx,.json,.xml,.doc,.docx,.png,.jpg,.jpeg">
                    <div class="table-container">
                        <table class="data-table">
                            <thead></thead>
                            <tbody></tbody>
                            <tfoot></tfoot>
                        </table>
                    </div>
                `;

                container.appendChild(block);
                attachSectionEvents(section.key, block);
                renderSection(section.key);
            });
        }

        function attachSectionEvents(sectionKey, block) {
            const dropZone = block.querySelector('.drop-zone');
            const fileInput = block.querySelector('.file-input');
            const importBtn = block.querySelector('.import-btn');
            const deleteBtn = block.querySelector('.delete-btn');

            dropZone.onclick = () => {
                setActiveSection(sectionKey);
                fileInput.click();
            };

            fileInput.onchange = () => {
                setActiveSection(sectionKey);
                handleFiles(sectionKey, fileInput.files);
                fileInput.value = '';
            };

            dropZone.addEventListener('dragenter', e => {
                e.preventDefault();
                dropZone.classList.add('dragover');
                setActiveSection(sectionKey);
            });
            dropZone.addEventListener('dragover', e => {
                e.preventDefault();
                dropZone.classList.add('dragover');
                setActiveSection(sectionKey);
            });
            dropZone.addEventListener('dragleave', e => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            });
            dropZone.addEventListener('drop', e => {
                e.preventDefault();
                e.stopPropagation(); // evita che il document handler processi lo stesso drop
                dropZone.classList.remove('dragover');
                if (e.dataTransfer && e.dataTransfer.files.length) {
                    setActiveSection(sectionKey);
                    handleFiles(sectionKey, e.dataTransfer.files);
                }
            });

            importBtn.onclick = () => importSelected(sectionKey);
            deleteBtn.onclick = () => deleteSelected(sectionKey);
        }

        function setActiveSection(key) {
            activeSection = key;
            document.querySelectorAll('.content-section').forEach(el => {
                el.classList.toggle('active-section', el.dataset.section === key);
            });
        }

        function flashSection(key) {
            const el = document.querySelector(`.content-section[data-section="${key}"]`);
            if (!el) return;
            el.classList.add('flash');
            setTimeout(() => el.classList.remove('flash'), 800);
        }

        // ========== RENDER PER SECTION ==========
        function renderSection(sectionKey) {
            const block = document.querySelector(`.content-section[data-section="${sectionKey}"]`);
            if (!block) return;

            const docs = documents.filter(d => d.section === sectionKey);
            const sort = sectionSort[sectionKey] || { column: 'uploaded_at', asc: false };

            const thead = block.querySelector('thead');
            const tbody = block.querySelector('tbody');
            const tfoot = block.querySelector('tfoot');
            const importBtn = block.querySelector('.import-btn');
            const deleteBtn = block.querySelector('.delete-btn');

            const cols = [
                { key: 'name', label: t('int.import.col.name', 'Nome file') },
                { key: 'type', label: t('int.import.col.type', 'Tipo') },
                { key: 'size', label: t('int.import.col.size', 'Dimensione'), cls: 'num' },
                { key: 'uploaded_at', label: t('int.import.col.date', 'Caricato il') },
                { key: 'imported', label: t('int.import.col.status', 'Stato') },
                { key: 'azioni', label: t('int.trading', 'Azioni'), cls: 'center' }
            ];

            // --- Header ---
            thead.innerHTML = '';
            const trH = document.createElement('tr');

            const thSel = document.createElement('th');
            thSel.className = 'center';
            thSel.style.cursor = 'default';
            const all = document.createElement('input');
            all.type = 'checkbox';
            all.onchange = () => {
                const sectionDocs = documents.filter(d => d.section === sectionKey);
                if (all.checked) sectionDocs.forEach(d => selectedIds.add(String(d.id)));
                else sectionDocs.forEach(d => selectedIds.delete(String(d.id)));
                renderSection(sectionKey);
            };
            thSel.appendChild(all);
            trH.appendChild(thSel);

            cols.forEach(c => {
                const th = document.createElement('th');
                th.textContent = c.label;
                if (c.cls) th.className = c.cls;
                if (c.key === 'azioni') {
                    th.style.cursor = 'default';
                } else {
                    th.onclick = () => sortTable(sectionKey, c.key);
                }
                if (sort.column === c.key) th.classList.add(sort.asc ? 'sort-asc' : 'sort-desc');
                trH.appendChild(th);
            });
            thead.appendChild(trH);

            // --- Sort ---
            const getVal = (d, key) => {
                if (key === 'type') return extOf(d.name);
                if (key === 'size') return Number(d.size) || 0;
                if (key === 'uploaded_at') return d.uploaded_at ? new Date(d.uploaded_at).getTime() || 0 : 0;
                if (key === 'imported') return d.imported ? 1 : 0;
                return String(d[key] || '').toLowerCase();
            };
            const sorted = [...docs].sort((a, b) => {
                const va = getVal(a, sort.column), vb = getVal(b, sort.column);
                const r = (typeof va === 'number' && typeof vb === 'number') ? va - vb : String(va).localeCompare(String(vb));
                return sort.asc ? r : -r;
            });

            // --- Body ---
            tbody.innerHTML = '';
            if (sorted.length === 0) {
                const tr = document.createElement('tr');
                tr.className = 'empty-row';
                const td = document.createElement('td');
                td.colSpan = cols.length + 1;
                td.textContent = t('int.import.empty_section', 'Nessun file in questa sezione.');
                tr.appendChild(td);
                tbody.appendChild(tr);
            } else {
                sorted.forEach(d => {
                    const id = String(d.id);
                    const tr = document.createElement('tr');

                    const tdSel = document.createElement('td');
                    tdSel.className = 'center';
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.checked = selectedIds.has(id);
                    cb.onchange = () => {
                        if (cb.checked) selectedIds.add(id); else selectedIds.delete(id);
                        renderSection(sectionKey);
                    };
                    tdSel.appendChild(cb);
                    tr.appendChild(tdSel);

                    const tdName = document.createElement('td');
                    const link = document.createElement('span');
                    link.className = 'file-link';
                    link.textContent = d.name;
                    link.onclick = () => viewDocument(d);
                    tdName.appendChild(link);
                    tr.appendChild(tdName);

                    const tdType = document.createElement('td');
                    tdType.textContent = extOf(d.name).toUpperCase();
                    tr.appendChild(tdType);

                    const tdSize = document.createElement('td');
                    tdSize.className = 'num';
                    tdSize.textContent = formatSize(d.size);
                    tr.appendChild(tdSize);

                    const tdDate = document.createElement('td');
                    tdDate.textContent = formatDate(d.uploaded_at);
                    tr.appendChild(tdDate);

                    const tdStatus = document.createElement('td');
                    const badge = document.createElement('span');
                    if (d.importing) {
                        badge.className = 'badge working';
                        badge.textContent = t('int.import.status.importing', 'Importazione...');
                    } else if (d.imported || d.copied) {
                        badge.className = 'badge imported';
                        badge.textContent = t('int.import.status.imported', 'Importato');
                    } else {
                        badge.className = 'badge';
                        badge.textContent = t('int.import.status.local', 'Da importare');
                    }
                    tdStatus.appendChild(badge);
                    tr.appendChild(tdStatus);

                    const tdAct = document.createElement('td');
                    tdAct.className = 'center';
                    tdAct.style.whiteSpace = 'nowrap';

                    const bView = document.createElement('button');
                    bView.className = 'row-btn view';
                    bView.innerHTML = '<i class="fa fa-file"></i> ' + escapeHtml(t('int.import.original', 'Originale'));
                    bView.onclick = () => viewDocument(d);

                    const bProc = document.createElement('button');
                    bProc.className = 'row-btn proc';
                    bProc.innerHTML = '<i class="fa fa-cogs"></i> ' + escapeHtml(t('int.import.processed', 'Elaborato'));
                    bProc.onclick = () => viewProcessed(d);

                    const bDel = document.createElement('button');
                    bDel.className = 'row-btn';
                    bDel.innerHTML = '<i class="fa fa-trash"></i> ' + escapeHtml(t('int.delete', 'Elimina'));
                    bDel.onclick = () => confirmDelete(sectionKey, [id]);

                    tdAct.appendChild(bView);
                    tdAct.appendChild(bProc);
                    tdAct.appendChild(bDel);
                    tr.appendChild(tdAct);

                    tbody.appendChild(tr);
                });
            }

            // --- Footer ---
            tfoot.innerHTML = '';
            const trF = document.createElement('tr');
            const tdF = document.createElement('td');
            tdF.colSpan = cols.length + 1;
            const total = docs.reduce((s, d) => s + (Number(d.size) || 0), 0);
            tdF.textContent = `${t('int.import.total', 'TOTALE')}: ${docs.length} ${t('int.import.files', 'file')} — ${formatSize(total)}`;
            trF.appendChild(tdF);
            tfoot.appendChild(trF);

            // --- Select all state ---
            const selectedInSection = docs.filter(d => selectedIds.has(String(d.id)));
            all.checked = docs.length > 0 && selectedInSection.length === docs.length;
            all.indeterminate = selectedInSection.length > 0 && selectedInSection.length < docs.length;

            // --- Buttons ---
            const localSelected = docs.filter(d => selectedIds.has(String(d.id)) && d.local && !d.copied && d.file).length;
            importBtn.disabled = localSelected === 0 || importing;
            deleteBtn.disabled = selectedInSection.length === 0 || importing;
        }

        function renderAll() {
            SECTION_KEYS.forEach(k => renderSection(k));
        }

        function sortTable(sectionKey, key) {
            const s = sectionSort[sectionKey];
            if (s.column === key) s.asc = !s.asc;
            else { s.column = key; s.asc = true; }
            renderSection(sectionKey);
        }

        // ========== UPLOAD ==========
        function validateFile(file) {
            const ext = extOf(file.name);
            if (!ALLOWED_EXT.includes(ext)) return t('int.import.err.type', 'Formato non supportato');
            if (file.size > MAX_FILE_SIZE) return t('int.import.err.size', 'File troppo grande (max 20 MB)');
            if (file.size === 0) return t('int.import.err.empty', 'File vuoto');
            return null;
        }

        function handleFiles(sectionKey, fileList) {
            const files = Array.from(fileList || []);
            if (files.length === 0) return;

            let added = 0;
            const errors = [];
            files.forEach(file => {
                const err = validateFile(file);
                if (err) { errors.push(`${file.name}: ${err}`); return; }
                const dup = documents.some(d =>
                    d.section === sectionKey && d.local && !d.copied &&
                    d.name === file.name && Number(d.size) === file.size
                );
                if (dup) { errors.push(`${file.name}: ${t('int.import.err.dup', 'già presente nell\'elenco')}`); return; }

                const newDoc = {
                    id: 'local-' + (++localCounter),
                    name: file.name,
                    size: file.size,
                    uploaded_at: new Date().toISOString(),
                    imported: false,
                    local: true,
                    copied: false,
                    file: file,
                    section: sectionKey,
                    importing: false
                };
                documents.push(newDoc);
                selectedIds.add(String(newDoc.id));
                added++;
            });

            renderSection(sectionKey);
            flashSection(sectionKey);

            if (added > 0) {
                let msg = `${added} ${t('int.import.files_added', 'file aggiunti alla sezione ' + sectionKey + ': premi Conferma per importarli')}`;
                if (errors.length) msg += ` — ${errors.join('; ')}`;
                showMessage(msg, errors.length ? 'error' : 'success');
            } else {
                showMessage(errors.join('; ') || t('int.import.err.none', 'Nessun file aggiunto'), 'error');
            }
        }

        // ========== VIEW ==========
        async function fetchDocumentBlob(doc) {
            if (doc.file) return doc.file;
            const r = await fetch(API.get, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(authBody({ id: doc.id }))
            });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return await r.blob();
        }

        async function viewDocument(doc) {
            const body = document.getElementById('previewBody');
            document.getElementById('previewTitle').textContent = doc.name;
            body.innerHTML = '';
            document.getElementById('preview-modal').style.display = 'flex';
            body.innerHTML = '<div class="no-preview"><i class="fa fa-spinner fa-spin"></i></div>';

            try {
                const blob = await fetchDocumentBlob(doc);
                const ext = extOf(doc.name);
                body.innerHTML = '';
                if (previewUrl) URL.revokeObjectURL(previewUrl);

                if (ext === 'pdf') {
                    previewUrl = URL.createObjectURL(new Blob([blob], { type: 'application/pdf' }));
                    const f = document.createElement('iframe');
                    f.src = previewUrl;
                    body.appendChild(f);
                } else if (['png', 'jpg', 'jpeg'].includes(ext)) {
                    previewUrl = URL.createObjectURL(blob);
                    const img = document.createElement('img');
                    img.src = previewUrl;
                    body.appendChild(img);
                } else if (['txt', 'csv', 'tsv', 'json', 'xml'].includes(ext)) {
                    const pre = document.createElement('pre');
                    pre.textContent = await blob.text();
                    body.appendChild(pre);
                } else {
                    previewUrl = URL.createObjectURL(blob);
                    body.innerHTML = '<div class="no-preview"></div>';
                    const box = body.firstChild;
                    box.appendChild(document.createTextNode(t('int.import.no_preview', 'Anteprima non disponibile per questo formato.')));
                    box.appendChild(document.createElement('br'));
                    box.appendChild(document.createElement('br'));
                    const a = document.createElement('a');
                    a.href = previewUrl;
                    a.download = doc.name;
                    a.innerHTML = '<button><i class="fa fa-download"></i> ' + escapeHtml(t('int.download', 'Scarica')) + '</button>';
                    box.appendChild(a);
                }
            } catch (e) {
                console.error('Error viewing document:', e);
                body.innerHTML = '<div class="no-preview" style="color:#d32f2f"></div>';
                body.firstChild.textContent = (t('int.error', 'Errore') + ': ') + e.message;
            }
        }

        async function viewProcessed(doc) {
            const body = document.getElementById('previewBody');
            document.getElementById('previewTitle').textContent = `${doc.name} — ${t('int.import.processed', 'Elaborato')}`;
            document.getElementById('preview-modal').style.display = 'flex';
            body.innerHTML = '<div class="no-preview"><i class="fa fa-spinner fa-spin"></i></div>';

            if (doc.local && !doc.copied) {
                body.innerHTML = '<div class="no-preview"></div>';
                body.firstChild.textContent = t('int.import.processed_after_copy', 'Il documento elaborato è disponibile dopo l\'importazione sul server (seleziona il file e premi Conferma).');
                return;
            }

            try {
                const r = await fetch(API.processed, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(authBody({ id: doc.id }))
                });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const data = await r.json();
                if (data.status !== 'ok') throw new Error(data.msg || 'Errore sconosciuto');

                body.innerHTML = '';
                const rows = Array.isArray(data.rows) ? data.rows : [];

                if (rows.length === 0 && !data.sql) {
                    body.innerHTML = '<div class="no-preview"></div>';
                    body.firstChild.textContent = t('int.import.no_processed', 'Nessuna operazione estratta da questo documento.');
                    return;
                }

                if (rows.length > 0) {
                    const title = document.createElement('div');
                    title.className = 'proc-title';
                    title.textContent = t('int.import.operations', 'Operazioni estratte');
                    body.appendChild(title);

                    const cols = [
                        ['causale', t('int.import.proc.causale', 'Causale')],
                        ['id_instrument', t('int.import.proc.instrument', 'Strumento')],
                        ['dt_trade', t('int.import.proc.date', 'Data trade')],
                        ['qty_str', t('int.import.proc.qty', 'Quantità')],
                        ['price_str', t('int.import.proc.price', 'Prezzo')],
                        ['gross_str', t('int.import.proc.gross', 'Controvalore')],
                        ['net_str', t('int.import.proc.net', 'Netto')]
                    ];
                    const table = document.createElement('table');
                    table.className = 'proc-table';
                    const thead = document.createElement('thead');
                    const hr = document.createElement('tr');
                    cols.forEach(c => { const th = document.createElement('th'); th.textContent = c[1]; hr.appendChild(th); });
                    thead.appendChild(hr);
                    table.appendChild(thead);
                    const tb = document.createElement('tbody');
                    rows.forEach(row => {
                        const tr = document.createElement('tr');
                        cols.forEach(c => {
                            const td = document.createElement('td');
                            td.textContent = row[c[0]] !== undefined && row[c[0]] !== null ? String(row[c[0]]) : '';
                            tr.appendChild(td);
                        });
                        tb.appendChild(tr);
                    });
                    table.appendChild(tb);
                    body.appendChild(table);
                }

                const sql = data.sql || rows.map(x => [x.sql_stock, x.sql_liq].filter(Boolean).join('\n')).join('\n');
                if (sql) {
                    const title2 = document.createElement('div');
                    title2.className = 'proc-title';
                    title2.textContent = t('int.import.sql', 'Istruzioni SQL');
                    body.appendChild(title2);
                    const pre = document.createElement('pre');
                    pre.textContent = sql;
                    body.appendChild(pre);
                }
            } catch (e) {
                console.error('Error viewing processed document:', e);
                body.innerHTML = '<div class="no-preview" style="color:#d32f2f"></div>';
                body.firstChild.textContent = (t('int.error', 'Errore') + ': ') + e.message;
            }
        }

        function closePreview() {
            document.getElementById('preview-modal').style.display = 'none';
            document.getElementById('previewBody').innerHTML = '';
            if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
        }

        // ========== CONFIRM DIALOG ==========
        function openConfirm({ title, text, yesLabel, yesIcon, onYes }) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmText').textContent = text;
            document.getElementById('confirmYesText').textContent = yesLabel;
            document.querySelector('#confirmYes i').className = 'fa ' + yesIcon;
            document.getElementById('confirmYes').onclick = async () => {
                closeConfirm();
                await onYes();
            };
            document.getElementById('confirm-modal').style.display = 'flex';
        }

        function closeConfirm() {
            document.getElementById('confirm-modal').style.display = 'none';
        }

        function confirmDelete(sectionKey, ids) {
            const msg = ids.length === 1
                ? t('int.import.confirm_one', 'Eliminare il documento selezionato?')
                : `${t('int.import.confirm_many', 'Eliminare i documenti selezionati?')} (${ids.length})`;
            openConfirm({
                title: t('int.import.confirm_title', 'Conferma eliminazione'),
                text: msg,
                yesLabel: t('int.delete', 'Elimina'),
                yesIcon: 'fa-trash',
                onYes: () => deleteDocuments(sectionKey, ids)
            });
        }

        // ========== IMPORT (uno ZIP per file) ==========
        function importSelected(sectionKey) {
            if (importing) return;
            const localIds = [...selectedIds].filter(id => {
                const d = documents.find(doc => String(doc.id) === String(id));
                return d && d.section === sectionKey && d.local && !d.copied && d.file;
            });
            if (localIds.length === 0) {
                showMessage(t('int.import.nothing_to_import', 'Nessun file locale da importare in questa sezione.'), 'error');
                return;
            }
            openConfirm({
                title: t('int.import.import_title', 'Conferma importazione'),
                text: `${t('int.import.import_text', 'Importare sul server i documenti selezionati?')} (${localIds.length})`,
                yesLabel: t('int.confirm', 'Conferma'),
                yesIcon: 'fa-check',
                onYes: () => runImport(sectionKey, localIds)
            });
        }

        // Chiamata /importall per un singolo file:
        // ticker e filename usano il prefisso della sezione (es. 'trade:nomefile')
        async function importDataFile(sectionKey, file) {
            if (typeof JSZip === 'undefined') throw new Error('JSZip non caricato');

            const baseName = file.name.replace(/\.[^.]+$/, '');
            const filename = `${sectionKey}:${baseName}`;

            const zip = new JSZip();
            const fileContent = await file.arrayBuffer();
            zip.file(file.name, fileContent);
            const zipBlob = await zip.generateAsync({ type: 'blob' });

            const form = new FormData();
            form.append('username', credentials.username);
            form.append('token', credentials.token);
            form.append('language', credentials.language);
            form.append('file', zipBlob, filename + '.zip');
            form.append('recreate', 'false');
            form.append('ticker', sectionKey);
            form.append('filename', filename);

            const r = await fetch(API.importAll, { method: 'POST', body: form });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const data = await r.json();
            if (data.status !== 'ok') throw new Error(data.msg || 'Errore sconosciuto');
            return data;
        }

        async function runImport(sectionKey, ids) {
            importing = true;
            renderAll();

            const localDocs = ids
                .map(id => documents.find(d => String(d.id) === String(id)))
                .filter(d => d && d.section === sectionKey && d.local && !d.copied && d.file);

            let okCount = 0;
            const errs = [];

            try {
                for (let i = 0; i < localDocs.length; i++) {
                    const doc = localDocs[i];
                    const oldId = String(doc.id);

                    showMessage(
                        `${t('int.import.importing', 'Importazione in corso...')} (${i + 1}/${localDocs.length}) — [${sectionKey}] ${doc.name}`,
                        'loading'
                    );
                    doc.importing = true;
                    renderSection(sectionKey);
                    try {
                        const result = await importDataFile(sectionKey, doc.file);
                        // Adotta ID server se presente
                        if (result && result.document && result.document.id) {
                            doc.id = result.document.id;
                            doc.name = result.document.name || doc.name;
                            doc.size = result.document.size || doc.size;
                            doc.uploaded_at = result.document.uploaded_at || doc.uploaded_at;
                            doc.local = false;
                        }
                        doc.copied = true;
                        doc.imported = true;
                        okCount++;
                        selectedIds.delete(oldId);
                    } catch (e) {
                        console.error('Import failed for', doc.name, e);
                        errs.push(`${doc.name}: ${e.message}`);
                    } finally {
                        doc.importing = false;
                        renderSection(sectionKey);
                    }
                }

                let msg = `[${sectionKey}] ${t('int.import.imported_count', 'Documenti importati')}: ${okCount}/${localDocs.length}`;
                if (errs.length) msg += ` — ${t('int.error', 'Errore')}: ${errs.join('; ')}`;
                showMessage(msg, errs.length ? 'error' : 'success');
            } catch (e) {
                console.error('Import failed:', e);
                showMessage(`${t('int.error', 'Errore')}: ${e.message}`, 'error');
            } finally {
                importing = false;
                renderAll();
            }
        }

        // ========== DELETE ==========
        function deleteSelected(sectionKey) {
            const ids = [...selectedIds].filter(id => {
                const d = documents.find(doc => String(doc.id) === String(id));
                return d && d.section === sectionKey;
            });
            if (ids.length > 0) confirmDelete(sectionKey, ids);
        }

        async function deleteDocuments(sectionKey, ids) {
            const localIds = [];
            const serverIds = [];
            ids.forEach(id => {
                const d = documents.find(doc => String(doc.id) === String(id));
                if (d && d.local) localIds.push(d);
                else serverIds.push(id);
            });

            // Rimozione lato client
            if (localIds.length) {
                const localSet = new Set(localIds.map(d => String(d.id)));
                documents = documents.filter(d => !localSet.has(String(d.id)));
                localSet.forEach(id => selectedIds.delete(id));
            }

            // Rimozione lato server
            let ok = 0;
            let lastErr = '';
            for (const id of serverIds) {
                try {
                    const r = await fetch(API.remove, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(authBody({ id }))
                    });
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    const data = await r.json();
                    if (data.status !== 'ok') throw new Error(data.msg || 'Errore sconosciuto');
                    documents = documents.filter(d => String(d.id) !== String(id));
                    selectedIds.delete(String(id));
                    ok++;
                } catch (e) {
                    console.error('Delete failed for', id, e);
                    lastErr = e.message;
                }
            }

            const total = ids.length;
            const done = localIds.length + ok;
            if (done === total) showMessage(t('int.import.deleted', 'Documenti eliminati'), 'success');
            else showMessage(`${t('int.error', 'Errore')}: ${lastErr}`, 'error');

            renderSection(sectionKey);
        }

        // ========== INIT ==========
        window.addEventListener('load', async () => {
            // Drag globale (solo per feedback visivo / prevenire apertura file)
            document.addEventListener('dragover', e => {
                e.preventDefault();
                document.body.classList.add('dragging');
            });
            document.addEventListener('dragleave', e => {
                if (!e.relatedTarget) document.body.classList.remove('dragging');
            });
            document.addEventListener('drop', e => {
                e.preventDefault();
                document.body.classList.remove('dragging');
                // Se il drop è fuori da una drop-zone, usa la sezione attiva
                if (e.target.closest && e.target.closest('.drop-zone')) return;
                if (e.dataTransfer && e.dataTransfer.files.length) {
                    handleFiles(activeSection, e.dataTransfer.files);
                }
            });

            // Incolla (Ctrl+V): va nella sezione attiva
            document.addEventListener('paste', e => {
                const items = e.clipboardData && e.clipboardData.items;
                if (!items) return;
                const files = [];
                for (const item of items) {
                    if (item.kind === 'file') {
                        const f = item.getAsFile();
                        if (f) files.push(f);
                    }
                }
                if (files.length) {
                    e.preventDefault();
                    handleFiles(activeSection, files);
                }
            });

            // Esc chiude i modali
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') { closePreview(); closeConfirm(); }
            });

            if (!getCredentialsFromURL()) return;
            await initializeLanguages();
            await loadTranslations(credentials.language);
            updatePageTranslations();
            updateUserInfo();

            buildSections();
            setActiveSection('trade'); // default
        });
    </script>
</body>
