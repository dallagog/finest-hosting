<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login 0.2</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/png" href="images/icon-finest.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap');

    :root {
      --bg-color: #f5f5f0;
      --text-color: #333;
      --accent-color: #000;
      --paper-bg: #fff;
      --shadow-color: rgba(0, 0, 0, 0.08);
      --border-color: #000;
      --error-color: #d32f2f;
    }

    html {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      background-color: var(--bg-color);
      background-image: url('images/background.png');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: var(--text-color);
    }

    .top-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .close-button {
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      border-radius: 0;
      background: transparent;
      color: var(--text-color);
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-button:hover {
      background: #eee;
    }

    #languageCombo {
      padding: 8px 12px;
      border: 2px solid #00ffff;
      background: rgba(0, 0, 0, 0.5);
      color: #00ffff;
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff, inset 0 0 5px #00ffff;
      text-shadow: 0 0 5px #00ffff;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    #languageCombo:hover {
      box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, inset 0 0 10px #00ffff;
      transform: scale(1.02);
    }

    .container {
      background: var(--paper-bg);
      padding: 60px 50px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px var(--shadow-color);
      border-radius: 2px;
      width: 400px;
      text-align: center;
      position: relative;
    }

    .logo-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      margin-bottom: 40px;
    }

    /* 3D Rotating Cube - Wireframe Style */
    .cube-scene {
      width: 60px;
      height: 60px;
      perspective: 400px;
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: rotate-cube 12s infinite linear;
    }

    .cube-face {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 1px solid #000;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      backface-visibility: visible;
    }

    .cube-face.front {
      transform: translateZ(30px);
    }

    .cube-face.back {
      transform: rotateY(180deg) translateZ(30px);
    }

    .cube-face.right {
      transform: rotateY(90deg) translateZ(30px);
    }

    .cube-face.left {
      transform: rotateY(-90deg) translateZ(30px);
    }

    .cube-face.top {
      transform: rotateX(90deg) translateZ(30px);
    }

    .cube-face.bottom {
      transform: rotateX(-90deg) translateZ(30px);
    }

    @keyframes rotate-cube {
      0% {
        transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
      }

      100% {
        transform: rotateX(360deg) rotateY(360deg) rotateZ(0deg);
      }
    }

    .tron-text {
      text-align: left;
      font-family: 'Cormorant Garamond', serif;
      line-height: 1;
      border-left: 1px solid #000;
      padding-left: 15px;
    }

    .tron-text div:first-child {
      font-size: 1.4rem;
      font-weight: bold;
      color: #000;
      letter-spacing: 1px;
    }

    .tron-text div:last-child {
      font-size: 1.2rem;
      color: #555;
      font-style: italic;
      letter-spacing: 0.5px;
    }

    h2 {
      margin-bottom: 35px;
      color: #000;
      text-transform: uppercase;
      font-size: 1.3rem;
      letter-spacing: 2px;
      font-weight: normal;
      border-bottom: 1px solid #ddd;
      padding-bottom: 15px;
    }

    .input-group {
      position: relative;
      margin-bottom: 30px;
      text-align: left;
    }

    .input-group i {
      position: absolute;
      top: 10px;
      left: 0;
      color: #000;
      font-size: 0.9rem;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 8px 0 8px 25px;
      background: transparent;
      border: none;
      border-bottom: 1px solid #999;
      color: var(--text-color);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      border-radius: 0;
      transition: border-color 0.3s;
    }

    .input-group input:focus,
    .input-group select:focus {
      outline: none;
      border-bottom: 1px solid #000;
    }

    .input-group input::placeholder {
      font-style: italic;
      color: #999;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: #000;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      transition: all 0.3s;
      margin-top: 15px;
    }

    button:hover {
      background: #333;
      transform: scale(1.02);
    }

    .forgot-password {
      margin-top: 20px;
      text-align: center;
    }

    .forgot-password a {
      color: #000;
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .forgot-password a:hover {
      color: #666;
    }

    .switch-form {
      margin-top: 15px;
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }

    .switch-form a {
      color: #000;
      cursor: pointer;
      text-decoration: underline;
      font-weight: bold;
    }

    .switch-form a:hover {
      color: #333;
    }

    .offline {
      width: 200px;
      height: 200px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.6;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="top-controls" style="display: none;">
    <select id="languageCombo">
      <option value="">Language</option>
    </select>
    <button class="close-button" onclick="window.location.href='index.html'">
      <i class="fas fa-arrow-left"></i> Back
    </button>
  </div>

  <div id="app-container" class="container" style="display: none;">
    <div class="logo-header">
      <div class="cube-scene">
        <div class="cube">
          <div class="cube-face front">₹</div>
          <div class="cube-face back">€</div>
          <div class="cube-face right">$</div>
          <div class="cube-face left">£</div>
          <div class="cube-face top">¥</div>
          <div class="cube-face bottom">₽</div>
        </div>
      </div>
      <div class="tron-text">
        <div id="logo-financial">FINANCIAL</div>
        <div id="logo-estimates">ESTIMATES</div>
      </div>
    </div>

    <h2 id="form-title">LOGIN</h2>

    <div class="input-group">
      <i class="fa fa-user"></i>
      <input type="text" id="username" placeholder="Username/Email">
    </div>

    <div class="input-group">
      <i class="fa fa-lock"></i>
      <input type="password" id="password" placeholder="Password">
    </div>

    <div id="currency-group" class="input-group" style="display: none;">
      <i class="fa fa-coins"></i>
      <select id="currency">
        <option value="">Select Currency</option>
      </select>
    </div>

    <button id="submit-btn">Submit</button>

    <div class="forgot-password" id="forgot-password" style="display: block;">
      <a id="forgot-link">Forgot password?</a>
    </div>

    <div class="switch-form">
      <span id="switch-text">Don't have an account?</span>
      <a id="switch-form">Sign up</a>
    </div>
  </div>

  <script>
    // ========== CONFIGURAZIONE ==========
    const apiBaseUser = "https://api.example.com/user";
    const apiBaseNew = "https://api.example.com/signup";

    let isLogin = true;
    let language = "en";
    let translations = {};
    let availableLanguages = [];
    let currencies = [];
    let timezones = [];

    // Funzione di logging centralizzata
    function logAction(action, level = "info", data = null) {
      const timestamp = new Date().toLocaleTimeString('it-IT');
      const logColor = {
        info: "%c[INFO]",
        success: "%c[✅ SUCCESS]",
        error: "%c[❌ ERROR]",
        warning: "%c[⚠️ WARNING]",
        debug: "%c[🔍 DEBUG]"
      };

      const colors = {
        info: "color: #0066cc; font-weight: bold;",
        success: "color: #00cc00; font-weight: bold;",
        error: "color: #cc0000; font-weight: bold;",
        warning: "color: #ff9900; font-weight: bold;",
        debug: "color: #9900cc; font-weight: bold;"
      };

      if (data) {
        console.log(`${logColor[level]} ${timestamp} - ${action}`, colors[level], data);
      } else {
        console.log(`${logColor[level]} ${timestamp} - ${action}`, colors[level]);
      }
    }

    // ========== LANGUAGE SYSTEM ==========
    async function initializeLanguages() {
      logAction("Initializing language system", "info");

      availableLanguages = [
        { code: "en", flag: "🇬🇧", description: "English" },
        { code: "it", flag: "🇮🇹", description: "Italiano" },
        { code: "es", flag: "🇪🇸", description: "Español" },
      ];

      currencies = [
        { currency: "EUR", "img.currency.flag": "🇪🇺", description: "Euro" },
        { currency: "USD", "img.currency.flag": "🇺🇸", description: "US Dollar" },
        { currency: "GBP", "img.currency.flag": "🇬🇧", description: "British Pound" },
      ];

      timezones = [
        { timezone: "Europe/Rome", offset_from_gmt: "+01:00", reference_city: "Rome" },
        { timezone: "Europe/London", offset_from_gmt: "+00:00", reference_city: "London" },
        { timezone: "America/New_York", offset_from_gmt: "-05:00", reference_city: "New York" },
      ];

      logAction("Language system initialized", "success", { languages: availableLanguages.length, currencies: currencies.length });
    }

    async function loadTranslations(langCode) {
      logAction("Loading translations", "info", { language: langCode });

      // Simulazione di caricamento traduzioni
      translations = {
        "int.login": langCode === "it" ? "ACCEDI" : "LOGIN",
        "int.signup": langCode === "it" ? "REGISTRATI" : "SIGN UP",
        "int.email": langCode === "it" ? "Email" : "Email",
        "int.password": langCode === "it" ? "Password" : "Password",
        "int.complete.all.fields": langCode === "it" ? "Compila tutti i campi" : "Please fill in all fields",
        "int.login.failed": langCode === "it" ? "Login fallito" : "Login failed",
        "int.creation.failed": langCode === "it" ? "Creazione account fallita" : "Account creation failed",
        "int.creation.success": langCode === "it" ? "Account creato con successo!" : "Account created successfully!",
        "int.connection.error": langCode === "it" ? "Errore di connessione" : "Connection error",
        "int.services.healthy": langCode === "it" ? "Servizi online" : "Services healthy",
        "int.service.check.failed": langCode === "it" ? "Verifica servizi fallita" : "Service check failed",
        "int.no.account": langCode === "it" ? "Non hai un account? Registrati" : "Don't have an account? Sign up",
        "int.have.account": langCode === "it" ? "Hai già un account? Accedi" : "Already have an account? Login",
        "int.forgot.password": langCode === "it" ? "Password dimenticata?" : "Forgot password?",
        "int.loading": langCode === "it" ? "Caricamento..." : "Loading...",
        "int.logo.financial": langCode === "it" ? "FINANZIARIO" : "FINANCIAL",
        "int.logo.estimates": langCode === "it" ? "STIME" : "ESTIMATES",
        "int.complete.profile": langCode === "it" ? "Completa il tuo profilo" : "Complete your profile",
        "int.select.currency": langCode === "it" ? "Seleziona valuta" : "Select currency",
        "int.select.timezone": langCode === "it" ? "Seleziona fuso orario" : "Select timezone",
        "int.select.language": langCode === "it" ? "Seleziona lingua" : "Select language",
        "int.update": langCode === "it" ? "Aggiorna" : "Update",
        "int.info.saved": langCode === "it" ? "Informazioni salvate" : "Information saved",
        "int.error.update": langCode === "it" ? "Errore durante l'aggiornamento" : "Error updating information",
        "int.error.saving": langCode === "it" ? "Errore durante il salvataggio" : "Error saving information",
      };

      logAction("Translations loaded", "success", { language: langCode, keys: Object.keys(translations).length });
    }

    function getTranslation(key) {
      return translations[key] || key;
    }

    function updateLanguageCombo() {
      const combo = document.getElementById('languageCombo');
      combo.innerHTML = '';
      availableLanguages.forEach(lang => {
        const option = document.createElement('option');
        option.value = lang.code;
        option.textContent = `${lang.flag} ${lang.description}`;
        if (lang.code === language) option.selected = true;
        combo.appendChild(option);
      });
      logAction("Language combo updated", "debug");
    }

    function updatePageTranslations() {
      logAction("Updating page translations", "info", { mode: isLogin ? "LOGIN" : "SIGNUP" });

      document.getElementById('form-title').textContent = getTranslation(isLogin ? 'int.login' : 'int.signup');

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.textContent = getTranslation(isLogin ? 'int.login' : 'int.signup');

      const switchForm = document.getElementById('switch-text');
      if (switchForm) switchForm.textContent = getTranslation(isLogin ? 'int.no.account' : 'int.have.account');

      const logoFinancial = document.getElementById('logo-financial');
      const logoEstimates = document.getElementById('logo-estimates');
      if (logoFinancial) logoFinancial.textContent = getTranslation('int.logo.financial');
      if (logoEstimates) logoEstimates.textContent = getTranslation('int.logo.estimates');

      const loadingOption = document.getElementById('loadingOption');
      if (loadingOption) loadingOption.textContent = getTranslation('int.loading');

      logAction("Page translations updated", "success");
    }

    async function changeLanguage(langCode) {
      logAction("Changing language", "info", { from: language, to: langCode });

      language = langCode;
      await loadTranslations(langCode);
      updateLanguageCombo();
      updatePageTranslations();

      logAction("Language changed successfully", "success", { language: langCode });
    }

    document.getElementById('languageCombo').addEventListener('input', async (e) => {
      const selectedLang = e.target.value;
      logAction("Language selector input event", "debug", { selected: selectedLang });

      if (selectedLang) {
        await changeLanguage(selectedLang);
      }
    });

    document.getElementById('languageCombo').addEventListener('click', async (e) => {
      const selectedLang = e.target.value;
      setTimeout(async () => {
        if (selectedLang && selectedLang !== language) {
          logAction("Language selector click event", "debug", { selected: selectedLang });
          await changeLanguage(selectedLang);
        }
      }, 10);
    });

    // ========== LOGIN/REGISTRATION LOGIC ==========

    document.getElementById("switch-form").addEventListener("click", () => {
      isLogin = !isLogin;
      logAction("Form mode switched", "info", { mode: isLogin ? "LOGIN" : "SIGNUP" });

      updatePageTranslations();
      document.getElementById("forgot-password").style.display = isLogin ? "block" : "none";
    });

    async function checkHealth() {
      logAction("Starting health check", "info");

      try {
        const response1 = await fetch(`${apiBaseUser}/health`, { cache: "no-cache", mode: "no-cors" });
        const response2 = await fetch(`${apiBaseNew}/health`, { cache: "no-cache", mode: "no-cors" });

        logAction("Health check completed", "success", {
          userApi: apiBaseUser,
          newApi: apiBaseNew
        });

        document.getElementById("app-container").style.display = "block";
        document.querySelector(".top-controls").style.display = "flex";
      } catch (err) {
        logAction("Health check failed", "error", { error: err.message });
        document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;"><img src="status/images/off-line.svg" alt="Offline" class="offline"></div>';
      }
    }

    // MAIN SUBMIT HANDLER
    document.getElementById('submit-btn').addEventListener("click", async () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      logAction("Submit button clicked", "info", {
        mode: isLogin ? "LOGIN" : "SIGNUP",
        username: username,
        passwordLength: password.length
      });

      // Validazione campi
      if (!username || !password) {
        logAction("Validation failed - missing fields", "warning", { username: !!username, password: !!password });
        alert(getTranslation("int.complete.all.fields") || "Please fill in all fields");
        return;
      }

      const apiUrl = isLogin ? `${apiBaseUser}/login` : `${apiBaseNew}/create`;
      const payload = { username, password, language };

      logAction("Preparing API request", "info", {
        url: apiUrl,
        payload: payload
      });

      try {
        logAction("Sending API request", "debug", { url: apiUrl, method: "POST" });

        const response = await fetch(apiUrl, {
          method: "POST",
          mode: "cors",
          credentials: "omit",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(payload)
        });

        logAction("API response received", "info", {
          status: response.status,
          statusText: response.statusText,
          contentType: response.headers.get("content-type")
        });

        const contentType = response.headers.get("content-type");
        let data;

        if (contentType && contentType.includes("application/json")) {
          data = await response.json();
          logAction("Response parsed as JSON", "debug", { data: data });
        } else {
          data = await response.text();
          logAction("Response parsed as text", "debug", { data: data });
        }

        // GESTIONE RISPOSTA OK
        if (response.ok) {
          logAction("API request succeeded", "success", {
            mode: isLogin ? "LOGIN" : "SIGNUP",
            dataKeys: typeof data === 'object' ? Object.keys(data) : "text"
          });

          if (isLogin) {
            logAction("Processing login response", "info", {
              hasToken: !!data.token,
              hasInfo: !!data.info,
              language: data.language
            });

            await loadTranslations(data.language || language);

            if (data.info && (!data.info.email || !data.info.language || !data.info.timezone || !data.info.currency)) {
              logAction("Missing user info detected", "warning", {
                info: data.info
              });
              requestMissingInfo(data.info, username, password);
            } else {
              logAction("Login successful - opening dashboard", "success", {
                username: username,
                token: data.token
              });
              openDashboard(username, data.token, data.language, data.currency);
            }
          } else {
            // SIGNUP SUCCESS
            logAction("Signup successful - switching to login mode", "success", { username: username });
            alert(getTranslation('int.creation.success') || "Account created successfully!");
            isLogin = true;
            updatePageTranslations();
            document.getElementById("username").value = username;
            document.getElementById("password").value = "";
          }
        } else {
          // GESTIONE ERRORE
          logAction("API request failed", "error", {
            status: response.status,
            statusText: response.statusText,
            responseData: data,
            mode: isLogin ? "LOGIN" : "SIGNUP"
          });

          // Estrai messaggio di errore da data se disponibile
          let errorMessage = isLogin
            ? getTranslation('int.login.failed')
            : getTranslation('int.creation.failed');

          if (typeof data === 'object' && data.error) {
            errorMessage = data.error;
            logAction("Error message from server", "debug", { error: data.error });
          } else if (typeof data === 'object' && data.message) {
            errorMessage = data.message;
            logAction("Message from server", "debug", { message: data.message });
          }

          alert(`${errorMessage}\n\nStatus: ${response.status} ${response.statusText}`);
        }
      } catch (err) {
        logAction("Network or parsing error", "error", {
          message: err.message,
          stack: err.stack
        });
        alert((getTranslation('int.connection.error') || "Connection error") + ": " + err.message);
      }
    });

    // Forgot password
    document.getElementById("forgot-password").addEventListener("click", () => {
      const username = document.getElementById("username").value.trim();
      logAction("Forgot password clicked", "info", { username: username });

      const url = username
        ? `dashboard-settings-changepassword.html?email=${encodeURIComponent(username)}&mode=forgot`
        : 'dashboard-dataentry-changepassword.html?mode=forgot';

      logAction("Redirecting to password reset page", "info", { url: url });
      window.location.href = url;
    });

    // Richiesta info mancanti
    function requestMissingInfo(info, username, password) {
      logAction("Requesting missing user info", "info", { missingInfo: info });

      document.querySelector('.top-controls').style.display = 'none';
      const container = document.getElementById("app-container");

      let currencyOptions = `<option value="">${getTranslation('int.select.currency')}</option>`;
      currencies.forEach(curr => {
        currencyOptions += `<option value="${curr.currency}">${curr['img.currency.flag']} ${curr.currency} - ${curr.description}</option>`;
      });

      let timezoneOptions = `<option value="">${getTranslation('int.select.timezone')}</option>`;
      timezones.forEach(tz => {
        timezoneOptions += `<option value="${tz.timezone}">${tz.timezone} (GMT${tz.offset_from_gmt}) - ${tz.reference_city}</option>`;
      });

      let languageOptions = `<option value="">${getTranslation('int.select.language')}</option>`;
      availableLanguages.forEach(lang => {
        languageOptions += `<option value="${lang.code}">${lang.flag} ${lang.description}</option>`;
      });

      container.innerHTML = `
        <h2>${getTranslation('int.complete.profile')}</h2>
        <div class="input-group">
          <i class="fa fa-envelope"></i>
          <input type="email" id="email" placeholder="${getTranslation('int.email')}" value="${info.email || ''}">
        </div>
        <div class="input-group">
          <i class="fa fa-language"></i>
          <select id="language">${languageOptions}</select>
        </div>
        <div class="input-group">
          <i class="fa fa-clock"></i>
          <select id="timezone">${timezoneOptions}</select>
        </div>
        <div class="input-group">
          <i class="fa fa-coins"></i>
          <select id="currency">${currencyOptions}</select>
        </div>
        <button id="save-info">${getTranslation('int.update')}</button>
      `;

      document.getElementById("save-info").addEventListener("click", async () => {
        const email = document.getElementById("email").value.trim();
        const lang = document.getElementById("language").value.trim();
        const currency = document.getElementById("currency").value.trim();
        const tz = document.getElementById("timezone").value.trim();

        logAction("Profile completion submitted", "info", {
          email: email,
          language: lang,
          currency: currency,
          timezone: tz
        });

        if (!email || !lang || !currency || !tz) {
          logAction("Profile completion validation failed", "warning", {
            email: !!email,
            language: !!lang,
            currency: !!currency,
            timezone: !!tz
          });
          alert(getTranslation('int.complete.all.fields'));
          return;
        }

        try {
          logAction("Sending profile update", "info", { username: username });

          const response = await fetch(`${apiBaseUser}/update`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password, email, language: lang, currency, timezone: tz })
          });

          const data = await response.json();

          logAction("Profile update response received", "info", {
            status: response.status,
            data: data
          });

          if (response.ok && data.status === "ok") {
            logAction("Profile update successful", "success", { username: username });
            alert(getTranslation('int.info.saved'));
            document.querySelector('.top-controls').style.display = 'flex';
            window.location.href = "login.html";
          } else {
            logAction("Profile update failed", "error", { data: data });
            alert(getTranslation("int.error.update"));
          }
        } catch (err) {
          logAction("Profile update error", "error", { error: err.message });
          alert(getTranslation("int.error.saving"));
        }
      });
    }

    // Apertura dashboard
    function openDashboard(username, token, lang, currency) {
      logAction("Opening dashboard", "info", {
        username: username,
        language: lang,
        currency: currency
      });

      localStorage.setItem("username", username);
      localStorage.setItem("token", token);
      localStorage.setItem("language", lang);
      if (currency) localStorage.setItem("currency", currency);

      logAction("LocalStorage data saved", "success", {
        username: username,
        tokenLength: token.length,
        language: lang
      });

      window.location.href = "dashboard.html";
    }

    // ========== INITIALIZATION ==========
    async function init() {
      console.clear();
      logAction("=".repeat(60), "info");
      logAction("FINANCIAL ESTIMATES - Login System Initialization", "info");
      logAction("=".repeat(60), "info");

      // Controlla lingua salvata
      const savedLanguage = localStorage.getItem('selectedLanguage');
      if (savedLanguage) {
        language = savedLanguage;
        logAction("Using saved language from localStorage", "info", { language: language });
      }

      // Inizializza lingue disponibili
      await initializeLanguages();

      // Carica traduzioni
      await loadTranslations(language);

      // Aggiorna combo lingue
      updateLanguageCombo();

      // Traduci pagina
      updatePageTranslations();

      // Health check
      await checkHealth();

      logAction("=".repeat(60), "success");
      logAction("Application initialized successfully", "success");
      logAction("=".repeat(60), "success");
    }

    init();
  </script>
</body>

</html>
