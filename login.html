<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login 0.1</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/png" href="images/icon-finest.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap');

    :root {
      --bg-color: #f5f5f0;
      --text-color: #333;
      --accent-color: #000;
      --paper-bg: #fff;
      --shadow-color: rgba(0, 0, 0, 0.08);
      --border-color: #000;
      --error-color: #d32f2f;
    }

    html {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      background-color: var(--bg-color);
      background-image: url('images/background.png');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: var(--text-color);
    }

    .top-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .close-button {
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      border-radius: 0;
      background: transparent;
      color: var(--text-color);
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-button:hover {
      background: #eee;
    }

    #languageCombo {
      padding: 8px 12px;
      border: 2px solid #00ffff;
      background: rgba(0, 0, 0, 0.5);
      color: #00ffff;
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff, inset 0 0 5px #00ffff;
      text-shadow: 0 0 5px #00ffff;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    #languageCombo:hover {
      box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, inset 0 0 10px #00ffff;
      transform: scale(1.02);
    }

    .container {
      background: var(--paper-bg);
      padding: 60px 50px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px var(--shadow-color);
      border-radius: 2px;
      width: 400px;
      text-align: center;
      position: relative;
    }

    .logo-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      margin-bottom: 40px;
    }

    /* 3D Rotating Cube - Wireframe Style */
    .cube-scene {
      width: 60px;
      height: 60px;
      perspective: 400px;
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: rotate-cube 12s infinite linear;
    }

    .cube-face {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 1px solid #000;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      backface-visibility: visible;
    }

    .cube-face.front {
      transform: translateZ(30px);
    }

    .cube-face.back {
      transform: rotateY(180deg) translateZ(30px);
    }

    .cube-face.right {
      transform: rotateY(90deg) translateZ(30px);
    }

    .cube-face.left {
      transform: rotateY(-90deg) translateZ(30px);
    }

    .cube-face.top {
      transform: rotateX(90deg) translateZ(30px);
    }

    .cube-face.bottom {
      transform: rotateX(-90deg) translateZ(30px);
    }

    @keyframes rotate-cube {
      0% {
        transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
      }

      100% {
        transform: rotateX(360deg) rotateY(360deg) rotateZ(0deg);
      }
    }

    .tron-text {
      text-align: left;
      font-family: 'Cormorant Garamond', serif;
      line-height: 1;
      border-left: 1px solid #000;
      padding-left: 15px;
    }

    .tron-text div:first-child {
      font-size: 1.4rem;
      font-weight: bold;
      color: #000;
      letter-spacing: 1px;
    }

    .tron-text div:last-child {
      font-size: 1.2rem;
      color: #555;
      font-style: italic;
      letter-spacing: 0.5px;
    }

    h2 {
      margin-bottom: 35px;
      color: #000;
      text-transform: uppercase;
      font-size: 1.3rem;
      letter-spacing: 2px;
      font-weight: normal;
      border-bottom: 1px solid #ddd;
      padding-bottom: 15px;
    }

    .input-group {
      position: relative;
      margin-bottom: 30px;
      text-align: left;
    }

    .input-group i {
      position: absolute;
      top: 10px;
      left: 0;
      color: #000;
      font-size: 0.9rem;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 8px 0 8px 25px;
      background: transparent;
      border: none;
      border-bottom: 1px solid #999;
      color: var(--text-color);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      border-radius: 0;
      transition: border-color 0.3s;
    }

    .input-group input:focus,
    .input-group select:focus {
      outline: none;
      border-bottom: 1px solid #000;
    }

    .input-group input::placeholder {
      font-style: italic;
      color: #999;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: #000;
      color: #fff;
      font-size: 1rem;
      font-family: 'Cormorant Garamond', serif;
      border-radius: 0;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    button:hover {
      background: #333;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .switch,
    .forgot {
      text-align: center;
      margin-top: 25px;
      font-size: 0.95rem;
      color: #666;
      cursor: pointer;
      transition: color 0.2s;
      font-style: italic;
    }

    .forgot:hover,
    .switch:hover {
      color: #000;
      text-decoration: underline;
    }

    .offline {
      width: 600px;
      max-width: 90vw;
      border: none;
      box-shadow: none;
    }
  </style>
</head>

<body>
  <div class="top-controls" style="display: none;">
    <!--
    <button class="close-button" id="closeButton">
      <i class="fa fa-times"></i>
      <span id="closeText">Close</span>
    </button>
  -->
    <select id="languageCombo">
      <option value="" id="loadingOption">Loading...</option>
    </select>
  </div>

  <div class="container" id="app-container" style="display: none;">
    <div class="logo-header">
      <div class="cube-scene">
        <div class="cube">
          <div class="cube-face front"></div>
          <div class="cube-face back"></div>
          <div class="cube-face right"></div>
          <div class="cube-face left"></div>
          <div class="cube-face top"></div>
          <div class="cube-face bottom"></div>
        </div>
      </div>
      <div class="tron-text">
        <div id="logo-financial">FINANCIAL</div>
        <div id="logo-estimates">ESTIMATES</div>
      </div>
    </div>
    <h2 id="form-title">Login</h2>

    <div class="input-group">
      <i class="fa fa-user"></i>
      <input type="text" id="username" placeholder="Username" pattern="[a-z0-9]+"
        oninput="this.value = this.value.toLowerCase().replace(/[^a-z0-9]/g, '')" autocomplete="username">
    </div>
    <div class="input-group">
      <i class="fa fa-lock"></i>
      <input type="password" id="password" placeholder="Password">
    </div>

    <button id="submit-btn">Sign in</button>
    <div class="forgot" id="forgot-password">Forgot password? Reset password</div>
    <div class="switch" id="switch-form">Don't have an account? Sign up</div>
  </div>

  <script>
    console.log("=== FinEst Login v0.31 ===");
    console.log("📅 " + new Date().toISOString());

    const apiBaseNew = "https://new-user-tunnel.fe-web.eu";
    const apiBaseUser = "https://user-tunnel.fe-web.eu";

    let language = 'en_UK'; // Lingua di default
    let translations = {};
    let currencies = [];
    let timezones = [];
    let availableLanguages = [];
    let isLogin = true;

    console.log("🌍 Default language:", language);
    console.log("🔗 API endpoints:", { apiBaseUser, apiBaseNew });

    // ========== CLOSE BUTTON ==========
    //document.getElementById('closeButton').addEventListener('click', () => {

    // Se è una PWA può chiudere davvero
    //  if (window.matchMedia('(display-mode: standalone)').matches) {
    //    window.close();
    //    return;
    // }

    // Se esiste una pagina precedente, torna indietro
    //  if (history.length > 1) {
    //    history.back();
    //    return;
    // }

    // Fallback universale per mobile
    //  window.location.href = "about:blank";
    //});

    // ========== LANGUAGE SYSTEM ==========

    // Leggi l'elenco delle lingue dal manifest
    async function loadLanguageManifest() {
      console.log("📋 Loading language manifest...");
      try {
        const response = await fetch('lang/manifest.json');
        if (!response.ok) {
          console.warn("⚠️ Cannot load manifest.json, status:", response.status);
          return [];
        }

        const manifest = await response.json();
        console.log("✅ Manifest loaded, languages:", manifest.languages || []);
        return manifest.languages || [];
      } catch (error) {
        console.error("❌ Error loading manifest:", error);
        return [];
      }
    }

    // Carica un singolo file di lingua
    async function loadLanguageFile(langCode) {
      console.log("📚 Loading language file:", langCode);
      try {
        const response = await fetch(`lang/${langCode}.json`);
        if (!response.ok) {
          console.warn("⚠️ Language file not found:", langCode, "status:", response.status);
          return null;
        }

        const data = await response.json();

        if (data['int.language.code'] && data['int.language.description'] && data['img.language.flag']) {
          console.log("✅ Language file loaded:", langCode);
          return {
            code: data['int.language.code'],
            description: data['int.language.description'],
            flag: data['img.language.flag']
          };
        } else {
          console.warn("⚠️ Invalid structure in", langCode + ".json");
          return null;
        }
      } catch (error) {
        console.error("❌ Error loading", langCode + ".json:", error);
        return null;
      }
    }

    // Inizializza le lingue
    async function initializeLanguages() {
      console.log("🌍 Initializing languages...");

      const langCodes = await loadLanguageManifest();
      console.log("📋 Found", langCodes.length, "languages in manifest");

      for (const langCode of langCodes) {
        const langData = await loadLanguageFile(langCode);
        if (langData) {
          availableLanguages.push(langData);
          console.log("✅ Language added:", langData.code, langData.description);
        }
      }

      console.log("✅ Languages initialized, total:", availableLanguages.length);
    }

    // Aggiorna combobox lingue
    function updateLanguageCombo() {
      console.log("🔄 Updating language combo, available:", availableLanguages.length);
      const combo = document.getElementById('languageCombo');
      combo.innerHTML = '';

      if (availableLanguages.length === 0) {
        console.warn("⚠️ No languages available to populate combo");
        combo.innerHTML = '<option value="">No languages</option>';
        return;
      }

      availableLanguages.forEach(lang => {
        const option = document.createElement('option');
        option.value = lang.code;
        option.textContent = `${lang.flag} ${lang.description}`;
        if (lang.code === language) {
          option.selected = true;
          console.log("🎯 Selected language:", lang.code);
        }
        combo.appendChild(option);
      });

      console.log("✅ Language combo updated, current language:", language);
    }

    // Carica traduzioni
    async function loadTranslations(lang) {
      console.log("📚 Loading translations for:", lang);
      try {
        const response = await fetch(`lang/${lang}.json`);
        if (!response.ok) {
          console.warn("⚠️ Translation file not found:", lang, "status:", response.status);
          throw new Error(`Translation file not found lang/${lang}.json`);
        }
        translations = await response.json();
        console.log("✅ Translations loaded for", lang, "keys:", Object.keys(translations).length);

        await loadCurrencies(lang);
        await loadTimezones();
      } catch (error) {
        console.error('❌ Error loading translations:', error);
        // Keep previous translations as fallback
      }
    }

    // Carica valute
    async function loadCurrencies(lang) {
      console.log("💱 Loading currencies for:", lang);
      try {
        const response = await fetch(`currency/${lang}.json`);
        if (!response.ok) {
          console.warn("⚠️ Currency file not found:", lang, "status:", response.status);
          throw new Error(`Currency file not found currency/${lang}.json`);
        }
        currencies = await response.json();
        console.log("✅ Currencies loaded:", currencies.length);
      } catch (error) {
        console.error('❌ Error loading currencies:', error);
        currencies = [];
      }
    }

    // Carica timezone
    async function loadTimezones() {
      console.log("🕐 Loading timezones...");
      try {
        const response = await fetch(`timezone/timezone.json`);
        if (!response.ok) {
          console.warn("⚠️ Timezone file not found, status:", response.status);
          throw new Error("Timezone file not found");
        }
        timezones = await response.json();
        console.log("✅ Timezones loaded:", timezones.length);
      } catch (error) {
        console.error('❌ Error loading timezones:', error);
        timezones = [];
      }
    }

    // Ottieni traduzione
    function getTranslation(key) {
      const result = translations[key] || key;
      if (!translations[key]) {
        console.debug("🔍 Translation missing for key:", key);
      }
      return result;
    }

    // Aggiorna traduzioni pagina
    function updatePageTranslations() {
      console.log("🔄 Updating page translations for language:", language);

      // Update close button text
      const closeText = document.getElementById('closeText');
      if (closeText) {
        const text = getTranslation('int.close');
        closeText.textContent = text;
        console.log("   closeText:", text);
      }

      const formTitle = document.getElementById('form-title');
      if (formTitle) {
        const text = isLogin ? getTranslation('int.login') : getTranslation('int.registration');
        formTitle.textContent = text;
        console.log("   form-title:", text, "(isLogin:", isLogin + ")");
      }

      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      if (usernameInput) {
        const text = getTranslation('int.username');
        usernameInput.placeholder = text;
        usernameInput.title = getTranslation('int.username.validation');
        console.log("   username placeholder:", text);
      }
      if (passwordInput) {
        const text = getTranslation('int.password');
        passwordInput.placeholder = text;
        console.log("   password placeholder:", text);
      }

      const submitBtn = document.getElementById('submit-btn');
      if (submitBtn) {
        const text = isLogin ? getTranslation('int.signin') : getTranslation('int.create.account');
        submitBtn.textContent = text;
        console.log("   submit-btn:", text, "(isLogin:", isLogin + ")");
      }

      const forgotPassword = document.getElementById('forgot-password');
      const switchForm = document.getElementById('switch-form');
      if (forgotPassword) {
        const text = getTranslation('int.forgot.password');
        forgotPassword.textContent = text;
        console.log("   forgot-password:", text);
      }
      if (switchForm) {
        const text = isLogin ? getTranslation('int.no.account') : getTranslation('int.have.account');
        switchForm.textContent = text;
        console.log("   switch-form:", text, "(isLogin:", isLogin + ")");
      }

      const logoFinancial = document.getElementById('logo-financial');
      const logoEstimates = document.getElementById('logo-estimates');
      if (logoFinancial) {
        const text = getTranslation('int.logo.financial');
        logoFinancial.textContent = text;
        console.log("   logo-financial:", text);
      }
      if (logoEstimates) {
        const text = getTranslation('int.logo.estimates');
        logoEstimates.textContent = text;
        console.log("   logo-estimates:", text);
      }

      const loadingOption = document.getElementById('loadingOption');
      if (loadingOption) {
        const text = getTranslation('int.loading');
        loadingOption.textContent = text;
        console.log("   loadingOption:", text);
      }

      console.log("✅ Page translations updated");
    }

    // Cambia lingua
    async function changeLanguage(langCode) {
      console.log("🌍 Changing language from", language, "to", langCode);

      language = langCode;

      // Carica SEMPRE le traduzioni, anche se è la stessa lingua
      await loadTranslations(langCode);
      updateLanguageCombo();
      updatePageTranslations();

      console.log("✅ Language changed successfully to", langCode);
    }

    // Event listener per combobox lingue - usa 'input' per catturare anche i clic sulla stessa opzione
    document.getElementById('languageCombo').addEventListener('input', async (e) => {
      const selectedLang = e.target.value;
      console.log("🔍 Language selector (input) changed to:", selectedLang);

      if (selectedLang) {
        await changeLanguage(selectedLang);
      }
    });

    // Fallback con 'click' per assicurare che catturi sempre la selezione
    document.getElementById('languageCombo').addEventListener('click', async (e) => {
      const selectedLang = e.target.value;
      setTimeout(async () => {
        if (selectedLang && selectedLang !== language) {
          console.log("🔍 Language selector (click) changed to:", selectedLang);
          await changeLanguage(selectedLang);
        }
      }, 10);
    });

    // ========== LOGIN/REGISTRATION LOGIC ==========

    // Switch login/registration
    document.getElementById("switch-form").addEventListener("click", () => {
      console.log("🔄 Switching form: isLogin =", isLogin, "->", !isLogin);
      isLogin = !isLogin;
      updatePageTranslations();
      document.getElementById("forgot-password").style.display = isLogin ? "block" : "none";
      console.log("✅ Form switched, forgot-password visible:", isLogin);
    });

    // Health check
    // Usa mode:'no-cors' per evitare il blocco CORS quando il reverse proxy
    // (Cloudflare) restituisce un 502: la risposta è "opaque" ma la fetch
    // non lancia eccezione, quindi sappiamo che il tunnel è raggiungibile.
    // Solo un errore di rete reale (tunnel completamente giù) lancia eccezione
    // e mostra la schermata offline.
    async function checkHealth() {
      console.log("🏥 Performing health check with no-cors mode...");
      try {
        console.log("📡 Checking user-tunnel (no-cors):", apiBaseUser + "/health");
        const resUser = await fetch(`${apiBaseUser}/health`, { cache: "no-cache", mode: "no-cors" });
        console.log("📡 user-tunnel response (opaque):", resUser.type, resUser.status);

        console.log("📡 Checking new-user-tunnel (no-cors):", apiBaseNew + "/health");
        const resNew = await fetch(`${apiBaseNew}/health`, { cache: "no-cache", mode: "no-cors" });
        console.log("📡 new-user-tunnel response (opaque):", resNew.type, resNew.status);

        console.log("✅ " + (getTranslation('int.services.healthy') || "Services healthy"));
        document.getElementById("app-container").style.display = "block";
        document.querySelector(".top-controls").style.display = "flex";
        console.log("🖥️ App container and top controls displayed");
      } catch (err) {
        console.error("❌ " + (getTranslation('int.service.check.failed') || "Service check failed") + ":", err);
        document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;"><img src="status/images/off-line.svg" alt="Offline" class="offline"></div>';
        console.log("🖥️ Offline screen displayed");
      }
    }

    // Submit
    document.getElementById('submit-btn').addEventListener("click", async () => {
      console.log("🔐 Submit button clicked, isLogin:", isLogin);
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      console.log("👤 Username:", username);

      if (!username || !password) {
        console.warn("⚠️ Empty fields detected");
        alert(getTranslation("int.complete.all.fields") || "Please fill in all fields");
        return;
      }

      const apiUrl = isLogin ? `${apiBaseUser}/login` : `${apiBaseNew}/create`;
      const payload = { username, password, language };
      console.log("📡 Sending request to:", apiUrl);
      console.log("📦 Payload:", { username, language });

      try {
        const response = await fetch(apiUrl, {
          method: "POST",
          mode: "cors",
          credentials: "omit",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(payload)
        });
        console.log("📡 Response status:", response.status, response.statusText);

        const contentType = response.headers.get("content-type");
        let data;
        if (contentType && contentType.includes("application/json")) {
          data = await response.json();
          console.log("📦 Response data (JSON):", data);
        } else {
          data = await response.text();
          console.log("📦 Response data (text):", data);
        }

        if (response.ok) {
          console.log("✅ Request successful");
          if (isLogin) {
            console.log("🔐 Login successful for user:", username);
            await loadTranslations(data.language || language);
            if (data.info && (!data.info.email || !data.info.language || !data.info.timezone || !data.info.currency)) {
              console.log("⚠️ User profile incomplete, requesting missing info");
              requestMissingInfo(data.info, username, password);
            } else {
              console.log("✅ User profile complete, opening dashboard");
              openDashboard(username, data.token, data.language, data.currency);
            }
          } else {
            console.log("✅ Registration successful for user:", username);
            alert(getTranslation('int.creation.success') || "Account created successfully!");
            isLogin = true;
            updatePageTranslations();
            document.getElementById("username").value = username;
            document.getElementById("password").value = "";
            console.log("🔄 Switched to login mode after successful registration");
          }
        } else {
          console.warn("⚠️ Request failed, status:", response.status);
          alert(isLogin ? getTranslation('int.login.failed') : getTranslation('int.creation.failed'));
        }
      } catch (err) {
        console.error("❌ Connection error:", err);
        alert((getTranslation('int.connection.error') || "Connection error") + ": " + err.message);
      }
    });

    // Forgot password
    document.getElementById("forgot-password").addEventListener("click", () => {
      const username = document.getElementById("username").value.trim();
      const url = username ? `dashboard-settings-changepassword.html?email=${encodeURIComponent(username)}&mode=forgot` : 'dashboard-dataentry-changepassword.html?mode=forgot';
      console.log("🔑 Forgot password clicked, username:", username || "(empty)");
      console.log("🔗 Navigating to:", url);
      window.location.href = url;
    });

    // Richiesta info mancanti
    function requestMissingInfo(info, username, password) {
      console.log("📝 Requesting missing profile info for user:", username);
      console.log("📋 Current info:", info);
      document.querySelector('.top-controls').style.display = 'none';
      console.log("🖥️ Top controls hidden");

      const container = document.getElementById("app-container");

      let currencyOptions = `<option value="">${getTranslation('int.select.currency')}</option>`;
      currencies.forEach(curr => {
        currencyOptions += `<option value="${curr.currency}">${curr['img.currency.flag']} ${curr.currency} - ${curr.description}</option>`;
      });
      console.log("💱 Currency options:", currencies.length);

      let timezoneOptions = `<option value="">${getTranslation('int.select.timezone')}</option>`;
      timezones.forEach(tz => {
        timezoneOptions += `<option value="${tz.timezone}">${tz.timezone} (GMT${tz.offset_from_gmt}) - ${tz.reference_city}</option>`;
      });
      console.log("🕐 Timezone options:", timezones.length);

      let languageOptions = `<option value="">${getTranslation('int.select.language')}</option>`;
      availableLanguages.forEach(lang => {
        languageOptions += `<option value="${lang.code}">${lang.flag} ${lang.description}</option>`;
      });
      console.log("🌍 Language options:", availableLanguages.length);

      container.innerHTML = `
        <h2>${getTranslation('int.complete.profile')}</h2>
        <div class="input-group">
          <i class="fa fa-envelope"></i>
          <input type="email" id="email" placeholder="${getTranslation('int.email')}" value="${info.email || ''}">
        </div>
        <div class="input-group">
          <i class="fa fa-language"></i>
          <select id="language">${languageOptions}</select>
        </div>
        <div class="input-group">
          <i class="fa fa-clock"></i>
          <select id="timezone">${timezoneOptions}</select>
        </div>
        <div class="input-group">
          <i class="fa fa-coins"></i>
          <select id="currency">${currencyOptions}</select>
        </div>
        <button id="save-info">${getTranslation('int.update')}</button>
      `;
      console.log("🖥️ Profile completion form rendered");

      document.getElementById("save-info").addEventListener("click", async () => {
        console.log("💾 Save profile info clicked");
        const email = document.getElementById("email").value.trim();
        const lang = document.getElementById("language").value.trim();
        const currency = document.getElementById("currency").value.trim();
        const tz = document.getElementById("timezone").value.trim();
        console.log("📋 Info to save:", { email, language: lang, currency, timezone: tz });

        if (!email || !lang || !currency || !tz) {
          console.warn("⚠️ Missing required fields:", { email, lang, currency, tz });
          alert(getTranslation('int.complete.all.fields'));
          return;
        }

        try {
          console.log("📡 Sending update request to:", `${apiBaseUser}/update`);
          const response = await fetch(`${apiBaseUser}/update`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password, email, language: lang, currency, timezone: tz })
          });
          console.log("📡 Response status:", response.status);

          const data = await response.json();
          console.log("📦 Response data:", data);

          if (response.ok && data.status === "ok") {
            console.log("✅ Profile info saved successfully");
            alert(getTranslation('int.info.saved'));
            document.querySelector('.top-controls').style.display = 'flex';
            console.log("🔄 Redirecting to login page");
            window.location.href = "login.html";
          } else {
            console.warn("⚠️ Update failed:", data);
            alert(getTranslation("int.error.update"));
          }
        } catch (err) {
          console.error("❌ Error saving profile:", err);
          alert(getTranslation("int.error.saving"));
        }
      });
    }

    // Apertura dashboard
    function openDashboard(username, token, lang, currency) {
      console.log("🚪 Opening dashboard for user:", username);
      console.log("📋 Data:", { token: token ? "present" : "missing", language: lang, currency });
      localStorage.setItem("username", username);
      localStorage.setItem("token", token);
      localStorage.setItem("language", lang);
      if (currency) localStorage.setItem("currency", currency);
      console.log("💾 Saved to localStorage");
      console.log("🔗 Navigating to dashboard.html");
      window.location.href = "dashboard.html";
    }

    // ========== INITIALIZATION ==========
    async function init() {
      console.log("🚀 Initializing application...");
      console.log("📅 " + new Date().toISOString());

      // 0. Controlla se c'è una lingua salvata da index.html
      const savedLanguage = localStorage.getItem('selectedLanguage');
      if (savedLanguage) {
        language = savedLanguage;
        console.log("🌍 Using saved language from index.html:", language);
      } else {
        console.log("🌍 No saved language, using default:", language);
      }

      // 1. Inizializza le lingue disponibili
      console.log("📚 Loading languages...");
      await initializeLanguages();

      // 2. Carica le traduzioni per la lingua di default
      console.log("📚 Loading translations...");
      await loadTranslations(language);

      // 3. Aggiorna il combo per mostrare la lingua di default selezionata
      updateLanguageCombo();

      // 4. Traduci la pagina
      updatePageTranslations();

      // 5. Health check
      await checkHealth();

      console.log("✅ Application initialized successfully");
    }

    // Override console methods to include timestamps if needed
    const originalLog = console.log;
    console.log = function () {
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
      originalLog.apply(console, [`[${timestamp}]`, ...arguments]);
    };

    const originalWarn = console.warn;
    console.warn = function () {
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
      originalWarn.apply(console, [`[${timestamp}] ⚠️`, ...arguments]);
    };

    const originalError = console.error;
    console.error = function () {
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
      originalError.apply(console, [`[${timestamp}] ❌`, ...arguments]);
    };

    const originalDebug = console.debug;
    console.debug = function () {
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
      originalDebug.apply(console, [`[${timestamp}] 🔍`, ...arguments]);
    };

    init();
  </script>
</body>
