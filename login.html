<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login 0.4</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/png" href="images/icon-finest.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap');

    :root {
      --bg-color: #f5f5f0;
      --text-color: #333;
      --accent-color: #000;
      --paper-bg: #fff;
      --shadow-color: rgba(0, 0, 0, 0.08);
      --border-color: #000;
      --error-color: #d32f2f;
      --sidebar-width: 260px;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      background-color: #000;
      color: var(--text-color);
      overflow: hidden;
    }

    /* ========== SFONDO A TUTTA PAGINA + login centrato ========== */
    .image-area {
      position: fixed;
      inset: 0;
      padding-right: var(--sidebar-width);
      background: #000 url('images/background.png') center / cover no-repeat;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ========== SIDEBAR NERA A DESTRA ========== */
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--sidebar-width);
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      gap: 20px;
      box-shadow: -2px 0 15px rgba(0, 0, 0, 0.6);
      border-left: 1px solid rgba(0, 255, 255, 0.15);
      overflow-y: auto;
    }

    .sidebar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #00ffff;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      padding: 10px 4px;
      width: 100%;
      background: transparent;
      border: none;
    }

    .sidebar-item:hover {
      color: #fff;
      text-shadow: 0 0 8px #00ffff;
      background: rgba(0, 255, 255, 0.08);
    }

    .sidebar-item i {
      font-size: 1.7rem;
      margin-bottom: 4px;
    }

    .sidebar-item.static {
      cursor: default;
    }

    .sidebar-item.static:hover {
      background: transparent;
      color: #00ffff;
      text-shadow: none;
    }

    .sidebar-divider {
      width: 70%;
      height: 1px;
      background: rgba(0, 255, 255, 0.3);
      margin: 8px 0;
    }

    #languageCombo {
      width: 100%;
      padding: 8px 6px;
      border: 1px solid #00ffff;
      background: rgba(0, 0, 0, 0.85);
      color: #00ffff;
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      outline: none;
      box-shadow: 0 0 5px #00ffff;
      text-shadow: 0 0 5px #00ffff;
      border-radius: 3px;
      text-align: left;
      transition: all 0.3s ease;
      margin-top: 6px;
    }

    #languageCombo:hover {
      box-shadow: 0 0 12px #00ffff;
    }

    #languageCombo option {
      background: #000;
      color: #00ffff;
    }

    /* ========== LOGIN CONTAINER ========== */
    .container {
      background: var(--paper-bg);
      padding: 60px 50px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      border-radius: 2px;
      width: 400px;
      max-width: 90%;
      text-align: center;
      position: relative;
      z-index: 5;
    }

    .logo-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      margin-bottom: 40px;
    }

    /* 3D Rotating Cube - Wireframe Style */
    .cube-scene {
      width: 60px;
      height: 60px;
      perspective: 400px;
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: rotate-cube 12s infinite linear;
    }

    .cube-face {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 1px solid #000;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      backface-visibility: visible;
    }

    .cube-face.front {
      transform: translateZ(30px);
    }

    .cube-face.back {
      transform: rotateY(180deg) translateZ(30px);
    }

    .cube-face.right {
      transform: rotateY(90deg) translateZ(30px);
    }

    .cube-face.left {
      transform: rotateY(-90deg) translateZ(30px);
    }

    .cube-face.top {
      transform: rotateX(90deg) translateZ(30px);
    }

    .cube-face.bottom {
      transform: rotateX(-90deg) translateZ(30px);
    }

    @keyframes rotate-cube {
      0% {
        transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
      }

      100% {
        transform: rotateX(360deg) rotateY(360deg) rotateZ(0deg);
      }
    }

    .tron-text {
      text-align: left;
      font-family: 'Cormorant Garamond', serif;
      line-height: 1;
      border-left: 1px solid #000;
      padding-left: 15px;
    }

    .tron-text div:first-child {
      font-size: 1.4rem;
      font-weight: bold;
      color: #000;
      letter-spacing: 1px;
    }

    .tron-text div:last-child {
      font-size: 1.2rem;
      color: #555;
      font-style: italic;
      letter-spacing: 0.5px;
    }

    h2 {
      margin-bottom: 35px;
      color: #000;
      text-transform: uppercase;
      font-size: 1.3rem;
      letter-spacing: 2px;
      font-weight: normal;
      border-bottom: 1px solid #ddd;
      padding-bottom: 15px;
    }

    .input-group {
      position: relative;
      margin-bottom: 30px;
      text-align: left;
    }

    .input-group i {
      position: absolute;
      top: 10px;
      left: 0;
      color: #000;
      font-size: 0.9rem;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 8px 0 8px 25px;
      background: transparent;
      border: none;
      border-bottom: 1px solid #999;
      color: var(--text-color);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      border-radius: 0;
      transition: border-color 0.3s;
    }

    .input-group input:focus,
    .input-group select:focus {
      outline: none;
      border-bottom: 1px solid #000;
    }

    .input-group input::placeholder {
      font-style: italic;
      color: #999;
    }

    button.submit {
      width: 100%;
      padding: 12px;
      border: none;
      background: #000;
      color: #fff;
      font-size: 1rem;
      font-family: 'Cormorant Garamond', serif;
      border-radius: 0;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    button.submit:hover {
      background: #333;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .switch,
    .forgot {
      text-align: center;
      margin-top: 25px;
      font-size: 0.95rem;
      color: #666;
      cursor: pointer;
      transition: color 0.2s;
      font-style: italic;
    }

    .forgot:hover,
    .switch:hover {
      color: #000;
      text-decoration: underline;
    }

    .offline {
      width: 600px;
      max-width: 90%;
      border: none;
      box-shadow: none;
    }

    /* ========== MESSAGGI (info / warning / errore) ========== */
    .toasts {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(460px, calc(100vw - var(--sidebar-width) - 48px));
      pointer-events: none;
    }

    .toast {
      --tc: #00ffff;
      pointer-events: auto;
      display: grid;
      grid-template-columns: auto 1fr auto;
      column-gap: 12px;
      row-gap: 4px;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(6px);
      border: 1px solid var(--tc);
      border-left-width: 4px;
      color: #ddd;
      font-size: 1.05rem;
      line-height: 1.3;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
      animation: toast-in 0.25s ease-out;
    }

    .toast.success {
      --tc: #4ade80;
    }

    .toast.warning {
      --tc: #fbbf24;
    }

    .toast.error {
      --tc: #ff5c5c;
    }

    .toast>* {
      grid-column: 2;
    }

    .toast .ti {
      grid-column: 1;
      grid-row: 1 / span 5;
      color: var(--tc);
      font-size: 1.3rem;
      margin-top: 2px;
    }

    .toast .tt {
      color: var(--tc);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .toast .tm {
      color: #fff;
      font-weight: 700;
      font-size: 1.15rem;
    }

    .toast .tx {
      color: #9ab;
      font: 0.78rem 'Courier New', monospace;
      word-break: break-word;
    }

    .toast .tc {
      grid-column: 3;
      grid-row: 1;
      background: none;
      border: 0;
      color: #aaa;
      cursor: pointer;
      font-size: 1rem;
    }

    .toast .tc:hover,
    .toast .tc:focus-visible {
      color: #fff;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateX(-12px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .toast {
        animation: none;
      }
    }

    /* ========== MOBILE: opzioni in barra inferiore ========== */
    @media (max-width: 720px) {
      .toasts {
        width: calc(100vw - 32px);
      }

      .sidebar {
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: auto;
        flex-direction: row;
        justify-content: space-around;
        align-items: flex-start;
        padding: 10px;
        gap: 10px;
        border-left: 0;
        border-top: 1px solid rgba(0, 255, 255, 0.15);
      }

      .sidebar-divider {
        display: none;
      }

      .sidebar-item {
        width: auto;
      }

      .tron-footer {
        bottom: 110px;
      }

      .image-area {
        padding-right: 0 !important;
        padding-bottom: 110px;
        overflow-y: auto;
      }
    }
  </style>
</head>

<body>

  <!-- Immagine di sfondo a tutta pagina + login centrato -->
  <div class="image-area">
    <div class="container" id="app-container" style="display: none;">
      <div class="logo-header">
        <div class="cube-scene">
          <div class="cube">
            <div class="cube-face front"></div>
            <div class="cube-face back"></div>
            <div class="cube-face right"></div>
            <div class="cube-face left"></div>
            <div class="cube-face top"></div>
            <div class="cube-face bottom"></div>
          </div>
        </div>
        <div class="tron-text">
          <div id="logo-financial">FINANCIAL</div>
          <div id="logo-estimates">ESTIMATES</div>
        </div>
      </div>
      <h2 id="form-title">Login</h2>

      <div class="input-group">
        <i class="fa fa-user"></i>
        <input type="text" id="username" placeholder="Username" pattern="[a-z0-9]+"
          oninput="this.value = this.value.toLowerCase().replace(/[^a-z0-9]/g, '')" autocomplete="username">
      </div>
      <div class="input-group">
        <i class="fa fa-lock"></i>
        <input type="password" id="password" placeholder="Password">
      </div>

      <button class="submit" id="submit-btn">Sign in</button>
      <div class="forgot" id="forgot-password">Forgot password? Reset password</div>
      <div class="switch" id="switch-form">Don't have an account? Sign up</div>
    </div>
  </div>

  <!-- Opzioni a destra, sopra l'immagine -->
  <div class="sidebar" id="sidebar" style="display: none;">
    <button class="sidebar-item" id="closeButton">
      <i class="fa fa-times"></i>
      <span id="closeText">Close</span>
    </button>

    <div class="sidebar-divider"></div>

    <div class="sidebar-item static">
      <i class="fa fa-globe"></i>
      <span>LANG</span>
      <select id="languageCombo">
        <option value="" id="loadingOption">Loading...</option>
      </select>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script>
    console.log("=== FinEst Login v0.31 ===");
    console.log("📅 " + new Date().toISOString());

    const apiBaseNew = "https://new-user-tunnel.fe-web.eu";
    const apiBaseUser = "https://user-tunnel.fe-web.eu";

    let language = 'en_UK';
    let translations = {};

    // ===== Messaggi info/warning/errore: titolo + motivo (web.msg.*) =====
    const MSG_FALLBACK = { "web.msg.type.info": "INFORMATION", "web.msg.type.warning": "WARNING", "web.msg.type.error": "ERROR", "web.msg.type.success": "SUCCESS", "web.msg.technical": "Technical detail", "web.msg.http.status": "Server response: HTTP {status}", "web.msg.login.success": "Signed in", "web.msg.login.success.detail": "Welcome, {user}. Opening the dashboard...", "web.msg.login.failed": "Sign-in failed", "web.msg.login.failed.detail": "Wrong username or password. Check your credentials.", "web.msg.login.locked": "Account locked", "web.msg.login.locked.detail": "This account is locked. Contact the administrator to unlock it.", "web.msg.login.notfound": "User not found", "web.msg.login.notfound.detail": "No user has this name. Check the username or sign up.", "web.msg.login.disabled": "Sign-in suspended", "web.msg.login.disabled.detail": "Sign-in is temporarily disabled: the system is under maintenance.", "web.msg.fields.required": "Required fields missing", "web.msg.fields.required.detail": "Fill in all required fields to continue.", "web.msg.fields.missing": "Missing fields: {fields}.", "web.msg.connection.error": "Connection error", "web.msg.connection.error.detail": "Cannot reach the server. Check your network connection.", "web.msg.server.offline": "Server offline", "web.msg.server.offline.detail": "The service servers are not responding or are temporarily unreachable.", "web.msg.service.degraded": "Partial service", "web.msg.service.degraded.detail": "One or more backend services failed the health check.", "web.msg.service.list": "Services with problems: {services}.", "web.msg.server.error": "Server error", "web.msg.server.error.detail": "The server returned an internal error. Try again shortly; if it persists contact support.", "web.msg.request.invalid": "Invalid data", "web.msg.request.invalid.detail": "The server rejected the submitted data. Check the values and try again.", "web.msg.registration.success": "Registration complete", "web.msg.registration.success.detail": "The account was created. You can now sign in.", "web.msg.registration.failed": "Registration failed", "web.msg.registration.failed.detail": "The account could not be created. Try again with valid data.", "web.msg.registration.exists": "User already registered", "web.msg.registration.exists.detail": "This username is already taken. Choose another or sign in.", "web.msg.profile.saved": "Profile updated", "web.msg.profile.saved.detail": "Your profile information was saved.", "web.msg.profile.error": "Profile update failed", "web.msg.profile.error.detail": "An error occurred while updating the profile data.", "web.msg.profile.incomplete": "Profile incomplete", "web.msg.profile.incomplete.detail": "Complete the missing profile information to continue.", "web.msg.maintenance": "System under maintenance", "web.msg.maintenance.detail": "The service is temporarily suspended for maintenance.", "web.msg.lang.manifest.failed": "Language list unavailable", "web.msg.lang.manifest.failed.detail": "Cannot load lang/manifest.json: the language selector may be empty.", "web.msg.lang.file.failed": "Language files not loaded", "web.msg.lang.file.failed.detail": "These language files are missing or invalid: {langs}.", "web.msg.translations.failed": "Translations not loaded", "web.msg.translations.failed.detail": "Cannot load language file {lang}: default texts are shown.", "web.msg.currencies.failed": "Currencies unavailable", "web.msg.currencies.failed.detail": "Cannot load the currency list: the profile selector will be empty.", "web.msg.timezones.failed": "Time zones unavailable", "web.msg.timezones.failed.detail": "Cannot load the time zone list: the profile selector will be empty.", "web.msg.field.username": "Username", "web.msg.field.password": "Password", "web.msg.field.email": "Email address", "web.msg.field.language": "Language", "web.msg.field.timezone": "Time zone", "web.msg.field.currency": "Currency" };
    const issues = [], langFails = [];
    const later = (...a) => issues.push(a);
    const has = k => translations[k] || MSG_FALLBACK[k];
    function t(key, p) {
      return (has(key) || key).replace(/\{(\w+)\}/g, (m, k) => (p && p[k] !== undefined ? p[k] : m));
    }
    // type: info | success | warning | error;  key: web.msg.<nome> (+ .detail);  o: {params, extra, technical}
    function notify(type, key, o = {}) {
      const box = document.getElementById('toasts');
      box.querySelector(`[data-k="${key}"]`)?.remove();
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.dataset.k = key;
      el.setAttribute('role', type === 'error' ? 'alert' : 'status');
      const icon = { info: 'circle-info', success: 'circle-check', warning: 'triangle-exclamation', error: 'circle-xmark' }[type];
      el.innerHTML = `<i class="fa-solid fa-${icon} ti" aria-hidden="true"></i>` +
        `<button type="button" class="tc"><i class="fa-solid fa-xmark"></i></button>`;
      const add = (c, txt) => { if (!txt) return; const d = document.createElement('div'); d.className = c; d.textContent = txt; el.appendChild(d); };
      add('tt', t('web.msg.type.' + type));
      add('tm', t(key, o.params));
      add('td', has(key + '.detail') && t(key + '.detail', o.params));
      add('td', o.extra);
      add('tx', o.technical && t('web.msg.technical') + ': ' + o.technical);
      const btn = el.querySelector('.tc');
      btn.setAttribute('aria-label', translations['int.close'] || 'Close');
      btn.onclick = () => el.remove();
      box.appendChild(el);
      while (box.children.length > 4) box.firstChild.remove();
      const ms = { success: 6000, info: 8000, warning: 12000 }[type];
      if (ms) setTimeout(() => el.remove(), ms);
      console.log(`💬 [${type}] ${key}`, o.technical || '');
    }
    function flushIssues() {
      if (langFails.length) notify('warning', 'web.msg.lang.file.failed', { params: { langs: langFails.splice(0).join(', ') } });
      issues.splice(0).forEach(a => notify(...a));
    }
    let currencies = [];
    let timezones = [];
    let availableLanguages = [];
    let isLogin = true;

    console.log("🌍 Default language:", language);
    console.log("🔗 API endpoints:", { apiBaseUser, apiBaseNew });

    // ========== CLOSE BUTTON ==========
    document.getElementById('closeButton').addEventListener('click', () => {
      console.log("❌ Close button clicked -> index.html");
      window.location.href = "index.html";
    });

    // ========== LANGUAGE SYSTEM ==========
    async function loadLanguageManifest() {
      console.log("📋 Loading language manifest...");
      try {
        const response = await fetch('lang/manifest.json');
        if (!response.ok) {
          console.warn("⚠️ Cannot load manifest.json, status:", response.status);
          later('warning', 'web.msg.lang.manifest.failed', { technical: t('web.msg.http.status', { status: response.status }) });
          return [];
        }
        const manifest = await response.json();
        console.log("✅ Manifest loaded, languages:", manifest.languages || []);
        return manifest.languages || [];
      } catch (error) {
        console.error("❌ Error loading manifest:", error);
        later('warning', 'web.msg.lang.manifest.failed', { technical: error.message });
        return [];
      }
    }

    async function loadLanguageFile(langCode) {
      console.log("📚 Loading language file:", langCode);
      try {
        const response = await fetch(`lang/${langCode}.json`);
        if (!response.ok) {
          console.warn("⚠️ Language file not found:", langCode, "status:", response.status);
          return null;
        }
        const data = await response.json();
        if (data['int.language.code'] && data['int.language.description'] && data['img.language.flag']) {
          console.log("✅ Language file loaded:", langCode);
          return {
            code: data['int.language.code'],
            description: data['int.language.description'],
            flag: data['img.language.flag']
          };
        } else {
          console.warn("⚠️ Invalid structure in", langCode + ".json");
          return null;
        }
      } catch (error) {
        console.error("❌ Error loading", langCode + ".json:", error);
        return null;
      }
    }

    async function initializeLanguages() {
      console.log("🌍 Initializing languages...");
      const langCodes = await loadLanguageManifest();
      console.log("📋 Found", langCodes.length, "languages in manifest");

      for (const langCode of langCodes) {
        const langData = await loadLanguageFile(langCode);
        if (langData) {
          availableLanguages.push(langData);
          console.log("✅ Language added:", langData.code, langData.description);
        } else {
          langFails.push(langCode);
        }
      }

      console.log("✅ Languages initialized, total:", availableLanguages.length);
    }

    function updateLanguageCombo() {
      console.log("🔄 Updating language combo, available:", availableLanguages.length);
      const combo = document.getElementById('languageCombo');
      combo.innerHTML = '';

      if (availableLanguages.length === 0) {
        console.warn("⚠️ No languages available to populate combo");
        combo.innerHTML = '<option value="">No languages</option>';
        return;
      }

      availableLanguages.forEach(lang => {
        const option = document.createElement('option');
        option.value = lang.code;
        option.textContent = `${lang.flag} ${lang.description}`;
        if (lang.code === language) {
          option.selected = true;
          console.log("🎯 Selected language:", lang.code);
        }
        combo.appendChild(option);
      });

      console.log("✅ Language combo updated, current language:", language);
    }

    async function loadTranslations(lang) {
      console.log("📚 Loading translations for:", lang);
      try {
        const response = await fetch(`lang/${lang}.json`);
        if (!response.ok) {
          console.warn("⚠️ Translation file not found:", lang, "status:", response.status);
          throw new Error(`Translation file not found lang/${lang}.json`);
        }
        translations = await response.json();
        console.log("✅ Translations loaded for", lang, "keys:", Object.keys(translations).length);

        await loadCurrencies(lang);
        await loadTimezones();
      } catch (error) {
        console.error('❌ Error loading translations:', error);
        notify('warning', 'web.msg.translations.failed', { params: { lang }, technical: error.message });
      }
    }

    async function loadCurrencies(lang) {
      console.log("💱 Loading currencies for:", lang);
      try {
        const response = await fetch(`currency/${lang}.json`);
        if (!response.ok) {
          console.warn("⚠️ Currency file not found:", lang, "status:", response.status);
          throw new Error(`Currency file not found currency/${lang}.json`);
        }
        currencies = await response.json();
        console.log("✅ Currencies loaded:", currencies.length);
      } catch (error) {
        console.error('❌ Error loading currencies:', error);
        currencies = [];
      }
    }

    async function loadTimezones() {
      console.log("🕐 Loading timezones...");
      try {
        const response = await fetch(`timezone/timezone.json`);
        if (!response.ok) {
          console.warn("⚠️ Timezone file not found, status:", response.status);
          throw new Error("Timezone file not found");
        }
        timezones = await response.json();
        console.log("✅ Timezones loaded:", timezones.length);
      } catch (error) {
        console.error('❌ Error loading timezones:', error);
        timezones = [];
      }
    }

    function getTranslation(key) {
      const result = translations[key] || key;
      if (!translations[key]) {
        console.debug("🔍 Translation missing for key:", key);
      }
      return result;
    }

    function updatePageTranslations() {
      console.log("🔄 Updating page translations for language:", language);

      const closeText = document.getElementById('closeText');
      if (closeText) {
        const text = getTranslation('int.close');
        closeText.textContent = text;
        console.log("   closeText:", text);
      }

      const formTitle = document.getElementById('form-title');
      if (formTitle) {
        const text = isLogin ? getTranslation('int.login') : getTranslation('int.registration');
        formTitle.textContent = text;
        console.log("   form-title:", text, "(isLogin:", isLogin + ")");
      }

      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      if (usernameInput) {
        const text = getTranslation('int.username');
        usernameInput.placeholder = text;
        usernameInput.title = getTranslation('int.username.validation');
        console.log("   username placeholder:", text);
      }
      if (passwordInput) {
        const text = getTranslation('int.password');
        passwordInput.placeholder = text;
        console.log("   password placeholder:", text);
      }

      const submitBtn = document.getElementById('submit-btn');
      if (submitBtn) {
        const text = isLogin ? getTranslation('int.signin') : getTranslation('int.create.account');
        submitBtn.textContent = text;
        console.log("   submit-btn:", text, "(isLogin:", isLogin + ")");
      }

      const forgotPassword = document.getElementById('forgot-password');
      const switchForm = document.getElementById('switch-form');
      if (forgotPassword) {
        const text = getTranslation('int.forgot.password');
        forgotPassword.textContent = text;
        console.log("   forgot-password:", text);
      }
      if (switchForm) {
        const text = isLogin ? getTranslation('int.no.account') : getTranslation('int.have.account');
        switchForm.textContent = text;
        console.log("   switch-form:", text, "(isLogin:", isLogin + ")");
      }

      const logoFinancial = document.getElementById('logo-financial');
      const logoEstimates = document.getElementById('logo-estimates');
      if (logoFinancial) {
        const text = getTranslation('int.logo.financial');
        logoFinancial.textContent = text;
        console.log("   logo-financial:", text);
      }
      if (logoEstimates) {
        const text = getTranslation('int.logo.estimates');
        logoEstimates.textContent = text;
        console.log("   logo-estimates:", text);
      }

      const loadingOption = document.getElementById('loadingOption');
      if (loadingOption) {
        const text = getTranslation('int.loading');
        loadingOption.textContent = text;
        console.log("   loadingOption:", text);
      }

      console.log("✅ Page translations updated");
    }

    async function changeLanguage(langCode) {
      console.log("🌍 Changing language from", language, "to", langCode);
      language = langCode;
      await loadTranslations(langCode);
      updateLanguageCombo();
      updatePageTranslations();
      console.log("✅ Language changed successfully to", langCode);
    }

    document.getElementById('languageCombo').addEventListener('input', async (e) => {
      const selectedLang = e.target.value;
      console.log("🔍 Language selector (input) changed to:", selectedLang);
      if (selectedLang) {
        await changeLanguage(selectedLang);
      }
    });

    // ===== Errori HTTP -> messaggio con motivo =====
    const REASONS = {
      'int.wrong.credentials': 'login.failed', 'int.locked.user': 'login.locked',
      'int.user.notfound': 'login.notfound', 'int.user.alreadyregistered': 'registration.exists'
    };
    function serverReason(data) {
      const raw = data && typeof data === 'object' ? (data.detail || data.message || data.error || data.reason) : data;
      return typeof raw === 'string' && raw.length < 200 && !raw.includes('<') ? raw : '';
    }
    function httpTech(status, data) {
      const r = serverReason(data);
      return t('web.msg.http.status', { status }) + (r ? ' — ' + r : '');
    }
    function notifyHttpError(status, data) {
      let k = REASONS[serverReason(data)];
      if (!k) {
        if (status >= 500) k = 'server.error';
        else if (status === 400 || status === 422) k = 'request.invalid';
        else if (isLogin) k = { 404: 'login.notfound', 423: 'login.locked' }[status] || 'login.failed';
        else k = status === 409 ? 'registration.exists' : 'registration.failed';
      }
      notify('error', 'web.msg.' + k, { technical: httpTech(status, data) });
    }

    // ========== LOGIN/REGISTRATION LOGIC ==========
    document.getElementById("switch-form").addEventListener("click", () => {
      console.log("🔄 Switching form: isLogin =", isLogin, "->", !isLogin);
      isLogin = !isLogin;
      updatePageTranslations();
      document.getElementById("forgot-password").style.display = isLogin ? "block" : "none";
      console.log("✅ Form switched, forgot-password visible:", isLogin);
    });

    async function checkHealth() {
      console.log("🏥 Performing health check with no-cors mode...");
      const fails = [];
      for (const [name, base] of [['user-tunnel', apiBaseUser], ['new-user-tunnel', apiBaseNew]]) {
        try {
          await fetch(`${base}/health`, { cache: "no-cache", mode: "no-cors" });
        } catch (err) {
          fails.push({ name, reason: err.message });
        }
      }
      document.getElementById("sidebar").style.display = "flex";
      if (!fails.length) {
        console.log("✅ Services healthy");
        document.getElementById("app-container").style.display = "block";
        return;
      }
      document.querySelector('.image-area').innerHTML = '<img src="status/images/off-line.svg" alt="Offline" class="offline">';
      const all = fails.length === 2;
      notify(all ? 'error' : 'warning', all ? 'web.msg.server.offline' : 'web.msg.service.degraded', {
        extra: t('web.msg.service.list', { services: fails.map(f => f.name).join(', ') }),
        technical: fails.map(f => `${f.name}: ${f.reason}`).join(' | ')
      });
    }

    document.getElementById('submit-btn').addEventListener("click", async () => {
      console.log("🔐 Submit button clicked, isLogin:", isLogin);
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      console.log("👤 Username:", username);

      if (!username || !password) {
        console.warn("⚠️ Empty fields detected");
        const miss = [!username && t('web.msg.field.username'), !password && t('web.msg.field.password')].filter(Boolean);
        notify('warning', 'web.msg.fields.required', { extra: t('web.msg.fields.missing', { fields: miss.join(', ') }) });
        return;
      }

      const apiUrl = isLogin ? `${apiBaseUser}/login` : `${apiBaseNew}/create`;
      const payload = { username, password, language };
      console.log("📡 Sending request to:", apiUrl);
      console.log("📦 Payload:", { username, language });

      try {
        const response = await fetch(apiUrl, {
          method: "POST",
          mode: "cors",
          credentials: "omit",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(payload)
        });
        console.log("📡 Response status:", response.status, response.statusText);

        const contentType = response.headers.get("content-type");
        let data;
        if (contentType && contentType.includes("application/json")) {
          data = await response.json();
          console.log("📦 Response data (JSON):", data);
        } else {
          data = await response.text();
          console.log("📦 Response data (text):", data);
        }

        if (response.ok) {
          console.log("✅ Request successful");
          if (isLogin) {
            console.log("🔐 Login successful for user:", username);
            notify('success', 'web.msg.login.success', { params: { user: username } });
            await loadTranslations(data.language || language);
            if (data.info && (!data.info.email || !data.info.language || !data.info.timezone || !data.info.currency)) {
              console.log("⚠️ User profile incomplete, requesting missing info");
              requestMissingInfo(data.info, username, password);
            } else {
              console.log("✅ User profile complete, opening dashboard");
              openDashboard(username, data.token, data.language, data.currency);
            }
          } else {
            console.log("✅ Registration successful for user:", username);
            notify('success', 'web.msg.registration.success');
            isLogin = true;
            updatePageTranslations();
            document.getElementById("username").value = username;
            document.getElementById("password").value = "";
            console.log("🔄 Switched to login mode after successful registration");
          }
        } else {
          console.warn("⚠️ Request failed, status:", response.status);
          notifyHttpError(response.status, data);
        }
      } catch (err) {
        console.error("❌ Connection error:", err);
        notify('error', 'web.msg.connection.error', { technical: err.message });
      }
    });

    document.getElementById("forgot-password").addEventListener("click", () => {
      const username = document.getElementById("username").value.trim();
      const url = username ? `dashboard-settings-changepassword.html?email=${encodeURIComponent(username)}&mode=forgot` : 'dashboard-dataentry-changepassword.html?mode=forgot';
      console.log("🔑 Forgot password clicked, username:", username || "(empty)");
      console.log("🔗 Navigating to:", url);
      window.location.href = url;
    });

    function requestMissingInfo(info, username, password) {
      console.log("📝 Requesting missing profile info for user:", username);
      console.log("📋 Current info:", info);
      const miss = ['email', 'language', 'timezone', 'currency'].filter(k => !info[k]).map(k => t('web.msg.field.' + k));
      notify('info', 'web.msg.profile.incomplete', { extra: t('web.msg.fields.missing', { fields: miss.join(', ') }) });
      if (!currencies.length) notify('warning', 'web.msg.currencies.failed');
      if (!timezones.length) notify('warning', 'web.msg.timezones.failed');
      document.getElementById('sidebar').style.display = 'none';
      console.log("🖥️ Sidebar hidden");

      const container = document.getElementById("app-container");

      let currencyOptions = `<option value="">${getTranslation('int.select.currency')}</option>`;
      currencies.forEach(curr => {
        currencyOptions += `<option value="${curr.currency}">${curr['img.currency.flag']} ${curr.currency} - ${curr.description}</option>`;
      });
      console.log("💱 Currency options:", currencies.length);

      let timezoneOptions = `<option value="">${getTranslation('int.select.timezone')}</option>`;
      timezones.forEach(tz => {
        timezoneOptions += `<option value="${tz.timezone}">${tz.timezone} (GMT${tz.offset_from_gmt}) - ${tz.reference_city}</option>`;
      });
      console.log("🕐 Timezone options:", timezones.length);

      let languageOptions = `<option value="">${getTranslation('int.select.language')}</option>`;
      availableLanguages.forEach(lang => {
        languageOptions += `<option value="${lang.code}">${lang.flag} ${lang.description}</option>`;
      });
      console.log("🌍 Language options:", availableLanguages.length);

      container.innerHTML = `
        <h2>${getTranslation('int.complete.profile')}</h2>
        <div class="input-group">
          <i class="fa fa-envelope"></i>
          <input type="email" id="email" placeholder="${getTranslation('int.email')}" value="${info.email || ''}">
        </div>
        <div class="input-group">
          <i class="fa fa-language"></i>
          <select id="language">${languageOptions}</select>
        </div>
        <div class="input-group">
          <i class="fa fa-clock"></i>
          <select id="timezone">${timezoneOptions}</select>
        </div>
        <div class="input-group">
          <i class="fa fa-coins"></i>
          <select id="currency">${currencyOptions}</select>
        </div>
        <button class="submit" id="save-info">${getTranslation('int.update')}</button>
      `;
      console.log("🖥️ Profile completion form rendered");

      document.getElementById("save-info").addEventListener("click", async () => {
        console.log("💾 Save profile info clicked");
        const email = document.getElementById("email").value.trim();
        const lang = document.getElementById("language").value.trim();
        const currency = document.getElementById("currency").value.trim();
        const tz = document.getElementById("timezone").value.trim();
        console.log("📋 Info to save:", { email, language: lang, currency, timezone: tz });

        if (!email || !lang || !currency || !tz) {
          console.warn("⚠️ Missing required fields:", { email, lang, currency, tz });
          const miss = [[email, 'email'], [lang, 'language'], [tz, 'timezone'], [currency, 'currency']]
            .filter(([v]) => !v).map(([, k]) => t('web.msg.field.' + k));
          notify('warning', 'web.msg.fields.required', { extra: t('web.msg.fields.missing', { fields: miss.join(', ') }) });
          return;
        }

        try {
          console.log("📡 Sending update request to:", `${apiBaseUser}/update`);
          const response = await fetch(`${apiBaseUser}/update`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password, email, language: lang, currency, timezone: tz })
          });
          console.log("📡 Response status:", response.status);

          const data = await response.json();
          console.log("📦 Response data:", data);

          if (response.ok && data.status === "ok") {
            console.log("✅ Profile info saved successfully");
            notify('success', 'web.msg.profile.saved');
            document.getElementById('sidebar').style.display = 'flex';
            console.log("🔄 Redirecting to login page");
            setTimeout(() => { window.location.href = "login.html"; }, 1200);
          } else {
            console.warn("⚠️ Update failed:", data);
            notify('error', response.status >= 500 ? 'web.msg.server.error' : 'web.msg.profile.error', { technical: httpTech(response.status, data) });
          }
        } catch (err) {
          console.error("❌ Error saving profile:", err);
          notify('error', 'web.msg.connection.error', { technical: err.message });
        }
      });
    }

    function openDashboard(username, token, lang, currency) {
      console.log("🚪 Opening dashboard for user:", username);
      console.log("📋 Data:", { token: token ? "present" : "missing", language: lang, currency });
      localStorage.setItem("username", username);
      localStorage.setItem("token", token);
      localStorage.setItem("language", lang);
      if (currency) localStorage.setItem("currency", currency);
      console.log("💾 Saved to localStorage");
      console.log("🔗 Navigating to dashboard.html");
      setTimeout(() => { window.location.href = "dashboard.html"; }, 800);
    }

    // ========== INITIALIZATION ==========
    async function init() {
      console.log("🚀 Initializing application...");
      console.log("📅 " + new Date().toISOString());

      const savedLanguage = localStorage.getItem('selectedLanguage');
      if (savedLanguage) {
        language = savedLanguage;
        console.log("🌍 Using saved language from index.html:", language);
      } else {
        console.log("🌍 No saved language, using default:", language);
      }

      console.log("📚 Loading languages...");
      await initializeLanguages();

      console.log("📚 Loading translations...");
      await loadTranslations(language);

      updateLanguageCombo();
      updatePageTranslations();

      flushIssues();
      await checkHealth();

      console.log("✅ Application initialized successfully");
    }

    // Console timestamp override
    const originalLog = console.log;
    console.log = function () {
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
      originalLog.apply(console, [`[${timestamp}]`, ...arguments]);
    };

    const originalWarn = console.warn;
    console.warn = function () {
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
      originalWarn.apply(console, [`[${timestamp}] ⚠️`, ...arguments]);
    };

    const originalError = console.error;
    console.error = function () {
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
      originalError.apply(console, [`[${timestamp}] ❌`, ...arguments]);
    };

    const originalDebug = console.debug;
    console.debug = function () {
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
      originalDebug.apply(console, [`[${timestamp}] 🔍`, ...arguments]);
    };

    init();
  </script>
