<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Mobile 1.0</title>
    <link rel="icon" type="image/png" href="images/icon-finest.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f3f5f8;
            --card: #fff;
            --line: #e4e8ee;
            --ink: #141a26;
            --sub: #667085;
            --accent: #2454d6;
            --pos: #0e8a48;
            --neg: #c62828;
            --pos-bg: #e3f5ea;
            --neg-bg: #fde9e9;
            --open: #1fae5b;
            --closed: #d64545;
            --unk: #e0a800
        }

        @media(prefers-color-scheme:dark) {
            :root {
                --bg: #0e1118;
                --card: #171c27;
                --line: #262d3c;
                --ink: #e9edf5;
                --sub: #8f9bb0;
                --accent: #6f96ff;
                --pos: #3ecf82;
                --neg: #ff6b6b;
                --pos-bg: #12301f;
                --neg-bg: #3a1a1a
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            min-height: 100%
        }

        body {
            font-family: Inter, -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: var(--ink);
            padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            overflow-x: hidden
        }

        .app {
            max-width: 480px;
            margin: 0 auto
        }

        button {
            font: inherit;
            color: inherit;
            border: 0;
            background: none;
            cursor: pointer
        }

        .pos {
            color: var(--pos)
        }

        .neg {
            color: var(--neg)
        }

        .num {
            font-variant-numeric: tabular-nums
        }

        /* header */
        header {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
            background: var(--bg);
            border-bottom: 1px solid var(--line)
        }

        header h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -.02em
        }

        #status {
            font-size: .7rem;
            color: var(--sub);
            margin-top: 2px
        }

        #status.err {
            color: var(--neg)
        }

        #refresh {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: .82rem
        }

        #refresh:disabled {
            opacity: .7
        }

        #refresh svg {
            width: 16px;
            height: 16px
        }

        #refresh.loading svg {
            animation: spin .9s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        /* summary */
        .summary {
            margin: 14px 16px 0;
            padding: 18px 16px 16px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px
        }

        .mp-label {
            font-size: .75rem;
            color: var(--sub);
            font-weight: 600
        }

        .mp-value {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -.03em;
            line-height: 1.15;
            margin-top: 2px
        }

        .mp-pct {
            display: inline-block;
            margin-top: 6px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: .8rem;
            font-weight: 700
        }

        .mp-pct.pos {
            background: var(--pos-bg)
        }

        .mp-pct.neg {
            background: var(--neg-bg)
        }

        .pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            margin-top: 16px;
            border-top: 1px solid var(--line)
        }

        .pair div {
            padding-top: 12px
        }

        .pair div+div {
            padding-left: 16px;
            border-left: 1px solid var(--line)
        }

        .pair span {
            display: block;
            font-size: .72rem;
            color: var(--sub);
            font-weight: 600
        }

        .pair b {
            display: block;
            margin-top: 2px;
            font-size: 1.05rem;
            font-weight: 700
        }

        .note {
            margin-top: 10px;
            font-size: .7rem;
            color: var(--sub)
        }

        /* toolbar */
        .tools {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 16px 16px 8px
        }

        .tools h2 {
            font-size: .9rem;
            font-weight: 700
        }

        .tools h2 small {
            color: var(--sub);
            font-weight: 500
        }

        .tools select {
            padding: 7px 10px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card);
            color: var(--ink);
            font: 600 .76rem Inter, sans-serif
        }

        .chk {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: .76rem;
            font-weight: 600;
            color: var(--sub)
        }

        .chk input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent)
        }

        /* list */
        ul {
            list-style: none;
            margin: 0 16px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            overflow: hidden
        }

        li+li {
            border-top: 1px solid var(--line)
        }

        .row-main {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            padding: 13px 14px;
            text-align: left
        }

        .row-main:active {
            background: var(--bg)
        }

        .l {
            min-width: 0;
            flex: 1
        }

        .l b {
            font-size: .92rem;
            font-weight: 700
        }

        .l small {
            display: block;
            margin-top: 2px;
            font-size: .72rem;
            color: var(--sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 7px;
            vertical-align: middle
        }

        .dot.o {
            background: var(--open)
        }

        .dot.c {
            background: var(--closed)
        }

        .dot.u {
            background: var(--unk)
        }

        .r {
            text-align: right;
            flex-shrink: 0
        }

        .r b {
            display: block;
            font-size: .92rem;
            font-weight: 700
        }

        .r em {
            display: block;
            margin-top: 2px;
            font-style: normal;
            font-size: .74rem;
            font-weight: 600
        }

        .detail {
            padding: 2px 14px 14px;
            background: var(--bg)
        }

        .detail dl {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 14px;
            padding-top: 12px
        }

        .detail dt {
            font-size: .68rem;
            color: var(--sub);
            font-weight: 600
        }

        .detail dd {
            font-size: .85rem;
            font-weight: 700;
            margin-top: 1px
        }

        .acts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px
        }

        .acts button {
            padding: 10px;
            border-radius: 12px;
            border: 1.5px solid var(--accent);
            color: var(--accent);
            font-weight: 700;
            font-size: .8rem
        }

        .acts button:first-child {
            background: var(--accent);
            color: #fff
        }

        .empty {
            padding: 36px 20px;
            text-align: center;
            color: var(--sub);
            font-size: .85rem
        }

        .chev {
            display: inline-block;
            margin-left: 6px;
            color: var(--sub);
            font-size: .7rem;
            transition: transform .15s
        }

        li.open .chev {
            transform: rotate(180deg)
        }

        /* portrait lock */
        #lock {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #0f172a;
            color: #f8fafc;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
            gap: 8px
        }

        #lock h2 {
            font-size: 1.15rem
        }

        #lock p {
            font-size: .85rem;
            color: #94a3b8;
            max-width: 300px
        }

        @media(orientation:landscape) and (max-width:950px) {
            #lock {
                display: flex
            }
        }
    </style>
</head>

<body>
    <div id="lock">
        <h2>Ruota il telefono</h2>
        <p>La dashboard è pensata per la visualizzazione verticale.</p>
    </div>

    <div class="app">
        <header>
            <div>
                <h1>Portafoglio</h1>
                <div id="status">Caricamento…</div>
            </div>
            <button id="refresh" onclick="runUpdateOnline()" aria-label="Aggiorna i dati">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                    <path d="M21 3v6h-6" />
                </svg>
                <span id="refreshTxt">Aggiorna</span>
            </button>
        </header>

        <section class="summary">
            <div class="mp-label">Minus/plus</div>
            <div class="mp-value num" id="sumMp">–</div>
            <span class="mp-pct" id="sumPct" hidden></span>
            <div class="pair">
                <div><span>Costo</span><b class="num" id="sumCost">–</b></div>
                <div><span>Valore di mercato</span><b class="num" id="sumCtv">–</b></div>
            </div>
            <div class="note" id="sumNote" hidden></div>
        </section>

        <div class="tools">
            <h2>Strumenti <small id="count"></small></h2>
            <label class="chk"><input type="checkbox" id="openOnly"> Solo aperti</label>
        </div>
        <div class="tools" style="margin-top:0">
            <span class="chk">Ordina per</span>
            <select id="sortBy">
                <option value="ctv">Valore di mercato</option>
                <option value="mp">Minus/plus</option>
                <option value="mppct">Minus/plus %</option>
                <option value="name">Nome</option>
            </select>
        </div>

        <ul id="list">
            <li class="empty">Caricamento portafoglio…</li>
        </ul>
    </div>

    <script>
        const API_URL = 'https://feweb-tunnel.fe-web.eu';
        const ls = k => { try { return localStorage.getItem(k) } catch (e) { return null } };
        const qs = new URLSearchParams(location.search);
        const cred = {
            username: qs.get('username') || ls('username') || '',
            token: qs.get('token') || ls('token') || '',
            language: qs.get('language') || ls('language') || 'it_IT',
            currency: ls('currency') || 'EUR'
        };

        let portfolio = [], translations = {}, lastJson = '', ws = null, wsTimer = null;
        const openIds = new Set();

        /* ── utils ── */
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const tr = k => translations[k] || null;
        const isNum = v => typeof v === 'number' && isFinite(v);
        const fmt = (v, d = 2) => isNum(v) ? v.toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d }) : '–';
        const sgn = v => (v > 0 ? '+' : '') + fmt(v);
        const sgnPct = v => isNum(v) ? (v > 0 ? '+' : '') + fmt(v) + '%' : '';
        const cls = v => v >= 0 ? 'pos' : 'neg';

        function setStatus(t, err) { const s = $('status'); s.textContent = t; s.classList.toggle('err', !!err); }

        function parseVal(v) {
            if (typeof v === 'string' && v.trim() !== '') {
                const n = parseFloat(v.replace(',', '.'));
                if (!isNaN(n) && String(n) === v.trim()) return n;
            }
            return v;
        }

        /* Stessa logica di dashboard-market.html: CTV = qta * prezzo / divisore / cambio; M/P = CTV - costo */
        function normalize(raw) {
            const it = {};
            Object.keys(raw).forEach(k => it[k] = parseVal(raw[k]));
            const qty = parseFloat(it.quantity ?? it['Quantità'] ?? it.qta);
            const price = parseFloat(it.$price_mkt);
            const div = parseFloat(it.price_divisor ?? 1) || 1;
            const exch = parseFloat(it.$exchange_mkt ?? 1) || 1;
            const cost = parseFloat(it.$amount_cost ?? it.$cost_amount_curr);
            if (isNaN(qty) || isNaN(price)) { it.CTVMKTTQ = isNum(it.CTVMKTTQ) ? it.CTVMKTTQ : null; }
            else it.CTVMKTTQ = Math.round((qty * price / div) / exch * 100) / 100;
            if (isNum(it.CTVMKTTQ) && !isNaN(cost)) {
                it['M/P'] = Math.round((it.CTVMKTTQ - cost) * 100) / 100;
                it['M/P%'] = cost !== 0 ? Math.round(it['M/P'] / cost * 10000) / 100 : null;
            } else { it['M/P'] = null; it['M/P%'] = null; }
            it._qty = qty; it._cost = isNaN(cost) ? null : cost;
            return it;
        }

        function loadRows(rawPortfolio) {
            let list = [];
            if (Array.isArray(rawPortfolio)) {
                rawPortfolio.forEach(x => {
                    if (x && x.id_instrument) list.push(normalize(x));
                    else if (Array.isArray(x) && x.length === 2) list.push(normalize(Object.assign({ id_instrument: x[0] }, x[1])));
                });
            } else if (rawPortfolio && typeof rawPortfolio === 'object') {
                Object.keys(rawPortfolio).forEach(k => list.push(normalize(Object.assign({ id_instrument: k }, rawPortfolio[k]))));
            }
            portfolio = list;
        }

        const marketState = it => {
            const f = it.market && typeof it.market === 'object' ? it.market.fase : null;
            return f === 'int.open' ? 'o' : f === 'int.closed' ? 'c' : 'u';
        };
        const marketLabel = it => tr('dom.code_market:' + it.code_market) || it.code_market || '–';
        const hours = it => {
            const m = it.market; if (!m || !m.start || !m.end) return '–';
            const a = new Date(m.start), b = new Date(m.end); if (isNaN(a) || isNaN(b)) return '–';
            const p = n => String(n).padStart(2, '0');
            return `${p(a.getHours())}:${p(a.getMinutes())} – ${p(b.getHours())}:${p(b.getMinutes())}`;
        };

        /* ── render ── */
        function render() {
            let rows = portfolio.filter(i => isNum(i._qty) && Math.abs(i._qty) > 1e-6);
            if ($('openOnly').checked) rows = rows.filter(i => !i.market || marketState(i) !== 'c');

            const priced = rows.filter(i => isNum(i.CTVMKTTQ) && isNum(i._cost));
            const cost = priced.reduce((s, i) => s + i._cost, 0);
            const ctv = priced.reduce((s, i) => s + i.CTVMKTTQ, 0);
            const mp = ctv - cost;
            const pct = cost !== 0 ? mp / cost * 100 : null;
            const cur = cred.currency === 'EUR' ? '€' : cred.currency;

            $('sumCost').textContent = `${cur} ${fmt(cost)}`;
            $('sumCtv').textContent = `${cur} ${fmt(ctv)}`;
            const mpEl = $('sumMp'); mpEl.textContent = `${cur} ${sgn(mp)}`; mpEl.className = 'mp-value num ' + cls(mp);
            const pEl = $('sumPct'); pEl.hidden = pct === null; if (pct !== null) { pEl.textContent = sgnPct(pct); pEl.className = 'mp-pct ' + cls(pct); }
            const missing = rows.length - priced.length;
            const note = $('sumNote'); note.hidden = !missing;
            if (missing) note.textContent = `${missing} ${missing === 1 ? 'strumento senza prezzo escluso' : 'strumenti senza prezzo esclusi'} dai totali.`;
            $('count').textContent = `(${rows.length})`;

            const key = $('sortBy').value;
            rows.sort((a, b) => key === 'name' ? String(a.id_instrument).localeCompare(String(b.id_instrument))
                : (b[{ ctv: 'CTVMKTTQ', mp: 'M/P', mppct: 'M/P%' }[key]] ?? -Infinity) - (a[{ ctv: 'CTVMKTTQ', mp: 'M/P', mppct: 'M/P%' }[key]] ?? -Infinity));

            if (!rows.length) { $('list').innerHTML = '<li class="empty">Nessun titolo con quantità in portafoglio.</li>'; return; }

            $('list').innerHTML = rows.map(it => {
                const id = it.id_instrument, open = openIds.has(id), m = it['M/P'], p = it['M/P%'];
                const pctTxt = isNum(p) && Math.abs(p) <= 5000 ? ' · ' + sgnPct(p) : '';
                return `<li class="${open ? 'open' : ''}" data-id="${esc(id)}">
      <button class="row-main" data-toggle>
        <span class="l"><b>${esc(id)}</b><i class="dot ${marketState(it)}"></i><span class="chev">▾</span><small>${esc(it.instrument_description || '')}</small></span>
        <span class="r"><b class="num">${fmt(it.CTVMKTTQ)}</b><em class="num ${isNum(m) ? cls(m) : ''}">${isNum(m) ? sgn(m) + pctTxt : '–'}</em></span>
      </button>
      <div class="detail" ${open ? '' : 'hidden'}>
        <dl>
          <div><dt>Quantità</dt><dd class="num">${fmt(it._qty)}</dd></div>
          <div><dt>Valuta</dt><dd>${esc(it.id_currency || '–')}</dd></div>
          <div><dt>Prezzo di costo</dt><dd class="num">${fmt(it.$price_cost, 3)}</dd></div>
          <div><dt>Prezzo di mercato</dt><dd class="num">${fmt(it.$price_mkt, 3)}</dd></div>
          <div><dt>Costo</dt><dd class="num">${fmt(it._cost)}</dd></div>
          <div><dt>Valore di mercato</dt><dd class="num">${fmt(it.CTVMKTTQ)}</dd></div>
          <div><dt>Mercato</dt><dd>${esc(marketLabel(it))}</dd></div>
          <div><dt>Orari</dt><dd class="num">${hours(it)}</dd></div>
        </dl>
        <div class="acts">
          <button data-graph>Grafico prezzi</button>
          <button data-detail>Scheda strumento</button>
        </div>
      </div>
    </li>`;
            }).join('');
        }

        $('list').addEventListener('click', e => {
            const li = e.target.closest('li[data-id]'); if (!li) return;
            const id = li.dataset.id;
            if (e.target.closest('[data-graph]')) return openPriceGraph(id);
            if (e.target.closest('[data-detail]')) return openInstrumentDetails(id);
            if (e.target.closest('[data-toggle]')) {
                const open = !openIds.has(id);
                open ? openIds.add(id) : openIds.delete(id);
                li.classList.toggle('open', open);
                li.querySelector('.detail').hidden = !open;
            }
        });
        $('openOnly').addEventListener('change', render);
        $('sortBy').addEventListener('change', render);

        /* ── navigazione al dettaglio ── */
        function openPriceGraph(id) {
            const p = new URLSearchParams({ id_instrument: id, username: cred.username, token: cred.token, instrument_currency: cred.currency });
            window.open('dashboard-graph-prices.html?' + p, '_blank');
        }
        function openInstrumentDetails(id) {
            const p = new URLSearchParams({ id_instrument: id, username: cred.username, token: cred.token, language: cred.language, currency: cred.currency });
            window.open('dashboard-detail-instrument.html?' + p, '_blank');
        }

        /* ── caricamento dati (/getportfolioonline) ── */
        async function loadPortfolio() {
            try {
                const r = await fetch(`${API_URL}/getportfolioonline`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: cred.username, token: cred.token, language: cred.language, code: '', filter: '' })
                });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const data = await r.json();
                if (data.status !== 'ok') throw new Error(data.msg || 'Errore server');
                lastJson = JSON.stringify(data.portfolio);
                loadRows(data.portfolio); render();
                setStatus('Aggiornato alle ' + new Date().toTimeString().slice(0, 5));
                return true;
            } catch (err) {
                setStatus('Dati non disponibili: ' + err.message, true);
                if (!portfolio.length) $('list').innerHTML = '<li class="empty">Impossibile caricare il portafoglio. Premi Aggiorna per riprovare.</li>';
                return false;
            }
        }

        /* ── aggiornamento online: /getfilter → /putfilter → WebSocket ── */
        async function post(path, body) {
            const r = await fetch(API_URL + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            if (!r.ok) throw new Error(`${path} HTTP ${r.status}`);
            const j = await r.json();
            if (j.status !== 'ok') throw new Error(j.msg || j.error || `${path} non riuscito`);
            return j;
        }

        function setBusy(busy) {
            const b = $('refresh'); b.disabled = busy; b.classList.toggle('loading', busy);
            $('refreshTxt').textContent = busy ? 'In corso…' : 'Aggiorna';
        }

        async function runUpdateOnline() {
            if (!cred.username) return setStatus('Username mancante', true);
            setBusy(true); setStatus('Richiesta aggiornamento…');
            try {
                const f = await post('/getfilter', { username: cred.username, token: cred.token, language: cred.language, filter: '' });
                await post('/putfilter', { username: cred.username, token: cred.token, language: cred.language, currency: cred.currency, filter: JSON.stringify(f.filter) });
            } catch (err) { setBusy(false); return setStatus('Aggiornamento non riuscito: ' + err.message, true); }

            if (ws && ws.readyState === WebSocket.OPEN) ws.close();
            clearTimeout(wsTimer);
            const proto = location.protocol === 'http:' ? 'ws:' : 'wss:';
            ws = new WebSocket(`${proto}//feweb-tunnel.fe-web.eu/ws/updateportfolioonline/${encodeURIComponent(cred.username)}/${cred.currency}`);
            setStatus('Ricezione prezzi…');
            wsTimer = setTimeout(() => { if (ws) ws.close(); }, 90000);

            ws.onmessage = ev => {
                try {
                    const d = JSON.parse(ev.data);
                    if (d.status === 'ok') {
                        const j = JSON.stringify(d.portfolio);
                        if (j !== lastJson) { lastJson = j; loadRows(d.portfolio); render(); }
                        setStatus('Aggiornato alle ' + new Date().toTimeString().slice(0, 5));
                    } else if (d.error) ws.close(1008, d.error);
                } catch (e) { /* messaggio non valido: ignora */ }
            };
            ws.onerror = () => { clearTimeout(wsTimer); setBusy(false); setStatus('Errore di connessione', true); };
            ws.onclose = ev => {
                clearTimeout(wsTimer); setBusy(false);
                if (ev.code === 1000 || ev.code === 1005) setStatus('Aggiornato alle ' + new Date().toTimeString().slice(0, 5));
                else setStatus(ev.reason || 'Connessione interrotta', true);
            };
        }

        /* ── init ── */
        async function init() {
            if (!cred.username || !cred.token) { location.href = 'index.html'; return; }
            try { const s = screen.orientation; if (s && s.lock) s.lock('portrait').catch(() => { }); } catch (e) { }
            const p = loadPortfolio();
            try { const r = await fetch(`lang/${cred.language}.json`); if (r.ok) translations = await r.json(); } catch (e) { }
            await p; if (portfolio.length) render();
        }
        window.addEventListener('load', init);
    </script>
</body>

</html>
