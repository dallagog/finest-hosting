        const invariancePointsPlugin = {
            id: 'invariancePoints',
            afterDatasetsDraw(chart) {
                if (!document.getElementById('layer-invariance-delta')?.checked) return;

                const { ctx, chartArea } = chart;
                ctx.save();

                const dataset = chart.data.datasets[0];
                if (!dataset || !dataset.invValues) {
                    ctx.restore();
                    return;
                }

                const meta = chart.getDatasetMeta(0);
                if (!meta || meta.hidden) {
                    ctx.restore();
                    return;
                }

                const invValues = dataset.invValues;

                meta.data.forEach((point, index) => {
                    const invObj = invValues[index];
                    if (!invObj) return;

                    const deltaRaw = invObj['invariance@delta'];
                    if (deltaRaw !== undefined && deltaRaw !== null) {
                        const delta = parseValue(deltaRaw);
                        const { x } = point;
                        const y = chartArea.bottom - 10;
                        const color = delta >= 0 ? 'blue' : 'red';

                        ctx.beginPath();
                        ctx.moveTo(x - 5, y);
                        ctx.lineTo(x + 5, y);
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        // Tratto verticale dello stesso colore: intensità = |delta| in milioni (nnnM).
                        // Ogni 50M si aggiunge un tratto (STEP px) all'altezza.
                        const mVal = Math.abs(Number(delta)) * 1e6;
                        if (isFinite(mVal) && mVal > 0) {
                            const STEP = 6;
                            const steps = Math.ceil(mVal / 50);
                            const maxH = (chartArea.bottom - chartArea.top) * 0.9;
                            const h = Math.min(steps * STEP, maxH);
                            ctx.save();
                            ctx.globalAlpha = 0.6;
                            ctx.beginPath();
                            ctx.moveTo(x, y - 3);
                            ctx.lineTo(x, y - 3 - h);
                            ctx.strokeStyle = color;
                            ctx.lineWidth = 4;
                            ctx.lineCap = 'butt';
                            ctx.stroke();
                            ctx.restore();
                        }
                    }
                });
                ctx.restore();
            }
        };

        async function loadPrices() {
            console.log('===== loadPrices START =====');
            document.getElementById('loading').style.display = 'flex';
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;

            try {
                const response = await fetch(`${API_URL}/getprices`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        token,
                        language,
                        currency: targetCurrency,
                        instrument: {
                            id_instrument: idInstrument,
                            id_account: idAccount,
                            date_start: startDate,
                            date_end: endDate
                        }
                    })
                });

                const jsonResponse = await response.json();

                if (jsonResponse.data && Array.isArray(jsonResponse.data)) {
                    trendDataRaw = jsonResponse.data;
                } else if (jsonResponse.prices && Array.isArray(jsonResponse.prices)) {
                    trendDataRaw = jsonResponse.prices;
                } else if (Array.isArray(jsonResponse)) {
                    trendDataRaw = jsonResponse;
                } else {
                    trendDataRaw = [];
                }

                if (jsonResponse.event) {
                    eventDataRaw = jsonResponse.event;
                } else {
                    eventDataRaw = {};
                }

                if (jsonResponse.event_instrument && typeof jsonResponse.event_instrument === 'object') {
                    eventInstrumentRaw = jsonResponse.event_instrument;
                } else {
                    eventInstrumentRaw = {};
                }

                if (jsonResponse.volume && typeof jsonResponse.volume === 'object') {
                    volumeDataRaw = jsonResponse.volume;
                } else {
                    volumeDataRaw = {};
                }

                trendDataRaw.sort((a, b) => new Date(a.date_start || a.date) - new Date(b.date_start || b.date));

                extractFieldsFromData();
                if (jsonResponse.filter) {
                    filterData = jsonResponse.filter;
                    console.log('Filter data received:', filterData);
                }
                renderChart();
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Error loading prices:', error);
                document.getElementById('loadingText').textContent = "Error loading data from server";
                document.getElementById('loading').style.display = 'none';
            }
        }

        function parseValue(v) {
            if (v === null || v === undefined) return 0;
            if (typeof v === 'number') return v;
            if (typeof v === 'string') return parseFloat(v.replace(/[^0-9.-]/g, '')) || 0;
            return 0;
        }

        function formatVolume(v) {
            if (v === null || v === undefined || v === 0) return '';
            const n = parseFloat(v);
            if (Math.abs(n) >= 1e12) return (n / 1e12).toFixed(2) + 'T';
            if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2) + 'B';
            if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + 'M';
            return n.toLocaleString();
        }

        function renderChart() {
            const canvas = document.getElementById('chartCanvas');
            const ctx = canvas.getContext('2d');

            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }

            if (!trendDataRaw || trendDataRaw.length === 0) return;

            const code = idInstrument || instrumentNameFromUrl || '';
            const isin = (filterData && filterData.code_isin) || '';
            const desc = (filterData && filterData.instrument_description) || (instrumentNameFromUrl || '');
            const curr = (filterData && filterData.currency) || instrumentCurrency || '';

            const chipCode = document.getElementById('chip-code');
            const chipIsin = document.getElementById('chip-isin');
            const chipCurr = document.getElementById('chip-currency');
            const instDesc = document.getElementById('inst-desc');

            if (code) { chipCode.textContent = code; chipCode.style.display = 'inline-flex'; } else { chipCode.style.display = 'none'; }
            if (isin) { chipIsin.textContent = isin; chipIsin.style.display = 'inline-flex'; } else { chipIsin.style.display = 'none'; }
            if (curr) { chipCurr.textContent = curr; chipCurr.style.display = 'inline-flex'; } else { chipCurr.style.display = 'none'; }

            if (desc && desc !== code) {
                instDesc.textContent = desc;
                instDesc.style.display = 'inline-block';
            } else {
                instDesc.textContent = '';
                instDesc.style.display = 'none';
            }

            // Calcolo prossimo evento futuro
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            let nextEventDate = null;
            let nextEventItems = [];

            Object.keys(eventInstrumentRaw).forEach(dateStr => {
                const d = new Date(dateStr);
                if (!isNaN(d) && d >= today) {
                    if (!nextEventDate || d < new Date(nextEventDate)) {
                        nextEventDate = dateStr;
                        nextEventItems = eventInstrumentRaw[dateStr];
                    }
                }
            });

            const nextEventEl = document.getElementById('inst-next-event');
            if (nextEventEl) {
                if (nextEventDate && nextEventItems.length > 0) {
                    const parts = nextEventDate.split('-');
                    const formattedDate = parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : nextEventDate;

                    // MODIFICA 2: Usa 'value' invece di 'type_news'
                    let eventStr = formattedDate;
                    const eventDesc = nextEventItems[0].value || nextEventItems[0].type_news || '';
                    if (eventDesc) {
                        eventStr += `: ${eventDesc}`;
                    }
                    nextEventEl.textContent = `📅 ${eventStr}`;
                    nextEventEl.style.display = 'inline-block';
                } else {
                    nextEventEl.style.display = 'none';
                }
            }

            const firstRow = trendDataRaw[0];
            const priceField = Object.keys(firstRow).find(k => k.startsWith('price@')) || 'price_mkt';
            const priceCurrencyField = `price_mkt@${targetCurrency}`;
            const hasPriceCurrency = trendDataRaw.some(item => item[priceCurrencyField] !== undefined);
            const patternFieldSet = new Set();
            trendDataRaw.forEach(item => Object.keys(item).filter(k => k.startsWith('pattern@')).forEach(k => patternFieldSet.add(k)));
            const patternFieldList = Array.from(patternFieldSet);

            const labels = [];
            const prices = [];
            const priceCurrencies = [];
            const forces = [];
            const patternValues = [];
            const shorts = [];
            const exchanges = [];
            let dualExchangeLabel = "";

            const filterStartDate = document.getElementById('start-date').value;
            const filterEndDate = document.getElementById('end-date').value;
            const filterStart = filterStartDate ? new Date(filterStartDate) : null;
            const filterEnd = filterEndDate ? new Date(filterEndDate) : null;

            const filteredData = trendDataRaw.filter(item => {
                const dateStr = item.date_start || item.date;
                if (!dateStr) return true;
                const d = new Date(dateStr);
                if (filterStart && d < filterStart) return false;
                if (filterEnd && d > filterEnd) return false;
                return true;
            });

            const aggregatedData = {};
            filteredData.forEach(item => {
                const date = item.date_start || item.date;
                if (!aggregatedData[date]) {
                    aggregatedData[date] = {
                        date,
                        prices: [],
                        priceCurrencies: [],
                        forces: {},
                        patterns: [],
                        rsi: {},
                        inv: {},
                        shorts: [],
                        exchanges: []
                    };
                }

                if (item[priceField] !== undefined) {
                    const priceParsed = parseValue(item[priceField]);
                    if (priceParsed !== 0) aggregatedData[date].prices.push(priceParsed);
                }
                if (hasPriceCurrency && item[priceCurrencyField] !== undefined) {
                    const pcParsed = parseValue(item[priceCurrencyField]);
                    if (pcParsed !== 0) aggregatedData[date].priceCurrencies.push(pcParsed);
                }

                forceFields.forEach(field => {
                    if (item[field] !== undefined && item[field] !== null) {
                        aggregatedData[date].forces[field] = parseValue(item[field]);
                    }
                });

                rsiFieldOptions.forEach(field => {
                    if (item[field] !== undefined && item[field] !== null) {
                        aggregatedData[date].rsi[field] = parseValue(item[field]);
                    }
                });

                invFieldOptions.forEach(field => {
                    if (item[field] !== undefined && item[field] !== null) {
                        aggregatedData[date].inv[field] = item[field];
                    }
                });

                patternFieldList.forEach(field => {
                    if (item[field] !== undefined && item[field] !== null && item[field] !== '') {
                        const patternName = field.replace('pattern@', '');
                        aggregatedData[date].patterns.push({ [patternName]: item[field] });
                    }
                });

                if (item.short !== undefined) {
                    aggregatedData[date].shorts.push(parseValue(item.short));
                }

                if (item.exchange !== undefined) {
                    aggregatedData[date].exchanges.push(parseValue(item.exchange));
                    if (item.dual_exchange) dualExchangeLabel = item.dual_exchange;
                }
            });

            const ensureDateEntry = (date) => {
                if (!aggregatedData[date]) {
                    aggregatedData[date] = {
                        date,
                        prices: [],
                        priceCurrencies: [],
                        forces: {},
                        patterns: [],
                        rsi: {},
                        inv: {},
                        shorts: [],
                        exchanges: []
                    };
                }
            };

            Object.keys(eventDataRaw).forEach(date => {
                const d = new Date(date);
                if ((!filterStart || d >= filterStart) && (!filterEnd || d <= filterEnd)) {
                    ensureDateEntry(date);
                }
            });

            Object.keys(eventInstrumentRaw).forEach(date => {
                const d = new Date(date);
                if (isNaN(d)) return;
                if (!filterStart || d >= filterStart) {
                    ensureDateEntry(date);
                }
            });

            const rsiValuesArr = [];

            const sortedDates = Object.keys(aggregatedData).sort((a, b) => new Date(a) - new Date(b));

            sortedDates.forEach(date => {
                const data = aggregatedData[date];
                const avgPrice = data.prices.length ? data.prices.reduce((a, b) => a + b, 0) / data.prices.length : null;
                const avgPriceCurrency = data.priceCurrencies.length ? data.priceCurrencies.reduce((a, b) => a + b, 0) / data.priceCurrencies.length : null;
                labels.push(date);
                prices.push(avgPrice);
                priceCurrencies.push(avgPriceCurrency);
                forces.push(Object.keys(data.forces).length > 0 ? data.forces : null);
                patternValues.push(data.patterns.length > 0 ? data.patterns : []);
                shorts.push(data.shorts.length ? data.shorts.reduce((a, b) => a + b, 0) / data.shorts.length : null);
                exchanges.push(data.exchanges.length ? data.exchanges.reduce((a, b) => a + b, 0) / data.exchanges.length : null);

                rsiValuesArr.push(data.rsi && Object.keys(data.rsi).length > 0 ? data.rsi : null);
            });

            const invValuesArr = [];
            sortedDates.forEach(date => {
                const data = aggregatedData[date];
                invValuesArr.push(data.inv && Object.keys(data.inv).length > 0 ? data.inv : null);
            });

            const volumeValues = sortedDates.map(date => {
                const v = volumeDataRaw[date];
                return (v !== undefined && v !== null) ? parseFloat(v) : null;
            });
            const hasVolume = volumeValues.some(v => v !== null && v > 0);
            const hasExchange = exchanges.some(v => v !== null && v !== undefined && v !== 0 && !isNaN(v));

            const layerVolumeItem = document.getElementById('layer-volume-item');
            if (layerVolumeItem) layerVolumeItem.style.display = hasVolume ? '' : 'none';

            const activeBtn = document.querySelector('.time-filter-btn.active');
            const activePeriod = activeBtn ? (activeBtn.getAttribute('data-period') || 'M12') : 'M12';

            const buildPeriodTooltip = (periodId) => {
                const tooltip = document.getElementById(`tooltip-${periodId}`);
                if (!tooltip) return;

                while (tooltip.children.length > 1) tooltip.removeChild(tooltip.lastChild);

                const addTooltipRow = (label, value, cls = '') => {
                    const row = document.createElement('div');
                    row.className = 'period-tooltip-row';

                    const isMax = label.includes('Max');
                    const maxClass = isMax ? 'tooltip-max-bold' : '';
                    const colorClass = cls ? ` ${cls}` : '';

                    row.innerHTML = `<span class="lbl">${label}</span><span class="val ${maxClass}${colorClass}">${value}</span>`;
                    tooltip.appendChild(row);
                };

                const validPrices = prices.filter(p => p !== null && p !== undefined);
                if (validPrices.length >= 2) {
                    const firstP = validPrices[0];
                    const lastP = validPrices[validPrices.length - 1];
                    const yieldP = ((lastP - firstP) / firstP) * 100;
                    const sign = yieldP >= 0 ? '+' : '';
                    const cls = yieldP >= 0 ? 'yield-positive' : 'yield-negative';
                    const minPrice = Math.min(...validPrices);
                    const maxPrice = Math.max(...validPrices);

                    const priceLabel = getTranslation('int.prices') || 'Prezzo';
                    addTooltipRow(priceLabel, `${sign}${yieldP.toFixed(2)}%`, cls);
                    addTooltipRow(getTranslation('int.price.min') || 'Min', minPrice.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 4 }));
                    addTooltipRow(getTranslation('int.price.max') || 'Max', maxPrice.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 4 }));
                }

                const validExchanges = exchanges.filter(e => e !== null && e !== undefined && e !== 0);
                if (validExchanges.length >= 2) {
                    const firstE = validExchanges[0];
                    const lastE = validExchanges[validExchanges.length - 1];
                    const yieldE = ((1 / lastE - 1 / firstE) / (1 / firstE)) * 100;
                    const sign = yieldE >= 0 ? '+' : '';
                    const cls = yieldE >= 0 ? 'yield-positive' : 'yield-negative';
                    const minEx = Math.min(...validExchanges);
                    const maxEx = Math.max(...validExchanges);

                    const sep = document.createElement('div');
                    sep.style.cssText = 'border-top:1px solid #eee;margin:5px 0';
                    tooltip.appendChild(sep);

                    addTooltipRow(getTranslation('int.exchange') || 'Cambio', `${sign}${yieldE.toFixed(2)}%`, cls);
                    addTooltipRow(getTranslation('int.exchange.min') || 'Min', minEx.toFixed(4));
                    addTooltipRow(getTranslation('int.exchange.max') || 'Max', maxEx.toFixed(4));
                }
            };

            const buildHeaderVariations = () => {
                const priceBox = document.getElementById('hdr-var-price');
                const exBox = document.getElementById('hdr-var-exchange');
                if (!priceBox || !exBox) return;

                priceBox.innerHTML = '';
                exBox.innerHTML = '';

                const addTitle = (box, text) => {
                    const t = document.createElement('span');
                    t.className = 'hdr-var-title';
                    t.textContent = text;
                    box.appendChild(t);

                    const items = document.createElement('div');
                    items.className = 'hdr-var-items hdr-var-items-row';
                    box.appendChild(items);
                    return items;
                };

                const createVarItem = (label, value, cls = '') => {
                    const item = document.createElement('span');
                    item.className = 'hdr-var-item hdr-var-item-main';
                    const colorClass = cls ? ` ${cls}` : '';
                    item.innerHTML = `<span class="lbl">${label}</span><span class="val${colorClass}">${value}</span>`;
                    return item;
                };

                const createSubItem = (label, value) => {
                    const item = document.createElement('span');
                    item.className = 'hdr-var-item';
                    item.innerHTML = `<span class="lbl">${label}</span><span class="val">${value}</span>`;
                    return item;
                };

                // Cambio
                const validExchanges = exchanges.filter(e => e !== null && e !== undefined && e !== 0);
                if (validExchanges.length >= 2) {
                    const firstE = validExchanges[0];
                    const lastE = validExchanges[validExchanges.length - 1];
                    const yieldE = ((1 / lastE - 1 / firstE) / (1 / firstE)) * 100;
                    const sign = yieldE >= 0 ? '+' : '';
                    const cls = yieldE >= 0 ? 'yield-positive' : 'yield-negative';
                    const minEx = Math.min(...validExchanges);
                    const maxEx = Math.max(...validExchanges);

                    const exItems = addTitle(exBox, getTranslation('int.exchange') || 'Cambio');

                    const leftCol = document.createElement('div');
                    leftCol.className = 'hdr-var-left-col';
                    leftCol.appendChild(createVarItem('Var', `${sign}${yieldE.toFixed(2)}%`, cls));

                    const rightCol = document.createElement('div');
                    rightCol.className = 'hdr-var-right-col';
                    rightCol.appendChild(createSubItem(getTranslation('int.exchange.min') || 'Min', minEx.toFixed(4)));
                    rightCol.appendChild(createSubItem(getTranslation('int.exchange.max') || 'Max', maxEx.toFixed(4)));

                    exItems.appendChild(leftCol);
                    exItems.appendChild(rightCol);
                }

                // Prezzo
                const validPrices = prices.filter(p => p !== null && p !== undefined);
                if (validPrices.length >= 2) {
                    const firstP = validPrices[0];
                    const lastP = validPrices[validPrices.length - 1];
                    const yieldP = ((lastP - firstP) / firstP) * 100;
                    const sign = yieldP >= 0 ? '+' : '';
                    const cls = yieldP >= 0 ? 'yield-positive' : 'yield-negative';
                    const minPrice = Math.min(...validPrices);
                    const maxPrice = Math.max(...validPrices);

                    const priceItems = addTitle(priceBox, getTranslation('int.prices') || 'Prezzo');

                    const leftCol = document.createElement('div');
                    leftCol.className = 'hdr-var-left-col';
                    leftCol.appendChild(createVarItem('Var', `${sign}${yieldP.toFixed(2)}%`, cls));

                    const rightCol = document.createElement('div');
                    rightCol.className = 'hdr-var-right-col';
                    rightCol.appendChild(createSubItem(getTranslation('int.price.min') || 'Min', minPrice.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 4 })));
                    rightCol.appendChild(createSubItem(getTranslation('int.price.max') || 'Max', maxPrice.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 4 })));

                    priceItems.appendChild(leftCol);
                    priceItems.appendChild(rightCol);
                }
            };

            buildPeriodTooltip(activePeriod);
            buildHeaderVariations();

            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(75, 192, 192, 0.4)');
            gradient.addColorStop(1, 'rgba(75, 192, 192, 0.05)');

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: document.getElementById('page-title-input').value || 'Prezzi',
                            data: prices,
                            forceValues: forces,
                            rsiValues: rsiValuesArr,
                            invValues: invValuesArr,
                            patternValues: patternValues,
                            borderColor: 'rgba(75, 192, 192, 1)',
                            backgroundColor: gradient,
                            borderWidth: 2,
                            tension: 0.1,
                            fill: true,
                            pointBackgroundColor: (context) => {
                                const index = context.dataIndex;
                                const patterns = patternValues[index];
                                if (patterns && patterns.length > 0) {
                                    const hasSelectedPattern = patterns.some(p =>
                                        Object.keys(p).some(key => selectedPatterns.has(`pattern@${key}`))
                                    );
                                    return hasSelectedPattern ? '#800080' : 'rgba(75, 192, 192, 1)';
                                }
                                return 'rgba(75, 192, 192, 1)';
                            },
                            pointRadius: (context) => {
                                const index = context.dataIndex;
                                const patterns = patternValues[index];
                                if (patterns && patterns.length > 0) {
                                    const hasSelectedPattern = patterns.some(p =>
                                        Object.keys(p).some(key => selectedPatterns.has(`pattern@${key}`))
                                    );
                                    return hasSelectedPattern ? 6 : 4;
                                }
                                return 4;
                            },
                            yAxisID: 'y1',
                            hidden: !document.getElementById('layer-price')?.checked
                        },
                        {
                            label: `Prezzo ${targetCurrency}`,
                            data: priceCurrencies,
                            borderColor: 'rgba(100, 200, 100, 1)',
                            backgroundColor: 'transparent',
                            borderWidth: 2,
                            tension: 0.1,
                            pointRadius: 2,
                            yAxisID: 'y1',
                            hidden: !hasPriceCurrency || !document.getElementById('layer-price-currency')?.checked
                        },
                        {
                            label: `${getTranslation('int.exchange') || 'Exchange Rate'} (${dualExchangeLabel || 'N/A'})`,
                            data: exchanges,
                            borderColor: 'rgba(255, 159, 64, 1)',
                            backgroundColor: 'transparent',
                            borderWidth: 2,
                            tension: 0.1,
                            pointRadius: 0,
                            yAxisID: 'y',
                            hidden: !document.getElementById('layer-exchange')?.checked || !hasExchange
                        },
                        {
                            label: `Short (%)`,
                            data: shorts,
                            borderColor: 'rgba(255, 99, 132, 1)',
                            backgroundColor: 'transparent',
                            borderWidth: 2,
                            tension: 0.1,
                            pointRadius: 0,
                            yAxisID: 'y',
                            hidden: !document.getElementById('layer-short')?.checked || shorts.every(v => v === 0)
                        },
                        {
                            label: 'Volume',
                            type: 'bar',
                            data: volumeValues,
                            backgroundColor: 'rgba(100, 149, 237, 0.35)',
                            borderColor: 'rgba(100, 149, 237, 0.7)',
                            borderWidth: 1,
                            yAxisID: 'y2',
                            hidden: !hasVolume || !document.getElementById('layer-volume')?.checked
                        }
                    ]
                },
                plugins: [forceArrowsPlugin, rsiArrowsPlugin, invariancePointsPlugin, {
                    id: 'eventsPlugin',
                    afterDatasetsDraw(chart) {
                        if (!document.getElementById('layer-event')?.checked) return;
                        const { ctx, chartArea, scales } = chart;
                        const xLabels = chart.data.labels;

                        ctx.save();
                        ctx.strokeStyle = 'red';
                        ctx.lineWidth = 1;
                        newsSymbols = [];

                        xLabels.forEach((label, index) => {
                            if (eventDataRaw[label]) {
                                const x = scales.x.getPixelForValue(label);
                                const y = chartArea.top + 10;
                                const radius = 8;
                                const event = eventDataRaw[label];

                                if (event && event.dividend && event.date_trade) {
                                    const tradeIndex = xLabels.indexOf(event.date_trade);
                                    if (tradeIndex !== -1) {
                                        const xTrade = scales.x.getPixelForValue(event.date_trade);
                                        const priceValue = chart.data.datasets[0].data[tradeIndex];
                                        if (priceValue !== undefined && priceValue !== null && scales.y1) {
                                            const yStart = scales.y1.getPixelForValue(priceValue);
                                            const yEnd = scales.y1.getPixelForValue(priceValue + parseFloat(event.dividend));
                                            ctx.save();
                                            ctx.beginPath();
                                            ctx.strokeStyle = 'green';
                                            ctx.lineWidth = 2;
                                            ctx.moveTo(xTrade, yStart);
                                            ctx.lineTo(xTrade, yEnd);
                                            ctx.stroke();
                                            ctx.restore();
                                        }
                                    }
                                }

                                const isDividend = event && event.dividend;
                                ctx.fillStyle = isDividend ? 'green' : 'red';
                                ctx.beginPath();
                                ctx.arc(x, y, radius, 0, 2 * Math.PI);
                                ctx.fill();

                                ctx.fillStyle = 'white';
                                ctx.font = 'bold 10px Arial';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillText(isDividend ? 'D' : 'N', x, y);

                                newsSymbols.push({ x, y, radius, label, kind: 'news' });
                            }

                            const instEvents = eventInstrumentRaw[label];
                            if (Array.isArray(instEvents) && instEvents.length > 0) {
                                const x = scales.x.getPixelForValue(label);
                                const radius = 8;
                                const y = chartArea.top + 10 + (eventDataRaw[label] ? 2 * radius + 4 : 0);

                                ctx.fillStyle = '#16a34a';
                                ctx.beginPath();
                                ctx.arc(x, y, radius, 0, 2 * Math.PI);
                                ctx.fill();

                                ctx.fillStyle = 'white';
                                ctx.font = 'bold 10px Arial';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillText('I', x, y);

                                newsSymbols.push({ x, y, radius, label, kind: 'instrument' });
                            }
                        });
                        ctx.restore();
                    }
                }],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            display: (!!document.getElementById('layer-exchange')?.checked && hasExchange) || !!document.getElementById('layer-short')?.checked,
                            position: 'left',
                            beginAtZero: false,
                            grace: '10%',
                            ticks: {
                                callback: function (value) {
                                    const hasShort = document.getElementById('layer-short')?.checked;
                                    const hasExch = document.getElementById('layer-exchange')?.checked;
                                    if (hasShort && !hasExch) return value.toFixed(2) + '%';
                                    if (hasExch && !hasShort) return value.toFixed(4);
                                    return value.toLocaleString();
                                }
                            },
                            title: {
                                display: !!document.getElementById('layer-exchange')?.checked && hasExchange,
                                text: getTranslation('int.exchange') || 'Exchange',
                                color: 'rgba(255, 159, 64, 1)'
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            grace: '10%',
                            ticks: {
                                callback: function (value) {
                                    return value.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                                }
                            },
                            grid: {
                                drawOnChartArea: false,
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                color: '#666'
                            },
                            title: {
                                display: !!document.getElementById('layer-price')?.checked,
                                text: getTranslation('int.prices') || 'Prezzo'
                            }
                        },
                        y2: {
                            type: 'linear',
                            display: hasVolume && !!document.getElementById('layer-volume')?.checked,
                            position: 'right',
                            beginAtZero: true,
                            grid: {
                                drawOnChartArea: false
                            },
                            ticks: {
                                callback: function (value) {
                                    return formatVolume(value);
                                },
                                color: 'rgba(100, 149, 237, 0.9)'
                            },
                            title: {
                                display: hasVolume && !!document.getElementById('layer-volume')?.checked,
                                text: 'Volume',
                                color: 'rgba(100, 149, 237, 0.9)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                maxRotation: 45,
                                minRotation: 45
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                filter: function (item, chart) {
                                    if (!chart || !chart.data || !chart.data.datasets || !chart.data.datasets[item.datasetIndex]) {
                                        return false;
                                    }
                                    return !chart.data.datasets[item.datasetIndex].hidden;
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                afterBody: function (context) {
                                    if (context.length === 0) return [];
                                    const index = context[0].dataIndex;
                                    const lines = [];
                                    const priceDS = context[0].chart.data.datasets[0];

                                    if (document.getElementById('layer-price')?.checked && document.getElementById('layer-force')?.checked) {
                                        const forceObj = priceDS.forceValues ? priceDS.forceValues[index] : null;
                                        if (forceObj && Object.keys(forceObj).length > 0) {
                                            if (selectedForceField && forceObj[selectedForceField] !== undefined) {
                                                const force = forceObj[selectedForceField];
                                                if (force !== 0) {
                                                    lines.push(`⚡ ${getTranslation(selectedForceField)}: ${force > 0 ? '▲' : '▼'} ${Math.abs(force).toFixed(2)}`);
                                                }
                                            } else {
                                                Object.entries(forceObj).forEach(([field, force]) => {
                                                    if (force !== 0) {
                                                        lines.push(`⚡ ${getTranslation(field)}: ${force > 0 ? '▲' : '▼'} ${Math.abs(force).toFixed(2)}`);
                                                    }
                                                });
                                            }
                                        }
                                    }

                                    if (document.getElementById('layer-rsi')?.checked) {
                                        const rsiObj = priceDS.rsiValues ? priceDS.rsiValues[index] : null;
                                        if (rsiObj && Object.keys(rsiObj).length > 0) {
                                            Object.entries(rsiObj).forEach(([field, val]) => {
                                                if (val !== undefined && val !== null) {
                                                    lines.push(`📈 ${getTranslation(field)}: ${Math.round(parseValue(val))}`);
                                                }
                                            });
                                        }
                                    }

                                    const patternArray = priceDS.patternValues ? priceDS.patternValues[index] : null;

                                    const invObj = priceDS.invValues ? priceDS.invValues[index] : null;
                                    if (invObj && Object.keys(invObj).length > 0) {
                                        const delta = invObj['invariance@delta'];
                                        const regime = invObj['invariance@regime'];

                                        if (delta !== undefined && delta !== null && document.getElementById('layer-invariance-delta')?.checked) {
                                            const deltaLabel = typeof delta === 'number' ? delta.toFixed(6) : delta;
                                            lines.push(`Δ Invariance: ${deltaLabel}`);
                                        }
                                        if (regime && document.getElementById('layer-invariance-regime')?.checked) {
                                            lines.push(`👁 Regime: ${regime}`);
                                        }
                                    }

                                    if (patternArray && patternArray.length > 0 && document.getElementById('layer-pattern')?.checked) {
                                        const filteredPatterns = patternArray.filter(p => {
                                            const key = Object.keys(p)[0];
                                            return selectedPatterns.has(`pattern@${key}`);
                                        });

                                        if (filteredPatterns.length > 0) {
                                            lines.push(`🔍 Pattern:`);
                                            filteredPatterns.forEach(p => {
                                                Object.entries(p).forEach(([key, val]) => {
                                                    lines.push(`  • ${key}: ${val}`);
                                                });
                                            });
                                        }
                                    }
                                    const shortDS = context[0].chart.data.datasets.find(ds => ds.label === 'Short (%)');
                                    if (shortDS && !shortDS.hidden) {
                                        const shortVal = shortDS.data[index];
                                        if (shortVal !== 0 && shortVal !== null && shortVal !== undefined) {
                                            lines.push(`📉 Short: ${shortVal.toFixed(2)}%`);
                                        }
                                    }

                                    return lines;
                                },
                                // Etichette del tooltip: prezzo tradotto (int.prices) e volume formattato (una sola riga Volume)
                                label: function (ctx) {
                                    const ds = ctx.dataset;
                                    let name = ds.label || '';
                                    let value = ctx.formattedValue;
                                    if (ctx.datasetIndex === 0) {
                                        name = getTranslation('int.prices') || 'Prezzo';
                                    } else if (ctx.datasetIndex === 1) {
                                        name = `${getTranslation('int.prices') || 'Prezzo'} ${targetCurrency}`;
                                    } else if (ds.yAxisID === 'y2') {
                                        const v = ctx.parsed.y;
                                        value = (v !== null && v !== undefined) ? formatVolume(v) : value;
                                    }
                                    return `${name}: ${value}`;
                                }
                            }
                        }
                    }
                }
            });

            const newsTooltipElement = document.getElementById('news-tooltip');

            canvas.onmousemove = (e) => {
                if (!document.getElementById('layer-event')?.checked) {
                    newsTooltipElement.style.display = 'none';
                    return;
                }
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                let hoveredSymbol = null;
                for (const symbol of newsSymbols) {
                    const dist = Math.sqrt((mouseX - symbol.x) ** 2 + (mouseY - symbol.y) ** 2);
                    if (dist <= symbol.radius + 5) {
                        hoveredSymbol = symbol;
                        break;
                    }
                }

                if (hoveredSymbol && hoveredSymbol.kind === 'instrument') {
                    const items = eventInstrumentRaw[hoveredSymbol.label] || [];
                    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
                    let html = `<b>ℹ️ ${esc(hoveredSymbol.label)}</b>`;
                    items.forEach(it => {
                        html += `<div>`;
                        if (it.type_news) html += `<span class="news-label">${esc(it.type_news)}:</span> `;
                        html += `${esc(it.value)}`;
                        if (it.date_insert) html += ` <span class="news-label">(${esc(it.date_insert)})</span>`;
                        html += `</div>`;
                    });

                    newsTooltipElement.innerHTML = html;
                    newsTooltipElement.style.display = 'block';

                    const tooltipWidth = newsTooltipElement.offsetWidth;
                    let leftPos = hoveredSymbol.x + 15;
                    if (leftPos + tooltipWidth > rect.width) {
                        leftPos = hoveredSymbol.x - tooltipWidth - 15;
                    }
                    newsTooltipElement.style.left = leftPos + 'px';
                    newsTooltipElement.style.top = (hoveredSymbol.y + 10) + 'px';
                    canvas.style.cursor = 'help';
                } else if (hoveredSymbol) {
                    const event = eventDataRaw[hoveredSymbol.label];
                    if (event) {
                        let html = `<b>🚩 NEWS: ${hoveredSymbol.label}</b>`;
                        if (event.title) html += `<div><span class="news-label">Title:</span> ${event.title}</div>`;
                        if (event.summary) html += `<div><span class="news-label">Summary:</span> ${event.summary}</div>`;
                        if (event.source) html += `<div><span class="news-label">Source:</span> ${event.source}</div>`;
                        if (event.location) html += `<div><span class="news-label">Location:</span> ${event.location}</div>`;
                        if (event.date_settlement) html += `<div><span class="news-label">Settlement:</span> ${event.date_settlement}</div>`;
                        if (event.date_trade) html += `<div><span class="news-label">Trade:</span> ${event.date_trade}</div>`;
                        if (event.dividend) html += `<div><span class="news-label">Dividend:</span> ${event.dividend}</div>`;

                        newsTooltipElement.innerHTML = html;
                        newsTooltipElement.style.display = 'block';

                        const tooltipWidth = newsTooltipElement.offsetWidth;
                        let leftPos = hoveredSymbol.x + 15;
                        if (leftPos + tooltipWidth > rect.width) {
                            leftPos = hoveredSymbol.x - tooltipWidth - 15;
                        }
                        newsTooltipElement.style.left = leftPos + 'px';
                        newsTooltipElement.style.top = (hoveredSymbol.y + 10) + 'px';
                        canvas.style.cursor = 'help';
                    }
                } else {
                    newsTooltipElement.style.display = 'none';
                    canvas.style.cursor = 'default';
                }
            };

            canvas.onmouseleave = () => {
                newsTooltipElement.style.display = 'none';
            };
        }

        function setTimeFilter(months, reload = true) {
            document.querySelectorAll('.time-filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('onclick').includes(months)) {
                    btn.classList.add('active');
                }
            });

            const endDateInput = document.getElementById('end-date').value;
            let end = new Date(endDateInput);

            if (isNaN(end.getTime())) {
                end = new Date();
                document.getElementById('end-date').value = end.toISOString().split('T')[0];
            }

            const start = new Date(end.getTime());

            const m = parseInt(months.replace('M', ''), 10);
            start.setMonth(end.getMonth() - m);

            document.getElementById('start-date').value = start.toISOString().split('T')[0];

            if (reload) {
                loadPrices();
            }
        }

        async function init() {
            document.getElementById('username-display').textContent = username;

            if (!username || !token) {
                document.getElementById('loadingText').textContent = "Access Denied: Username or Token missing";
                return;
            }

            setTimeFilter('M12', false);

            await Promise.all([
                initializeLanguages(),
                loadTranslations(language),
                loadCurrencies(language)
            ]);

            updateUserInfoUI();

            document.getElementById('btn-confirm').textContent = getTranslation('int.apply') || 'Applica';

            document.getElementById('page-title-input').value = initialTitle || getTranslation('int.trend.market') || "Market Trend";

            document.getElementById('close-btn').textContent = getTranslation('int.close') || 'Close';
            if (document.getElementById('user-label-text')) document.getElementById('user-label-text').textContent = (getTranslation('int.user') || 'User') + ':';
            if (document.getElementById('label-start-date')) document.getElementById('label-start-date').textContent = (getTranslation('int.date.start') || 'Start') + ':';
            if (document.getElementById('label-end-date')) document.getElementById('label-end-date').textContent = (getTranslation('int.date.end') || 'End') + ':';

            document.querySelectorAll('.time-filter-btn').forEach(btn => {
                const key = btn.getAttribute('data-i18n');
                if (key) {
                    btn.textContent = getTranslation(key) || btn.textContent;
                }
            });

            const layerPriceLabel = document.querySelector('[for="layer-price"]');
            if (layerPriceLabel) layerPriceLabel.textContent = getTranslation('int.prices') || 'Prices';
            const layerPriceCurrencyLabel = document.getElementById('label-layer-price-currency');
            if (layerPriceCurrencyLabel) layerPriceCurrencyLabel.textContent = `${getTranslation('int.prices') || 'Prices'} ${targetCurrency}`;
            const layerPatternLabel = document.querySelector('[for="layer-pattern"]');
            if (layerPatternLabel) layerPatternLabel.textContent = getTranslation('int.pattern') || 'Pattern';
            const layerExchangeLabel = document.querySelector('[for="layer-exchange"]');
            if (layerExchangeLabel) layerExchangeLabel.textContent = getTranslation('int.exchange') || 'Exchange';
            const selectLabel = document.getElementById('select-label');
            if (selectLabel) selectLabel.textContent = getTranslation('int.layers') || 'Layers';

            await loadPrices();
        }

        window.onload = function () {
            try {
                init();
            } catch (error) {
                console.error('===== ERROR IN INIT =====', error);
            }
        };
    </script>
</body>

</html>
