<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Estimates 0.1</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/png" href="images/icon-finest.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap');

    :root {
      --bg-color: #f5f5f0;
      --text-color: #333;
      --accent-color: #000;
      --paper-bg: #fff;
      --shadow-color: rgba(0, 0, 0, 0.08);
      --border-color: #000;
      --sidebar-width: 90px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      background-color: var(--bg-color);
      background-image: url('images/background.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      margin: 0;
      padding-right: var(--sidebar-width);
      color: var(--text-color);
    }

    /* ========== SIDEBAR NERA A DESTRA ========== */
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background: #000;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 0;
      gap: 20px;
      box-shadow: -2px 0 15px rgba(0, 0, 0, 0.4);
    }

    .sidebar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #00ffff;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      padding: 8px 4px;
      width: 100%;
      background: transparent;
      border: none;
    }

    .sidebar-item:hover {
      color: #fff;
      text-shadow: 0 0 8px #00ffff;
      background: rgba(0, 255, 255, 0.08);
    }

    .sidebar-item i {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .sidebar-item.static {
      cursor: default;
    }

    .sidebar-item.static:hover {
      background: transparent;
      color: #00ffff;
      text-shadow: none;
    }

    .sidebar-divider {
      width: 60%;
      height: 1px;
      background: rgba(0, 255, 255, 0.3);
      margin: 5px 0;
    }

    #languageCombo {
      width: 78px;
      padding: 5px 2px;
      border: 1px solid #00ffff;
      background: rgba(0, 0, 0, 0.8);
      color: #00ffff;
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.7rem;
      outline: none;
      box-shadow: 0 0 5px #00ffff;
      text-shadow: 0 0 5px #00ffff;
      border-radius: 3px;
      text-align: center;
      transition: all 0.3s ease;
      margin-top: 2px;
    }

    #languageCombo:hover {
      box-shadow: 0 0 12px #00ffff;
      transform: scale(1.03);
    }

    #languageCombo option {
      background: #000;
      color: #00ffff;
    }

    /* ========== OFFLINE OVERLAY ========== */
    .offline-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: calc(100% - var(--sidebar-width));
      height: 100%;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.9);
      flex-direction: column;
    }

    .offline-container img {
      max-width: 80%;
      max-height: 70%;
    }

    .offline-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 5rem;
      font-weight: bold;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 5px;
      border-bottom: 3px solid #000;
      padding-bottom: 20px;
    }

    .maintenance-info {
      margin-top: 30px;
      display: none;
      flex-direction: column;
      gap: 15px;
      background: var(--paper-bg);
      border: 1px solid var(--border-color);
      padding: 30px 40px;
      box-shadow: 0 4px 15px var(--shadow-color);
      font-family: 'Cormorant Garamond', serif;
      text-align: left;
      min-width: 350px;
    }

    .maintenance-info p {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0;
      gap: 20px;
      font-size: 1.1rem;
      color: var(--text-color);
      border-bottom: 1px dotted #ccc;
      padding-bottom: 5px;
    }

    .maintenance-info p:last-child {
      border-bottom: none;
    }

    .maintenance-info .label {
      font-weight: bold;
      font-style: italic;
      color: #555;
    }

    .maintenance-info .value {
      font-weight: normal;
      color: #000;
      text-align: right;
    }

    /* ========== TRON FOOTER ========== */
    .tron-footer {
      position: fixed;
      bottom: 20px;
      left: calc(50% - var(--sidebar-width) / 2);
      transform: translateX(-50%);
      z-index: 11000;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: #00ffff;
      text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff;
      letter-spacing: 1px;
      padding: 8px 20px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 4px;
      display: none;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <!-- Sidebar nera a destra -->
  <div class="sidebar">
    <button class="sidebar-item" id="signin-btn" onclick="goToLogin()">
      <i class="fa fa-sign-in"></i>
      <span id="signin-text"></span>
    </button>

    <div class="sidebar-divider"></div>

    <div class="sidebar-item static">
      <i class="fa fa-globe"></i>
      <span>LANG</span>
      <select id="languageCombo">
        <option value="" id="loadingOption">Loading...</option>
      </select>
    </div>
  </div>

  <!-- Offline overlay -->
  <div class="offline-container" id="offline-container">
    <img src="status/images/off-line.svg" alt="Server Offline">
    <div id="maintenance-info" class="maintenance-info" style="display: none;"></div>
  </div>

  <div id="tron-footer" class="tron-footer"></div>

  <script>
    console.log("=== FinEst Index v0.21 alfa ===");
    console.log("📅 " + new Date().toISOString());

    let language = 'en_UK';
    let translations = {};
    let availableLanguages = [];
    let maintenanceManifestGlobal = null;

    console.log("🌍 Default language:", language);

    // Load language manifest
    async function loadLanguageManifest() {
      console.log("📋 Loading language manifest...");
      try {
        const response = await fetch('lang/manifest.json');
        if (!response.ok) {
          console.warn("⚠️ Cannot load manifest.json, status:", response.status);
          return [];
        }
        const manifest = await response.json();
        console.log("✅ Manifest loaded, languages:", manifest.languages || []);
        return manifest.languages || [];
      } catch (error) {
        console.error("❌ Error loading manifest:", error);
        return [];
      }
    }

    // Load language file
    async function loadLanguageFile(langCode) {
      console.log("📚 Loading language file:", langCode);
      try {
        const response = await fetch(`lang/${langCode}.json`);
        if (!response.ok) {
          console.warn("⚠️ Language file not found:", langCode, "status:", response.status);
          return null;
        }
        const data = await response.json();
        if (data['int.language.code'] && data['int.language.description'] && data['img.language.flag']) {
          console.log("✅ Language file loaded:", langCode);
          return {
            code: data['int.language.code'],
            description: data['int.language.description'],
            flag: data['img.language.flag']
          };
        }
        console.warn("⚠️ Invalid language file structure:", langCode);
        return null;
      } catch (error) {
        console.error("❌ Error loading language file:", langCode, error);
        return null;
      }
    }

    // Initialize languages
    async function initializeLanguages() {
      console.log("🌍 Initializing languages...");
      const langCodes = await loadLanguageManifest();
      console.log("📋 Found", langCodes.length, "languages in manifest");

      for (const langCode of langCodes) {
        const langData = await loadLanguageFile(langCode);
        if (langData) {
          availableLanguages.push(langData);
          console.log("✅ Language added:", langData.code, langData.description);
        }
      }

      console.log("✅ Languages initialized, total:", availableLanguages.length);
    }

    // Update language combo
    function updateLanguageCombo() {
      console.log("🔄 Updating language combo, available:", availableLanguages.length);
      const combo = document.getElementById('languageCombo');
      combo.innerHTML = '';
      if (availableLanguages.length === 0) {
        console.warn("⚠️ No languages available to populate combo");
        combo.innerHTML = '<option value="">No languages</option>';
        return;
      }
      availableLanguages.forEach(lang => {
        const option = document.createElement('option');
        option.value = lang.code;
        option.textContent = `${lang.flag} ${lang.code.toUpperCase()}`;
        if (lang.code === language) {
          option.selected = true;
          console.log("🎯 Selected language:", lang.code);
        }
        combo.appendChild(option);
      });
      console.log("✅ Language combo updated, current language:", language);
    }

    // Load translations
    async function loadTranslations(lang) {
      console.log("📚 Loading translations for:", lang);
      try {
        const response = await fetch(`lang/${lang}.json`);
        if (!response.ok) {
          console.warn("⚠️ Translation file not found:", lang, "status:", response.status);
          throw new Error('Translation file not found');
        }
        translations = await response.json();
        console.log("✅ Translations loaded for:", lang, "keys:", Object.keys(translations).length);
      } catch (error) {
        console.error('❌ Error loading translations:', error);
      }
    }

    // Get translation
    function getTranslation(key) {
      const result = translations[key] || key;
      if (!translations[key]) {
        console.debug("🔍 Translation missing for key:", key);
      }
      return result;
    }

    // Update page translations
    function updatePageTranslations() {
      console.log("🔄 Updating page translations for language:", language);
      const signinText = document.getElementById('signin-text');
      if (signinText) {
        const text = getTranslation('int.signin');
        signinText.textContent = text;
        console.log("   signin-text:", text);
      }

      const signinBtn = document.getElementById('signin-btn');
      if (signinBtn) {
        const text = getTranslation('int.signin');
        signinBtn.title = text;
      }

      if (maintenanceManifestGlobal) {
        console.log("🔄 Re-rendering maintenance info on language change");
        renderMaintenanceInfo(maintenanceManifestGlobal);
      }

      console.log("✅ Page translations updated");
    }

    // Change language
    async function changeLanguage(langCode) {
      console.log("🌍 Changing language from", language, "to", langCode);
      language = langCode;
      localStorage.setItem('selectedLanguage', langCode);
      await loadTranslations(langCode);
      updateLanguageCombo();
      updatePageTranslations();

      if (maintenanceManifestGlobal) {
        console.log("🔄 Re-rendering maintenance info after language change");
        renderMaintenanceInfo(maintenanceManifestGlobal);
      }
      console.log("✅ Language changed to:", langCode);
    }

    // Language combo event listener
    document.getElementById('languageCombo').addEventListener('change', async (e) => {
      const selectedLang = e.target.value;
      console.log("🔍 Language selector changed to:", selectedLang);
      if (selectedLang) {
        await changeLanguage(selectedLang);
      }
    });

    // Go to login page
    function goToLogin() {
      console.log("🔐 Navigating to login page");
      window.location.href = 'login.html';
    }

    // Check maintenance status
    async function checkMaintenanceStatus() {
      console.log("🔍 Checking maintenance status...");
      try {
        const response = await fetch('status/manifest.json', { cache: "no-cache" });
        if (!response.ok) {
          console.log("ℹ️ Maintenance manifest not found, status:", response.status);
          return null;
        }

        const manifest = await response.json();
        console.log("✅ Maintenance manifest loaded:", manifest);

        const signinBtn = document.getElementById('signin-btn');
        if (signinBtn) {
          if (manifest['status.stop'] === "True") {
            console.log("🚫 Login disabled (status.stop = True)");
            signinBtn.style.pointerEvents = 'none';
            signinBtn.style.opacity = '0.5';
            signinBtn.onclick = null;
          } else {
            console.log("✅ Login enabled (status.stop != True)");
            signinBtn.style.pointerEvents = 'auto';
            signinBtn.style.opacity = '1';
            signinBtn.onclick = goToLogin;
          }
        }

        const showStatus = manifest['show.status'] || manifest.show;
        const showVersion = manifest['show.version'];
        console.log("📊 show.status:", showStatus, "show.version:", showVersion);

        if (showStatus === "True" || showVersion === "True") {
          console.log("📋 Maintenance info will be displayed");
          return manifest;
        }
      } catch (error) {
        console.error("❌ Error checking maintenance status:", error);
      }
      console.log("ℹ️ No maintenance info to display");
      return null;
    }

    // Render maintenance overlay
    function renderMaintenanceInfo(manifest) {
      console.log("🖥️ Rendering maintenance info...");
      const offlineContainer = document.getElementById('offline-container');
      const offlineImg = offlineContainer.querySelector('img');
      const infoContainer = document.getElementById('maintenance-info');

      const showStatus = manifest['show.status'] || manifest.show;
      console.log("📊 show.status:", showStatus);

      if (showStatus === "True") {
        if (manifest.status) {
          const imgPath = "status/images/" + manifest.status + ".svg";
          offlineImg.src = imgPath;
          console.log("🖼️ Status image set to:", imgPath);
        } else if (manifest.image) {
          offlineImg.src = "status/" + manifest.image;
          console.log("🖼️ Fallback image set to:", "status/" + manifest.image);
        }
        offlineImg.style.display = 'block';
        offlineContainer.style.pointerEvents = 'auto';
        offlineContainer.style.background = 'rgba(255, 255, 255, 0.9)';
      } else {
        offlineImg.style.display = 'none';
        offlineContainer.style.pointerEvents = 'none';
        offlineContainer.style.background = 'transparent';
      }

      offlineContainer.style.display = 'flex';

      let infoHTML = '';

      if (manifest['int.status.message'] === "True") {
        const message = getTranslation('int.status.message');
        infoHTML += `
          <p style="justify-content: center; margin-bottom: 15px;">
            <span class="value" style="color: #00ffff; font-size: 1.2rem; text-align: center;">${message}</span>
          </p>
        `;
        console.log("📝 Status message displayed:", message);
      }

      if (manifest['show.version'] === "True") {
        const tronFooter = document.getElementById('tron-footer');
        if (tronFooter) {
          const version = getTranslation('int.version') + ' ' + manifest['int.version'];
          const dateVersion = getTranslation('int.date.version') + ' ' + manifest['int.date.version'];
          const author = getTranslation('int.author') + ' ' + manifest['int.author'];
          tronFooter.innerHTML = `${version} | ${dateVersion} | ${author}`;
          tronFooter.style.display = 'block';
          console.log("📄 Footer displayed:", version, dateVersion, author);
        }
      } else {
        const tronFooter = document.getElementById('tron-footer');
        if (tronFooter) {
          tronFooter.style.display = 'none';
          console.log("📄 Footer hidden");
        }
      }

      if (infoHTML) {
        infoContainer.style.display = 'flex';
        infoContainer.innerHTML = infoHTML;
        console.log("📝 Info container displayed with content");
      } else {
        infoContainer.style.display = 'none';
        console.log("📝 Info container hidden (no content)");
      }
    }

    // Health check
    async function checkHealth() {
      console.log("🏥 Performing health check...");
      const apiBaseUser = "https://user-tunnel.fe-web.eu";
      const apiBaseNew = "https://new-user-tunnel.fe-web.eu";

      try {
        console.log("📡 Checking user-tunnel:", apiBaseUser + "/health");
        const resUser = await fetch(`${apiBaseUser}/health`, { cache: "no-cache" });
        console.log("📡 user-tunnel response:", resUser.status, resUser.statusText);

        console.log("📡 Checking new-user-tunnel:", apiBaseNew + "/health");
        const resNew = await fetch(`${apiBaseNew}/health`, { cache: "no-cache" });
        console.log("📡 new-user-tunnel response:", resNew.status, resNew.statusText);

        if (!resUser.ok || !resNew.ok) {
          console.warn("⚠️ One or both services unhealthy");
          throw new Error("Services unavailable");
        }
        console.log("✅ Services healthy");
      } catch (err) {
        console.error("❌ Server offline:", err);
        console.log("🖥️ Showing offline container");
        document.getElementById('offline-container').style.display = 'flex';
      }
    }

    // Initialize
    async function init() {
      console.log("🚀 Initializing application...");
      console.log("📅 " + new Date().toISOString());

      const savedLang = localStorage.getItem('selectedLanguage');
      if (savedLang) {
        language = savedLang;
        console.log("🌍 Using saved language:", language);
      } else {
        console.log("🌍 No saved language, using default:", language);
      }

      console.log("📚 Loading languages and translations...");
      await initializeLanguages();
      await loadTranslations(language);
      updateLanguageCombo();
      updatePageTranslations();

      console.log("🔍 Checking maintenance status...");
      const maintenanceManifest = await checkMaintenanceStatus();

      if (maintenanceManifest) {
        maintenanceManifestGlobal = maintenanceManifest;
        console.log("📋 Maintenance mode active, rendering maintenance info");
        renderMaintenanceInfo(maintenanceManifest);
      } else {
        console.log("ℹ️ No maintenance mode, performing health check...");
        await checkHealth();
      }

      console.log("✅ Application initialized successfully");
    }

    // Console timestamp override
    const originalLog = console.log;
    console.log = function () {
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
      originalLog.apply(console, [`[${timestamp}]`, ...arguments]);
    };

    const originalWarn = console.warn;
    console.warn = function () {
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
      originalWarn.apply(console, [`[${timestamp}] ⚠️`, ...arguments]);
    };

    const originalError = console.error;
    console.error = function () {
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
      originalError.apply(console, [`[${timestamp}] ❌`, ...arguments]);
    };

    const originalDebug = console.debug;
    console.debug = function () {
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
      originalDebug.apply(console, [`[${timestamp}] 🔍`, ...arguments]);
    };

    init();
  </script>
</body>

</html>
