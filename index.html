<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Estimates 0.1</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/png" href="images/icon-finest.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap');

    :root {
      --bg-color: #f5f5f0;
      --text-color: #333;
      --accent-color: #000;
      --paper-bg: #fff;
      --shadow-color: rgba(0, 0, 0, 0.08);
      --border-color: #000;
      --sidebar-width: 260px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      background-color: #000;
      color: var(--text-color);
      overflow: hidden;
    }

    /* ========== AREA IMMAGINE (occupa tutto lo spazio tranne la sidebar) ========== */
    .image-area {
      position: fixed;
      inset: 0;
      background: #000 url('images/background.png') center / cover no-repeat;
    }

    /* ========== SIDEBAR NERA A DESTRA ========== */
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--sidebar-width);
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      gap: 20px;
      box-shadow: -2px 0 15px rgba(0, 0, 0, 0.6);
      border-left: 1px solid rgba(0, 255, 255, 0.15);
      overflow-y: auto;
    }

    .sidebar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #00ffff;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      padding: 10px 4px;
      width: 100%;
      background: transparent;
      border: none;
    }

    .sidebar-item:hover {
      color: #fff;
      text-shadow: 0 0 8px #00ffff;
      background: rgba(0, 255, 255, 0.08);
    }

    .sidebar-item i {
      font-size: 1.7rem;
      margin-bottom: 4px;
    }

    .sidebar-item.static {
      cursor: default;
    }

    .sidebar-item.static:hover {
      background: transparent;
      color: #00ffff;
      text-shadow: none;
    }

    .sidebar-divider {
      width: 70%;
      height: 1px;
      background: rgba(0, 255, 255, 0.3);
      margin: 8px 0;
    }

    #languageCombo {
      width: 100%;
      padding: 8px 6px;
      border: 1px solid #00ffff;
      background: rgba(0, 0, 0, 0.85);
      color: #00ffff;
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      outline: none;
      box-shadow: 0 0 5px #00ffff;
      text-shadow: 0 0 5px #00ffff;
      border-radius: 3px;
      text-align: left;
      transition: all 0.3s ease;
      margin-top: 6px;
    }

    #languageCombo:hover {
      box-shadow: 0 0 12px #00ffff;
    }

    #languageCombo option {
      background: #000;
      color: #00ffff;
    }

    /* ========== OFFLINE OVERLAY ========== */
    .offline-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      pointer-events: auto;
    }

    .offline-container img {
      max-width: 70%;
      max-height: 60%;
      display: block;
    }

    .offline-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 5rem;
      font-weight: bold;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 5px;
      border-bottom: 3px solid #000;
      padding-bottom: 20px;
    }

    .maintenance-info {
      margin-top: 30px;
      display: none;
      flex-direction: column;
      gap: 15px;
      background: var(--paper-bg);
      border: 1px solid var(--border-color);
      padding: 30px 40px;
      box-shadow: 0 4px 15px var(--shadow-color);
      font-family: 'Cormorant Garamond', serif;
      text-align: left;
      min-width: 350px;
    }

    .maintenance-info p {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0;
      gap: 20px;
      font-size: 1.1rem;
      color: var(--text-color);
      border-bottom: 1px dotted #ccc;
      padding-bottom: 5px;
    }

    .maintenance-info p:last-child {
      border-bottom: none;
    }

    .maintenance-info .label {
      font-weight: bold;
      font-style: italic;
      color: #555;
    }

    .maintenance-info .value {
      font-weight: normal;
      color: #000;
      text-align: right;
    }

    /* ========== TRON FOOTER ========== */
    .tron-footer {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 11000;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: #00ffff;
      text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff;
      letter-spacing: 1px;
      padding: 8px 20px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 4px;
      display: none;
      pointer-events: none;
      white-space: nowrap;
    }

    /* ========== MESSAGGI (info / warning / errore) ========== */
    .toasts {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(460px, calc(100vw - var(--sidebar-width) - 48px));
      pointer-events: none;
    }

    .toast {
      --tc: #00ffff;
      pointer-events: auto;
      display: grid;
      grid-template-columns: auto 1fr auto;
      column-gap: 12px;
      row-gap: 4px;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(6px);
      border: 1px solid var(--tc);
      border-left-width: 4px;
      color: #ddd;
      font-size: 1.05rem;
      line-height: 1.3;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
      animation: toast-in 0.25s ease-out;
    }

    .toast.success {
      --tc: #4ade80;
    }

    .toast.warning {
      --tc: #fbbf24;
    }

    .toast.error {
      --tc: #ff5c5c;
    }

    .toast>* {
      grid-column: 2;
    }

    .toast .ti {
      grid-column: 1;
      grid-row: 1 / span 5;
      color: var(--tc);
      font-size: 1.3rem;
      margin-top: 2px;
    }

    .toast .tt {
      color: var(--tc);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .toast .tm {
      color: #fff;
      font-weight: 700;
      font-size: 1.15rem;
    }

    .toast .tx {
      color: #9ab;
      font: 0.78rem 'Courier New', monospace;
      word-break: break-word;
    }

    .toast .tc {
      grid-column: 3;
      grid-row: 1;
      background: none;
      border: 0;
      color: #aaa;
      cursor: pointer;
      font-size: 1rem;
    }

    .toast .tc:hover,
    .toast .tc:focus-visible {
      color: #fff;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateX(-12px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .toast {
        animation: none;
      }
    }

    /* ========== MOBILE: opzioni in barra inferiore ========== */
    @media (max-width: 720px) {
      .toasts {
        width: calc(100vw - 32px);
      }

      .sidebar {
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: auto;
        flex-direction: row;
        justify-content: space-around;
        align-items: flex-start;
        padding: 10px;
        gap: 10px;
        border-left: 0;
        border-top: 1px solid rgba(0, 255, 255, 0.15);
      }

      .sidebar-divider {
        display: none;
      }

      .sidebar-item {
        width: auto;
      }

      .tron-footer {
        bottom: 110px;
      }

      .image-area {
        padding-right: 0 !important;
        padding-bottom: 110px;
        overflow-y: auto;
      }
    }
  </style>
</head>

<body>

  <!-- Immagine di sfondo a tutta pagina -->
  <div class="image-area" id="image-area"></div>

  <!-- Opzioni a destra, sopra l'immagine -->
  <div class="sidebar">
    <button class="sidebar-item" id="signin-btn" onclick="goToLogin()">
      <i class="fa fa-sign-in"></i>
      <span id="signin-text"></span>
    </button>

    <div class="sidebar-divider"></div>

    <div class="sidebar-item static">
      <i class="fa fa-globe"></i>
      <span>LANG</span>
      <select id="languageCombo">
        <option value="" id="loadingOption">Loading...</option>
      </select>
    </div>
  </div>

  <!-- Offline overlay -->
  <div class="offline-container" id="offline-container">
    <img src="status/images/off-line.svg" alt="Server Offline">
    <div id="maintenance-info" class="maintenance-info" style="display: none;"></div>
  </div>

  <div id="tron-footer" class="tron-footer"></div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script>
    console.log("=== FinEst Index v0.21 alfa ===");
    console.log("📅 " + new Date().toISOString());

    let language = 'en_UK';
    let translations = {};

    // ===== Messaggi info/warning/errore: titolo + motivo (web.msg.*) =====
    const MSG_FALLBACK = { "web.msg.type.info": "INFORMATION", "web.msg.type.warning": "WARNING", "web.msg.type.error": "ERROR", "web.msg.type.success": "SUCCESS", "web.msg.technical": "Technical detail", "web.msg.http.status": "Server response: HTTP {status}", "web.msg.login.success": "Signed in", "web.msg.login.success.detail": "Welcome, {user}. Opening the dashboard...", "web.msg.login.failed": "Sign-in failed", "web.msg.login.failed.detail": "Wrong username or password. Check your credentials.", "web.msg.login.locked": "Account locked", "web.msg.login.locked.detail": "This account is locked. Contact the administrator to unlock it.", "web.msg.login.notfound": "User not found", "web.msg.login.notfound.detail": "No user has this name. Check the username or sign up.", "web.msg.login.disabled": "Sign-in suspended", "web.msg.login.disabled.detail": "Sign-in is temporarily disabled: the system is under maintenance.", "web.msg.fields.required": "Required fields missing", "web.msg.fields.required.detail": "Fill in all required fields to continue.", "web.msg.fields.missing": "Missing fields: {fields}.", "web.msg.connection.error": "Connection error", "web.msg.connection.error.detail": "Cannot reach the server. Check your network connection.", "web.msg.server.offline": "Server offline", "web.msg.server.offline.detail": "The service servers are not responding or are temporarily unreachable.", "web.msg.service.degraded": "Partial service", "web.msg.service.degraded.detail": "One or more backend services failed the health check.", "web.msg.service.list": "Services with problems: {services}.", "web.msg.server.error": "Server error", "web.msg.server.error.detail": "The server returned an internal error. Try again shortly; if it persists contact support.", "web.msg.request.invalid": "Invalid data", "web.msg.request.invalid.detail": "The server rejected the submitted data. Check the values and try again.", "web.msg.registration.success": "Registration complete", "web.msg.registration.success.detail": "The account was created. You can now sign in.", "web.msg.registration.failed": "Registration failed", "web.msg.registration.failed.detail": "The account could not be created. Try again with valid data.", "web.msg.registration.exists": "User already registered", "web.msg.registration.exists.detail": "This username is already taken. Choose another or sign in.", "web.msg.profile.saved": "Profile updated", "web.msg.profile.saved.detail": "Your profile information was saved.", "web.msg.profile.error": "Profile update failed", "web.msg.profile.error.detail": "An error occurred while updating the profile data.", "web.msg.profile.incomplete": "Profile incomplete", "web.msg.profile.incomplete.detail": "Complete the missing profile information to continue.", "web.msg.maintenance": "System under maintenance", "web.msg.maintenance.detail": "The service is temporarily suspended for maintenance.", "web.msg.lang.manifest.failed": "Language list unavailable", "web.msg.lang.manifest.failed.detail": "Cannot load lang/manifest.json: the language selector may be empty.", "web.msg.lang.file.failed": "Language files not loaded", "web.msg.lang.file.failed.detail": "These language files are missing or invalid: {langs}.", "web.msg.translations.failed": "Translations not loaded", "web.msg.translations.failed.detail": "Cannot load language file {lang}: default texts are shown.", "web.msg.currencies.failed": "Currencies unavailable", "web.msg.currencies.failed.detail": "Cannot load the currency list: the profile selector will be empty.", "web.msg.timezones.failed": "Time zones unavailable", "web.msg.timezones.failed.detail": "Cannot load the time zone list: the profile selector will be empty.", "web.msg.field.username": "Username", "web.msg.field.password": "Password", "web.msg.field.email": "Email address", "web.msg.field.language": "Language", "web.msg.field.timezone": "Time zone", "web.msg.field.currency": "Currency" };
    const issues = [], langFails = [];
    const later = (...a) => issues.push(a);
    const has = k => translations[k] || MSG_FALLBACK[k];
    function t(key, p) {
      return (has(key) || key).replace(/\{(\w+)\}/g, (m, k) => (p && p[k] !== undefined ? p[k] : m));
    }
    // type: info | success | warning | error;  key: web.msg.<nome> (+ .detail);  o: {params, extra, technical}
    function notify(type, key, o = {}) {
      const box = document.getElementById('toasts');
      box.querySelector(`[data-k="${key}"]`)?.remove();
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.dataset.k = key;
      el.setAttribute('role', type === 'error' ? 'alert' : 'status');
      const icon = { info: 'circle-info', success: 'circle-check', warning: 'triangle-exclamation', error: 'circle-xmark' }[type];
      el.innerHTML = `<i class="fa-solid fa-${icon} ti" aria-hidden="true"></i>` +
        `<button type="button" class="tc"><i class="fa-solid fa-xmark"></i></button>`;
      const add = (c, txt) => { if (!txt) return; const d = document.createElement('div'); d.className = c; d.textContent = txt; el.appendChild(d); };
      add('tt', t('web.msg.type.' + type));
      add('tm', t(key, o.params));
      add('td', has(key + '.detail') && t(key + '.detail', o.params));
      add('td', o.extra);
      add('tx', o.technical && t('web.msg.technical') + ': ' + o.technical);
      const btn = el.querySelector('.tc');
      btn.setAttribute('aria-label', translations['int.close'] || 'Close');
      btn.onclick = () => el.remove();
      box.appendChild(el);
      while (box.children.length > 4) box.firstChild.remove();
      const ms = { success: 6000, info: 8000, warning: 12000 }[type];
      if (ms) setTimeout(() => el.remove(), ms);
      console.log(`💬 [${type}] ${key}`, o.technical || '');
    }
    function flushIssues() {
      if (langFails.length) notify('warning', 'web.msg.lang.file.failed', { params: { langs: langFails.splice(0).join(', ') } });
      issues.splice(0).forEach(a => notify(...a));
    }
    let availableLanguages = [];
    let maintenanceManifestGlobal = null;

    console.log("🌍 Default language:", language);

    // Load language manifest
    async function loadLanguageManifest() {
      console.log("📋 Loading language manifest...");
      try {
        const response = await fetch('lang/manifest.json');
        if (!response.ok) {
          console.warn("⚠️ Cannot load manifest.json, status:", response.status);
          later('warning', 'web.msg.lang.manifest.failed', { technical: t('web.msg.http.status', { status: response.status }) });
          return [];
        }
        const manifest = await response.json();
        console.log("✅ Manifest loaded, languages:", manifest.languages || []);
        return manifest.languages || [];
      } catch (error) {
        console.error("❌ Error loading manifest:", error);
        later('warning', 'web.msg.lang.manifest.failed', { technical: error.message });
        return [];
      }
    }

    // Load language file
    async function loadLanguageFile(langCode) {
      console.log("📚 Loading language file:", langCode);
      try {
        const response = await fetch(`lang/${langCode}.json`);
        if (!response.ok) {
          console.warn("⚠️ Language file not found:", langCode, "status:", response.status);
          return null;
        }
        const data = await response.json();
        if (data['int.language.code'] && data['int.language.description'] && data['img.language.flag']) {
          console.log("✅ Language file loaded:", langCode);
          return {
            code: data['int.language.code'],
            description: data['int.language.description'],
            flag: data['img.language.flag']
          };
        }
        console.warn("⚠️ Invalid language file structure:", langCode);
        return null;
      } catch (error) {
        console.error("❌ Error loading language file:", langCode, error);
        return null;
      }
    }

    // Initialize languages
    async function initializeLanguages() {
      console.log("🌍 Initializing languages...");
      const langCodes = await loadLanguageManifest();
      console.log("📋 Found", langCodes.length, "languages in manifest");

      for (const langCode of langCodes) {
        const langData = await loadLanguageFile(langCode);
        if (langData) {
          availableLanguages.push(langData);
          console.log("✅ Language added:", langData.code, langData.description);
        } else {
          langFails.push(langCode);
        }
      }

      console.log("✅ Languages initialized, total:", availableLanguages.length);
    }

    // Update language combo
    function updateLanguageCombo() {
      console.log("🔄 Updating language combo, available:", availableLanguages.length);
      const combo = document.getElementById('languageCombo');
      combo.innerHTML = '';
      if (availableLanguages.length === 0) {
        console.warn("⚠️ No languages available to populate combo");
        combo.innerHTML = '<option value="">No languages</option>';
        return;
      }
      availableLanguages.forEach(lang => {
        const option = document.createElement('option');
        option.value = lang.code;
        option.textContent = `${lang.flag} ${lang.description}`;
        if (lang.code === language) {
          option.selected = true;
          console.log("🎯 Selected language:", lang.code);
        }
        combo.appendChild(option);
      });
      console.log("✅ Language combo updated, current language:", language);
    }

    // Load translations
    async function loadTranslations(lang) {
      console.log("📚 Loading translations for:", lang);
      try {
        const response = await fetch(`lang/${lang}.json`);
        if (!response.ok) {
          console.warn("⚠️ Translation file not found:", lang, "status:", response.status);
          throw new Error('Translation file not found');
        }
        translations = await response.json();
        console.log("✅ Translations loaded for:", lang, "keys:", Object.keys(translations).length);
      } catch (error) {
        console.error('❌ Error loading translations:', error);
        notify('warning', 'web.msg.translations.failed', { params: { lang }, technical: error.message });
      }
    }

    // Get translation
    function getTranslation(key) {
      const result = translations[key] || key;
      if (!translations[key]) {
        console.debug("🔍 Translation missing for key:", key);
      }
      return result;
    }

    // Update page translations
    function updatePageTranslations() {
      console.log("🔄 Updating page translations for language:", language);
      const signinText = document.getElementById('signin-text');
      if (signinText) {
        const text = getTranslation('int.signin');
        signinText.textContent = text;
        console.log("   signin-text:", text);
      }

      const signinBtn = document.getElementById('signin-btn');
      if (signinBtn) {
        const text = getTranslation('int.signin');
        signinBtn.title = text;
      }

      if (maintenanceManifestGlobal) {
        console.log("🔄 Re-rendering maintenance info on language change");
        renderMaintenanceInfo(maintenanceManifestGlobal);
      }

      console.log("✅ Page translations updated");
    }

    // Change language
    async function changeLanguage(langCode) {
      console.log("🌍 Changing language from", language, "to", langCode);
      language = langCode;
      localStorage.setItem('selectedLanguage', langCode);
      await loadTranslations(langCode);
      updateLanguageCombo();
      updatePageTranslations();

      if (maintenanceManifestGlobal) {
        console.log("🔄 Re-rendering maintenance info after language change");
        renderMaintenanceInfo(maintenanceManifestGlobal);
      }
      console.log("✅ Language changed to:", langCode);
    }

    // Language combo event listener
    document.getElementById('languageCombo').addEventListener('change', async (e) => {
      const selectedLang = e.target.value;
      console.log("🔍 Language selector changed to:", selectedLang);
      if (selectedLang) {
        await changeLanguage(selectedLang);
      }
    });

    // Go to login page
    function goToLogin() {
      console.log("🔐 Navigating to login page");
      window.location.href = 'login.html';
    }

    // Check maintenance status
    async function checkMaintenanceStatus() {
      console.log("🔍 Checking maintenance status...");
      try {
        const response = await fetch('status/manifest.json', { cache: "no-cache" });
        if (!response.ok) {
          console.log("ℹ️ Maintenance manifest not found, status:", response.status);
          return null;
        }

        const manifest = await response.json();
        console.log("✅ Maintenance manifest loaded:", manifest);

        const signinBtn = document.getElementById('signin-btn');
        if (signinBtn) {
          if (manifest['status.stop'] === "True") {
            console.log("🚫 Login disabled (status.stop = True)");
            notify('warning', 'web.msg.login.disabled');
            signinBtn.style.pointerEvents = 'none';
            signinBtn.style.opacity = '0.5';
            signinBtn.onclick = null;
          } else {
            console.log("✅ Login enabled (status.stop != True)");
            signinBtn.style.pointerEvents = 'auto';
            signinBtn.style.opacity = '1';
            signinBtn.onclick = goToLogin;
          }
        }

        const showStatus = manifest['show.status'] || manifest.show;
        const showVersion = manifest['show.version'];
        console.log("📊 show.status:", showStatus, "show.version:", showVersion);

        if (showStatus === "True" || showVersion === "True") {
          console.log("📋 Maintenance info will be displayed");
          return manifest;
        }
      } catch (error) {
        console.error("❌ Error checking maintenance status:", error);
      }
      console.log("ℹ️ No maintenance info to display");
      return null;
    }

    // Render maintenance overlay
    function renderMaintenanceInfo(manifest) {
      console.log("🖥️ Rendering maintenance info...");
      const offlineContainer = document.getElementById('offline-container');
      const offlineImg = offlineContainer.querySelector('img');
      const infoContainer = document.getElementById('maintenance-info');

      const showStatus = manifest['show.status'] || manifest.show;
      console.log("📊 show.status:", showStatus);

      if (showStatus === "True") {
        if (manifest.status) {
          const imgPath = "status/images/" + manifest.status + ".svg";
          offlineImg.src = imgPath;
          console.log("🖼️ Status image set to:", imgPath);
        } else if (manifest.image) {
          offlineImg.src = "status/" + manifest.image;
          console.log("🖼️ Fallback image set to:", "status/" + manifest.image);
        }
        offlineImg.style.display = 'block';
        offlineContainer.style.pointerEvents = 'auto';
        offlineContainer.style.background = 'rgba(0, 0, 0, 0.85)';
      } else {
        offlineImg.style.display = 'none';
        offlineContainer.style.pointerEvents = 'none';
        offlineContainer.style.background = 'transparent';
      }

      offlineContainer.style.display = 'flex';

      let infoHTML = '';

      if (manifest['int.status.message'] === "True") {
        const message = getTranslation('int.status.message');
        infoHTML += `
          <p style="justify-content: center; margin-bottom: 15px;">
            <span class="value" style="color: #00ffff; font-size: 1.2rem; text-align: center;">${message}</span>
          </p>
        `;
        console.log("📝 Status message displayed:", message);
      }

      if (manifest['show.version'] === "True") {
        const tronFooter = document.getElementById('tron-footer');
        if (tronFooter) {
          const version = getTranslation('int.version') + ' ' + manifest['int.version'];
          const dateVersion = getTranslation('int.date.version') + ' ' + manifest['int.date.version'];
          const author = getTranslation('int.author') + ' ' + manifest['int.author'];
          tronFooter.innerHTML = `${version} | ${dateVersion} | ${author}`;
          tronFooter.style.display = 'block';
          console.log("📄 Footer displayed:", version, dateVersion, author);
        }
      } else {
        const tronFooter = document.getElementById('tron-footer');
        if (tronFooter) {
          tronFooter.style.display = 'none';
          console.log("📄 Footer hidden");
        }
      }

      if (infoHTML) {
        infoContainer.style.display = 'flex';
        infoContainer.innerHTML = infoHTML;
        console.log("📝 Info container displayed with content");
      } else {
        infoContainer.style.display = 'none';
        console.log("📝 Info container hidden (no content)");
      }
    }

    // Health check: ogni servizio viene verificato e il motivo del guasto viene mostrato
    async function probe(name, base) {
      try {
        const r = await fetch(`${base}/health`, { cache: "no-cache" });
        return r.ok ? null : { name, reason: t('web.msg.http.status', { status: r.status }) };
      } catch (e) {
        return { name, reason: e.message };
      }
    }

    async function checkHealth() {
      console.log("🏥 Performing health check...");
      const fails = (await Promise.all([
        probe('user-tunnel', "https://user-tunnel.fe-web.eu"),
        probe('new-user-tunnel', "https://new-user-tunnel.fe-web.eu")
      ])).filter(Boolean);
      if (!fails.length) { console.log("✅ Services healthy"); return; }
      document.getElementById('offline-container').style.display = 'flex';
      const all = fails.length === 2;
      notify(all ? 'error' : 'warning', all ? 'web.msg.server.offline' : 'web.msg.service.degraded', {
        extra: t('web.msg.service.list', { services: fails.map(f => f.name).join(', ') }),
        technical: fails.map(f => `${f.name}: ${f.reason}`).join(' | ')
      });
    }

    // Initialize
    async function init() {
      console.log("🚀 Initializing application...");
      console.log("📅 " + new Date().toISOString());

      const savedLang = localStorage.getItem('selectedLanguage');
      if (savedLang) {
        language = savedLang;
        console.log("🌍 Using saved language:", language);
      } else {
        console.log("🌍 No saved language, using default:", language);
      }

      console.log("📚 Loading languages and translations...");
      await initializeLanguages();
      await loadTranslations(language);
      updateLanguageCombo();
      updatePageTranslations();

      flushIssues();
      console.log("🔍 Checking maintenance status...");
      const maintenanceManifest = await checkMaintenanceStatus();
      if (maintenanceManifest && (maintenanceManifest['show.status'] || maintenanceManifest.show) === "True") {
        notify('warning', 'web.msg.maintenance', { extra: maintenanceManifest['int.status.message'] === "True" ? t('int.status.message') : '' });
      }

      if (maintenanceManifest) {
        maintenanceManifestGlobal = maintenanceManifest;
        console.log("📋 Maintenance mode active, rendering maintenance info");
        renderMaintenanceInfo(maintenanceManifest);
      } else {
        console.log("ℹ️ No maintenance mode, performing health check...");
        await checkHealth();
      }

      console.log("✅ Application initialized successfully");
    }

    // Console timestamp override
    const originalLog = console.log;
    console.log = function () {
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
      originalLog.apply(console, [`[${timestamp}]`, ...arguments]);
    };

    const originalWarn = console.warn;
    console.warn = function () {
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
      originalWarn.apply(console, [`[${timestamp}] ⚠️`, ...arguments]);
    };

    const originalError = console.error;
    console.error = function () {
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
      originalError.apply(console, [`[${timestamp}] ❌`, ...arguments]);
    };

    const originalDebug = console.debug;
    console.debug = function () {
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
      originalDebug.apply(console, [`[${timestamp}] 🔍`, ...arguments]);
    };

    init();
  </script>
</body>

</html>
